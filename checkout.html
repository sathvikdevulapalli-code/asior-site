<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Asior</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0b0a08;
    --ink: #f5f3ee;
    --muted: #a89f8f;
    --line: #2b2822;
    --font-display: 'Unbounded', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }

  a:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 1px solid var(--ink);
    outline-offset: 4px;
  }

  img { display: block; max-width: 100%; }

  .teaser-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 34px;
    z-index: 11;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .teaser-bar a {
    color: inherit;
    text-decoration: none;
    position: relative;
    padding-bottom: 2px;
    transition: color 0.3s ease;
  }

  .teaser-bar a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.3s ease;
  }

  .teaser-bar a:hover { color: var(--ink); }
  .teaser-bar a:hover::after { width: 100%; }

  header {
    position: fixed;
    top: 34px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px 40px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    z-index: 10;
    color: var(--ink);
  }

  header .mark { font-family: var(--font-display); font-weight: 600; font-size: 13px; }
  header nav { display: flex; gap: 36px; }
  header nav a { position: relative; padding-bottom: 6px; }

  header nav a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.4s ease;
  }

  header nav a:hover::after { width: 100%; }
  header nav a.cart-link { display: inline-flex; align-items: center; }

  .page-top-space { height: 144px; }

  .rail-label {
    font-family: var(--font-mono);
    margin-bottom: 26px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    color: var(--muted);
  }

  /* ---------- checkout ---------- */
  .checkout-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 40px 14vh;
  }

  .co-item {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }

  .co-item .thumb {
    width: 60px;
    height: 76px;
    border-radius: 2px;
    overflow: hidden;
  }

  .co-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .co-item .thumb .ph { width: 100%; height: 100%; background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%); }

  .co-item .name { font-size: 13px; }
  .co-item .qty { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .co-item .price { font-family: var(--font-mono); font-size: 13px; }

  .co-empty { padding: 6vh 0; color: var(--muted); font-size: 13px; }
  .co-empty a { text-decoration: underline; color: var(--ink); }

  .discount {
    margin-top: 24px;
    display: flex;
    gap: 12px;
  }

  .discount input {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 8px 2px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink);
    outline: none;
  }

  .discount input::placeholder { color: var(--muted); }
  .discount input:focus { border-color: var(--ink); }

  .discount button {
    background: none;
    border: none;
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.3s ease;
  }

  .discount button:hover { color: var(--ink); }

  .discount-msg {
    display: none;
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }

  .discount-msg.show { display: block; }

  .co-summary {
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
  }

  .co-summary .amount { font-family: var(--font-mono); font-size: 16px; }

  .co-note {
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .place-order {
    position: relative;
    margin-top: 24px;
    width: 100%;
    background: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 16px;
    cursor: pointer;
    overflow: hidden;
    transition: opacity 0.3s ease;
  }

  .place-order:hover { opacity: 0.9; }

  /* The one other place the signature print shows up, beyond the hero.
     This is the single highest-intent moment on the site, so it earns a
     second quiet appearance. Nowhere else picked this back up. */
  .place-order::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 3px;
    background-image: url('images/swatch.jpg');
    background-size: 40px auto;
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .place-order:hover::after { opacity: 0.8; }

  .place-order-msg {
    display: none;
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  .place-order-msg.show { display: block; }
  .place-order-msg a { text-decoration: underline; color: var(--ink); }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--line);
    text-align: center;
    padding: 56px 24px 48px;
  }

  footer .fmark { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; }

  footer .fmeta {
    font-family: var(--font-mono);
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 300;
  }

  footer .fmeta a { position: relative; }

  footer .fmeta a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.4s ease;
  }

  footer .fmeta a:hover::after { width: 100%; }

  footer .social {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  footer .social a { display: inline-flex; color: var(--muted); transition: color 0.3s ease; }
  footer .social a:hover { color: var(--ink); }
  footer .social svg { width: 16px; height: 16px; display: block; }

  footer .policy-links {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  footer .policy-links a { transition: color 0.3s ease; }
  footer .policy-links a:hover { color: var(--ink); }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    header nav { gap: 16px; }
    .checkout-wrap { padding: 0 20px 10vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

  <div class="teaser-bar"><a href="index.html#signup">Sign Up For 10% Off Your First Order</a></div>
  <header>
    <a class="mark" href="index.html">Asior</a>
    <nav>
      <a href="shop.html">Shop</a>
      <a href="collection.html">Summer Collection</a>
      <a href="community.html">Community</a>
      <a href="contact.html">Contact</a>
      <a href="manufacturing.html">Manufacturing</a>
      <a href="cart.html" class="cart-link" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="15" height="15"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></a>
    </nav>
  </header>

  <div class="page-top-space"></div>

  <section class="checkout-wrap">
    <div class="rail-label">Checkout</div>
    <div id="checkoutRoot"></div>
  </section>

  <footer id="order">
    <div class="fmark">Asior</div>
    <div class="fmeta"><a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a></div>
    <div class="social">
      <a href="https://www.instagram.com/asior_clothing/" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1"/></svg>
      </a>
      <a href="https://www.tiktok.com/@asiorclothing" aria-label="TikTok" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3h-3v12.1a2.7 2.7 0 1 1-2-2.6v-3.1a5.8 5.8 0 1 0 5 5.7V9.4a7.5 7.5 0 0 0 4 1.2V7.5c-2.1-.2-3.7-1.8-4-4.5z"/></svg>
      </a>
    </div>
    <div class="policy-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
      <a href="account.html">Account</a>
    </div>
  </footer>

<script>
  // Same hardcoded catalog as cart.html/product.html, pending real Shopify
  // sync: see product.html for the Storefront API setup steps.
  // This page only handles the local-fallback cart now. Once
  // SHOPIFY_STOREFRONT_TOKEN is live, cart.html's Checkout button redirects
  // straight to Shopify's real hosted checkout instead of landing here.
  const PRODUCTS = {
    'tee': { name: 'Holes Tee', img: 'images/look-01.jpg', price: 38.99 },
    'polo': { name: 'Scripture Polo', img: 'images/shop-polo.jpg', price: 40.99 },
    'shorts-oatmeal': { name: 'JAG Shorts', img: 'images/look-06.jpg', price: 35.99 },
    'shorts-black': { name: 'ASR Shorts', img: 'images/shop-shorts-black.jpg', price: 35.99 },
    'jayu-blossom-tee': { name: 'Ja-yu Blossom Tee', img: 'images/shop-jayu-blossom.jpg', price: 30, comparePrice: 40 },
    'jag-crewneck': { name: 'JAG Crewneck', img: 'images/shop-jag-crewneck.png', price: 45 },
    'jag-set': { name: 'JAG Set', img: 'images/shop-jag-set.png', price: 80, comparePrice: 90 },
    'jag-sweats': { name: 'JAG Sweats', img: 'images/shop-jag-sweats.jpg', price: 45 },
    'kova-lotus-tee': { name: 'Kova Eternal Lotus Tee', img: 'images/shop-kova-lotus.jpg', price: 30, comparePrice: 40 },
  };

  const cart = JSON.parse(localStorage.getItem('asior_cart') || '[]')
    .filter(item => PRODUCTS[item.id]);
  const root = document.getElementById('checkoutRoot');

  if (cart.length === 0) {
    root.innerHTML = `<div class="co-empty">Your cart is empty. <a href="shop.html">Shop all</a></div>`;
  } else {
    let subtotal = 0;
    let hasUnpriced = false;

    const rows = cart.map(item => {
      const p = PRODUCTS[item.id];
      const media = p.img ? `<img src="${p.img}" alt="${p.name}">` : `<div class="ph"></div>`;
      let priceText = 'N/A';
      if (p.price) {
        subtotal += p.price * item.qty;
        priceText = `$${p.price * item.qty}`;
      } else {
        hasUnpriced = true;
      }
      return `
        <div class="co-item">
          <div class="thumb">${media}</div>
          <div>
            <div class="name">${p.name}</div>
            <div class="qty">Qty ${item.qty}</div>
          </div>
          <div class="price">${priceText}</div>
        </div>`;
    }).join('');

    root.innerHTML = `
      ${rows}
      <div class="discount">
        <input type="text" id="discountInput" placeholder="Discount code">
        <button type="button" id="applyDiscount">Apply</button>
      </div>
      <div class="discount-msg" id="discountMsg">Discount codes aren't connected yet. They'll validate here once this links to Shopify checkout.</div>
      <div class="co-summary">
        <span>Subtotal</span>
        <span class="amount">$${subtotal}</span>
      </div>
      ${hasUnpriced ? '<div class="co-note">Some items don’t have pricing yet and aren’t included in the subtotal.</div>' : ''}
      <button class="place-order" id="placeOrderBtn">Place Order</button>
      <div class="place-order-msg" id="placeOrderMsg">Orders aren't connected yet. Email <a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a> with what's in your cart to complete it for now. This will go straight through Shopify checkout once that's set up.</div>
    `;

    document.getElementById('applyDiscount').addEventListener('click', () => {
      document.getElementById('discountMsg').classList.add('show');
    });

    document.getElementById('placeOrderBtn').addEventListener('click', () => {
      document.getElementById('placeOrderMsg').classList.add('show');
    });
  }
</script>

</body>
</html>
