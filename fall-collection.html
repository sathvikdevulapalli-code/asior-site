<!-- Fonts via <link>, not @import inside a style block: an @import means the
     browser has to download and parse the CSS before it even discovers
     the font request. Weight 200 was requested site-wide and used
     nowhere, so it is not requested here. -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  @media (hover: hover) and (pointer: fine) {
    header nav a:hover::after { width: 100%; }
  }

  /* Same grid as shop.html on purpose — this page's whole job is
     commerce once it's live, not a different visual system. The only
     difference from Shop All is that it's a filtered, curated set. */
  .fall {
    padding: 0 40px 14vh;
    max-width: 1180px;
    margin: 0 auto;
  }

  .fall-head { margin-bottom: 8px; }
  .fall-sub { margin: 8px 0 34px; max-width: 60ch; color: var(--muted); font-size: 13px; }

  .fall-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  .product {
    display: block;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out);
  }

  .product.in { opacity: 1; transform: translateY(0); }

  .product-img {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 2px;
    background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%);
    transition: transform 160ms var(--ease-out);
  }

  .price-badge {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 2;
    background: rgba(11, 10, 8, 0.72);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 5px 8px;
    border-radius: 2px;
  }

  .price-badge .compare { text-decoration: line-through; opacity: 0.6; margin-right: 5px; }

  .product-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transition: transform 0.8s var(--ease-img), filter 0.6s ease;
  }

  @media (hover: hover) and (pointer: fine) {
    .product:hover .product-img img { transform: scale(1.035); filter: brightness(1.03); }
  }

  .product:active .product-img { transform: scale(0.985); }

  .name-row { margin-top: 14px; display: flex; align-items: center; gap: 8px; }

  .product .name {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .preorder-tag {
    flex: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 2px;
  }

  .fall-empty { padding: 6vh 0; color: var(--muted); font-size: 13px; max-width: 52ch; }

  @media (max-width: 900px) {
    .fall-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    header nav { gap: 16px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; min-width: 0; max-width: calc(100vw - 130px); }
    header nav::-webkit-scrollbar { display: none; }
    .fall { padding: 0 20px 10vh; }
    .fall-grid { grid-template-columns: 1fr; gap: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .product { opacity: 1 !important; transform: none !important; }
  }
</style>

<script>
  // ---------------------------------------------------------------
  // Fall Collection shopping destination. Data-driven and deliberately
  // inert until Shopify/Klaviyo hands over the verified list of
  // qualifying product handles — see the one line below. This page is
  // not linked from anywhere yet (no nav item, no gate CTA) and isn't
  // in scripts/build.js's sitemap, so it's a real, working URL but not
  // discoverable or promoted until there's real content to show.
  //
  // FILL THIS IN once the Fall Collection SKUs are verified. Order in
  // this array is the order products render in.
  // e.g. ['jaguar-crewneck', 'jaguar-sweats', 'jag-set-1']
  // ---------------------------------------------------------------
  const FALL_COLLECTION_HANDLES = [];

  const A = window.Asior;

  async function fetchCatalog() {
    const data = await A.shopifyFetch(`{
      products(first: 50) {
        edges {
          node {
            title
            handle
            featuredImage { ${A.IMAGE_FIELDS} }
            variants(first: 20) {
              edges { node { availableForSale price { amount } compareAtPrice { amount } } }
            }
          }
        }
      }
    }`);
    return data.products.edges.map(e => {
      const node = e.node;
      const variants = node.variants.edges.map(v => v.node);
      const prices = variants.map(v => parseFloat(v.price.amount));
      const compares = variants
        .map(v => v.compareAtPrice ? parseFloat(v.compareAtPrice.amount) : null)
        .filter(Boolean);
      const minPrice = Math.min(...prices);
      const maxPrice = Math.max(...prices);
      const compare = compares.length && compares[0] > minPrice ? compares[0] : null;
      return {
        handle: node.handle,
        name: node.title.replace(/\s*\[preorder\]\s*/i, '').trim(),
        image: node.featuredImage,
        isPreorder: /\[preorder\]/i.test(node.title),
        soldOut: variants.length > 0 && variants.every(v => !v.availableForSale),
        priceLabel: minPrice === maxPrice
          ? `${compare ? `<span class="compare">$${compare}</span>` : ''}$${minPrice}`
          : `From $${minPrice}`,
      };
    });
  }

  function card(p, eager) {
    const media = p.image
      ? A.imgTag(p.image, {
          alt: 'Asior ' + p.name, eager: eager,
          sizes: '(max-width: 640px) 50vw, (max-width: 1024px) 33vw, 300px',
        })
      : '';
    return `
      <a class="product" href="/products/${p.handle}.html">
        <div class="product-img">
          ${media}
          <div class="price-badge tnum">${p.priceLabel}</div>
        </div>
        <div class="name-row">
          <div class="name">${A.escapeHtml(p.name)}</div>
          ${p.isPreorder ? `<span class="preorder-tag">Preorder</span>` : ''}
          ${p.soldOut ? `<span class="preorder-tag">Sold Out</span>` : ''}
        </div>
      </a>`;
  }

  (async function () {
    const emptyEl = document.getElementById('fallEmpty');
    const subEl = document.getElementById('fallSub');

    if (FALL_COLLECTION_HANDLES.length === 0) {
      // Nothing to index yet — say so honestly rather than show a guessed
      // or empty-looking grid, and keep it out of search results until
      // there's real content.
      document.head.insertAdjacentHTML('beforeend', '<meta name="robots" content="noindex">');
      subEl.textContent = 'Dropping september 7 — limited run.';
      emptyEl.textContent = "The Fall Collection isn't live yet. Join Early Access on the homepage to hear the moment it is.";
      return;
    }

    try {
      const catalog = await fetchCatalog();
      const byHandle = new Map(catalog.map(p => [p.handle, p]));
      const products = FALL_COLLECTION_HANDLES.map(h => byHandle.get(h)).filter(Boolean);

      if (products.length === 0) {
        emptyEl.textContent = "Couldn't find these pieces right now, check back soon.";
        return;
      }

      const grid = document.getElementById('fallGrid');
      grid.innerHTML = products.map((p, i) => card(p, i < 3)).join('');

      const items = grid.querySelectorAll('.product');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
          if (entry.isIntersecting) {
            setTimeout(() => entry.target.classList.add('in'), (i % 4) * 60);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.2 });
      items.forEach(p => observer.observe(p));
    } catch (err) {
      emptyEl.textContent = "Couldn't load the Fall Collection right now, try refreshing.";
    }
  })();
</script>
