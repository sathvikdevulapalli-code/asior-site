<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fall Collection | Asior</title>
<meta name="description" content="The Asior Fall Collection — limited run, dropping soon.">
<meta name="theme-color" content="#0b0a08">
<link rel="canonical" href="https://asiorclothing.com/fall-collection.html">

<!-- Open Graph. Social crawlers never run JavaScript, so these have to be
     real tags in the served HTML or a shared link renders as a bare URL. -->
<meta property="og:site_name" content="Asior">
<meta property="og:type" content="website">
<meta property="og:title" content="Fall Collection | Asior">
<meta property="og:description" content="The Asior Fall Collection — limited run, dropping soon.">
<meta property="og:url" content="https://asiorclothing.com/fall-collection.html">
<meta property="og:image" content="https://asiorclothing.com/assets/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Asior — limited drops, made in small batches">
<meta name="twitter:card" content="summary_large_image">

<!-- Fonts via <link>, not @import inside a style block: an @import means the
     browser has to download and parse the CSS before it even discovers
     the font request. Weight 200 was requested site-wide and used
     nowhere, so it is not requested here. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="preload" href="assets/site.js" as="script">
<!-- Single source of truth for FALL_COLLECTION_HANDLES and
     FALL_COMMERCE_READY — see assets/launch-config.js. Activating this
     page for real is a change to that one file, not this one. -->
<script src="assets/launch-config.js"></script>
<!-- Early Access gate: redirects to index.html before this page renders
     unless the visitor has entered ASIOR8 or the public drop has
     passed. See assets/early-access-gate.js. -->
<script src="assets/early-access-gate.js"></script>
<style>
  @media (hover: hover) and (pointer: fine) {
    header nav a:hover::after { width: 100%; }
  }

  /* Same grid as shop.html on purpose — this page's whole job is
     commerce once it's live, not a different visual system. The only
     difference from Shop All is that it's a filtered, curated set. */
  .fall {
    padding: 0 40px 14vh;
    max-width: 1180px;
    margin: 0 auto;
  }

  .fall-head { margin-bottom: 8px; }
  .fall-offer {
    display: inline-block;
    margin: 0 0 14px;
    padding: 6px 14px;
    border: 1px solid var(--muted);
    border-radius: 2px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: lowercase;
    color: var(--ink);
  }
  .fall-sub { margin: 8px 0 34px; max-width: 60ch; color: var(--muted); font-size: 13px; }

  .fall-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  .product {
    display: block;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out);
  }

  .product.in { opacity: 1; transform: translateY(0); }

  .product-img {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 2px;
    background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%);
    transition: transform 160ms var(--ease-out);
  }

  .price-badge {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 2;
    background: rgba(11, 10, 8, 0.72);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 5px 8px;
    border-radius: 2px;
  }

  .price-badge .compare { text-decoration: line-through; opacity: 0.6; margin-right: 5px; }
  .price-badge .save { opacity: 0.85; margin-left: 5px; }

  /* ---------- placeholder cards ----------
     Same grid shape as a real card, so the layout never jumps when
     real Shopify data replaces these — just the honest opposite of a
     real card's content: no image, no price, no link. */
  .product.placeholder { cursor: default; }
  .placeholder-img {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%);
  }
  .placeholder-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: lowercase;
    color: var(--muted);
  }
  .price-placeholder {
    margin-top: 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: lowercase;
    color: var(--muted);
  }

  .product-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transition: transform 0.8s var(--ease-img), filter 0.6s ease;
  }

  @media (hover: hover) and (pointer: fine) {
    .product:hover .product-img img { transform: scale(1.035); filter: brightness(1.03); }
  }

  .product:active .product-img { transform: scale(0.985); }

  .name-row { margin-top: 14px; display: flex; align-items: center; gap: 8px; }

  .product .name {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .preorder-tag {
    flex: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 2px;
  }

  /* Real-inventory urgency only — see A.stockLabel in assets/site.js.
     Never rendered unless Shopify actually reports a low quantity. */
  .stock-note {
    margin-top: 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: lowercase;
    color: var(--muted);
  }

  .fall-empty { padding: 6vh 0; color: var(--muted); font-size: 13px; max-width: 52ch; }

  @media (max-width: 900px) {
    .fall-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    header nav { gap: 16px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; min-width: 0; max-width: calc(100vw - 130px); }
    header nav::-webkit-scrollbar { display: none; }
    .fall { padding: 0 20px 10vh; }
    .fall-grid { grid-template-columns: 1fr; gap: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .product { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- HEADER:START -->
  <div class="teaser-bar"><a href="index.html#signup">Sign Up For 10% Off Your First Order</a></div>
  <header>
    <a class="mark" href="index.html">Asior</a>
    <nav>
      <a href="shop.html">Shop</a>
      <a href="community.html">Community</a>
      <a href="contact.html">Contact</a>
      <a href="manufacturing.html">Manufacturing</a>
      <a href="cart.html" class="cart-link" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="15" height="15"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></a>
    </nav>
  </header>

  <div class="page-top-space"></div>
  <!-- HEADER:END -->

  <main id="main">

  <!-- Filtered to FALL_COLLECTION_HANDLES below, once that list is real.
       Until then this renders the honest empty state — never a guessed
       product grid. -->
  <section class="fall" id="fallSection">
    <h1 class="rail-label fall-head">Fall Collection</h1>
    <!-- Founder-authorized launch offer, separate from fallSub (which
         assets/fall-grid.js owns and overwrites on every render). -->
    <p class="fall-offer">first 8 orders ship with a free jag lanyard</p>
    <p class="fall-sub" id="fallSub"></p>
    <div class="fall-grid" id="fallGrid"></div>
    <div class="fall-empty" id="fallEmpty"></div>
  </section>

  </main>

  <!-- FOOTER:START -->
  <footer id="order">
    <div class="fmark">Asior</div>
    <div class="fmeta"><a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a></div>
    <div class="social">
      <a href="https://www.instagram.com/asior_clothing/" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1"/></svg>
      </a>
      <a href="https://www.tiktok.com/@asiorclothing" aria-label="TikTok" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3h-3v12.1a2.7 2.7 0 1 1-2-2.6v-3.1a5.8 5.8 0 1 0 5 5.7V9.4a7.5 7.5 0 0 0 4 1.2V7.5c-2.1-.2-3.7-1.8-4-4.5z"/></svg>
      </a>
    </div>
    <div class="policy-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
      <a href="account.html">Account</a>
    </div>
  </footer>
  <!-- FOOTER:END -->

<script src="assets/site.js"></script>
<!-- Shared with index.html's post-Early-Access state — see
     assets/fall-grid.js for the placeholder-vs-real rendering logic
     and assets/launch-config.js for FALL_PRODUCTS/FALL_COMMERCE_READY,
     the two facts that decide what actually renders. -->
<script src="assets/fall-grid.js"></script>
<script>
  // This page is not linked from anywhere yet (no nav item, no gate
  // CTA) and isn't in scripts/build.js's sitemap, so it's a real,
  // working URL but not discoverable or promoted until there's real
  // content to show — noindexed until commerce is verified ready.
  if (!window.ASIOR_LAUNCH.FALL_COMMERCE_READY) {
    document.head.insertAdjacentHTML('beforeend', '<meta name="robots" content="noindex">');
  }

  window.Asior.renderFallGrid({
    gridEl: document.getElementById('fallGrid'),
    emptyEl: document.getElementById('fallEmpty'),
    subEl: document.getElementById('fallSub'),
  });
</script>

</body>
</html>
