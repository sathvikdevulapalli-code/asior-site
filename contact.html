<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Asior</title>
<meta name="description" content="Questions about an order, sizing, or a return? Message Asior directly and we'll get back to you.">
<meta name="theme-color" content="#0b0a08">
<link rel="canonical" href="https://asiorclothing.com/contact.html">

<!-- Open Graph. Social crawlers never run JavaScript, so these have to be
     real tags in the served HTML or a shared link renders as a bare URL. -->
<meta property="og:site_name" content="Asior">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact | Asior">
<meta property="og:description" content="Questions about an order, sizing, or a return? Message Asior directly and we'll get back to you.">
<meta property="og:url" content="https://asiorclothing.com/contact.html">
<meta property="og:image" content="https://asiorclothing.com/assets/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Asior — limited drops, made in small batches">
<meta name="twitter:card" content="summary_large_image">

<!-- Fonts via <link>, not @import inside a style block: an @import means the
     browser has to download and parse the CSS before it even discovers
     the font request. Weight 200 was requested site-wide and used
     nowhere, so it is not requested here. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="preload" href="assets/site.js" as="script">
<style>
  @media (hover: hover) and (pointer: fine) {
    header nav a:hover::after { width: 100%; }
  }

  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- contact ---------- */
  .contact {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 40px 16vh;
    animation: pageFadeIn 700ms var(--ease-out);
  }

  .contact-form {
    margin-top: 4vh;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .contact-field label {
    display: block;
    margin-bottom: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .contact-field input,
  .contact-field textarea {
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid var(--field-line);
    padding: 8px 2px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 300;
    color: var(--ink);
    resize: vertical;
    transition: border-color 0.3s ease;
  }

  .contact-field textarea { min-height: 100px; }

  .contact-field input:focus,
  .contact-field textarea:focus { border-color: var(--ink); }

  .contact-submit {
    align-self: flex-start;
    position: relative;
    margin-top: 4px;
    background: none;
    border: none;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    padding-bottom: 6px;
    transition: transform 160ms var(--ease-out);
  }

  .contact-submit::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 300ms var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .contact-submit:hover::after { width: 100%; }
  }

  .contact-submit:active { transform: scale(0.96); }

  .contact-confirm {
    display: none;
    margin-top: 4vh;
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .contact-confirm.show { display: block; }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    header nav { gap: 16px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; min-width: 0; max-width: calc(100vw - 130px); }
    header nav::-webkit-scrollbar { display: none; }
    .contact { padding: 0 20px 12vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
    .contact { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="teaser-bar"><a href="index.html#signup">Sign Up For 10% Off Your First Order</a></div>
  <header>
    <a class="mark" href="index.html">Asior</a>
    <nav>
      <a href="shop.html">Shop</a>
      <a href="community.html">Community</a>
      <a href="contact.html">Contact</a>
      <a href="manufacturing.html">Manufacturing</a>
      <a href="cart.html" class="cart-link" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="15" height="15"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></a>
    </nav>
  </header>

  <div class="page-top-space"></div>

  <main id="main">

  <section class="contact">
    <h1 class="rail-label">Contact</h1>

    <!-- Real Shopify contact form: same form_type=contact / contact[name] /
         contact[email] / contact[body] fields Shopify's own contact.liquid
         snippet uses, posted to asiorclothing.com's native /contact endpoint
         via a hidden iframe so the page doesn't navigate away. Messages land
         in Shopify Admin -> Inbox / the store's contact notification email,
         same as any other Shopify contact form. -->
    <form class="contact-form" id="contactForm" method="post" action="https://asiorclothing.com/contact#contact_form" target="contact-target">
      <input type="hidden" name="form_type" value="contact">
      <input type="hidden" name="utf8" value="&#10003;">
      <div class="contact-field">
        <label for="contact-name">Name</label>
        <input type="text" id="contact-name" autocomplete="name" name="contact[name]" required>
      </div>
      <div class="contact-field">
        <label for="contact-email">Email</label>
        <input type="email" id="contact-email" autocomplete="email" spellcheck="false" name="contact[email]" required>
      </div>
      <div class="contact-field">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="contact[body]" rows="6" required></textarea>
      </div>
      <button type="submit" class="contact-submit">Send</button>
    </form>
    <iframe name="contact-target" style="display:none" aria-hidden="true"></iframe>
    <div class="contact-confirm" id="contactConfirm">Message sent. We'll get back to you soon.</div>
  </section>

  </main>

  <footer id="order">
    <div class="fmark">Asior</div>
    <div class="fmeta"><a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a></div>
    <div class="social">
      <a href="https://www.instagram.com/asior_clothing/" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1"/></svg>
      </a>
      <a href="https://www.tiktok.com/@asiorclothing" aria-label="TikTok" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3h-3v12.1a2.7 2.7 0 1 1-2-2.6v-3.1a5.8 5.8 0 1 0 5 5.7V9.4a7.5 7.5 0 0 0 4 1.2V7.5c-2.1-.2-3.7-1.8-4-4.5z"/></svg>
      </a>
    </div>
    <div class="policy-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
      <a href="account.html">Account</a>
    </div>
  </footer>

<script src="assets/site.js"></script>
<script>
  const contactForm = document.getElementById('contactForm');
  const contactConfirm = document.getElementById('contactConfirm');
  // Let the form actually submit (to the hidden iframe target above) instead
  // of preventing it, that's what sends the message to Shopify for real.
  contactForm.addEventListener('submit', () => {
    setTimeout(() => {
      contactForm.style.display = 'none';
      contactConfirm.classList.add('show');
    }, 500);
  });
</script>

</body>
</html>
