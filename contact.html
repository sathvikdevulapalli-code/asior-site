<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Asior</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0b0a08;
    --ink: #f5f3ee;
    --muted: #a89f8f;
    --line: #2b2822;
    --font-display: 'Unbounded', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }

  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 1px solid var(--ink);
    outline-offset: 4px;
  }

  img { display: block; max-width: 100%; }

  .teaser-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 34px;
    z-index: 11;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .teaser-bar a {
    color: inherit;
    text-decoration: none;
    position: relative;
    padding-bottom: 2px;
    transition: color 0.3s ease;
  }

  .teaser-bar a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.3s ease;
  }

  .teaser-bar a:hover { color: var(--ink); }
  .teaser-bar a:hover::after { width: 100%; }

  header {
    position: fixed;
    top: 34px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px 40px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    z-index: 10;
    color: var(--ink);
  }

  header .mark { font-family: var(--font-display); font-weight: 600; font-size: 13px; }
  header nav { display: flex; gap: 36px; }
  header nav a { position: relative; padding-bottom: 6px; }

  header nav a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.4s ease;
  }

  header nav a:hover::after { width: 100%; }

  header nav a.cart-link { display: inline-flex; align-items: center; }

  .page-top-space { height: 144px; }

  .rail-label {
    font-family: var(--font-mono);
    margin-bottom: 26px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    color: var(--muted);
  }

  /* ---------- contact ---------- */
  .contact {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 40px 16vh;
  }

  .contact-form {
    margin-top: 4vh;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .contact-field label {
    display: block;
    margin-bottom: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .contact-field input,
  .contact-field textarea {
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 8px 2px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 300;
    color: var(--ink);
    outline: none;
    resize: vertical;
    transition: border-color 0.3s ease;
  }

  .contact-field textarea { min-height: 100px; }

  .contact-field input:focus,
  .contact-field textarea:focus { border-color: var(--ink); }

  .contact-submit {
    align-self: flex-start;
    position: relative;
    margin-top: 4px;
    background: none;
    border: none;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    padding-bottom: 6px;
  }

  .contact-submit::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.4s ease;
  }

  .contact-submit:hover::after { width: 100%; }

  .contact-confirm {
    display: none;
    margin-top: 4vh;
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .contact-confirm.show { display: block; }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--line);
    text-align: center;
    padding: 56px 24px 48px;
  }

  footer .fmark { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; }

  footer .fmeta {
    font-family: var(--font-mono);
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 300;
  }

  footer .fmeta a { position: relative; }

  footer .fmeta a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.4s ease;
  }

  footer .fmeta a:hover::after { width: 100%; }

  footer .social {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  footer .social a { display: inline-flex; color: var(--muted); transition: color 0.3s ease; }
  footer .social a:hover { color: var(--ink); }
  footer .social svg { width: 16px; height: 16px; display: block; }

  footer .policy-links {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  footer .policy-links a { transition: color 0.3s ease; }
  footer .policy-links a:hover { color: var(--ink); }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    header nav { gap: 16px; }
    .contact { padding: 0 20px 12vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

  <div class="teaser-bar"><a href="index.html#signup">Sign Up For 10% Off Your First Order</a></div>
  <header>
    <a class="mark" href="index.html">Asior</a>
    <nav>
      <a href="shop.html">Shop</a>
      <a href="collection.html">Summer Collection</a>
      <a href="community.html">Community</a>
      <a href="contact.html">Contact</a>
      <a href="manufacturing.html">Manufacturing</a>
      <a href="cart.html" class="cart-link" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="15" height="15"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></a>
    </nav>
  </header>

  <div class="page-top-space"></div>

  <section class="contact">
    <div class="rail-label">Contact</div>

    <!-- Real Shopify contact form: same form_type=contact / contact[name] /
         contact[email] / contact[body] fields Shopify's own contact.liquid
         snippet uses, posted to asiorclothing.com's native /contact endpoint
         via a hidden iframe so the page doesn't navigate away. Messages land
         in Shopify Admin -> Inbox / the store's contact notification email,
         same as any other Shopify contact form. -->
    <form class="contact-form" id="contactForm" method="post" action="https://asiorclothing.com/contact#contact_form" target="contact-target">
      <input type="hidden" name="form_type" value="contact">
      <input type="hidden" name="utf8" value="&#10003;">
      <div class="contact-field">
        <label for="contact-name">Name</label>
        <input type="text" id="contact-name" name="contact[name]" required>
      </div>
      <div class="contact-field">
        <label for="contact-email">Email</label>
        <input type="email" id="contact-email" name="contact[email]" required>
      </div>
      <div class="contact-field">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="contact[body]" rows="6" required></textarea>
      </div>
      <button type="submit" class="contact-submit">Send</button>
    </form>
    <iframe name="contact-target" style="display:none" aria-hidden="true"></iframe>
    <div class="contact-confirm" id="contactConfirm">Message sent. We'll get back to you soon.</div>
  </section>

  <footer id="order">
    <div class="fmark">Asior</div>
    <div class="fmeta"><a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a></div>
    <div class="social">
      <a href="https://www.instagram.com/asior_clothing/" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1"/></svg>
      </a>
      <a href="https://www.tiktok.com/@asiorclothing" aria-label="TikTok" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3h-3v12.1a2.7 2.7 0 1 1-2-2.6v-3.1a5.8 5.8 0 1 0 5 5.7V9.4a7.5 7.5 0 0 0 4 1.2V7.5c-2.1-.2-3.7-1.8-4-4.5z"/></svg>
      </a>
    </div>
    <div class="policy-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
      <a href="account.html">Account</a>
    </div>
  </footer>

<script>
  const contactForm = document.getElementById('contactForm');
  const contactConfirm = document.getElementById('contactConfirm');
  // Let the form actually submit (to the hidden iframe target above) instead
  // of preventing it, that's what sends the message to Shopify for real.
  contactForm.addEventListener('submit', () => {
    setTimeout(() => {
      contactForm.style.display = 'none';
      contactConfirm.classList.add('show');
    }, 500);
  });
</script>

</body>
</html>
