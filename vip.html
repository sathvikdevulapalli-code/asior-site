<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0B0B0C">
  <title>Black Friday VIP Access | ASIOR</title>
  <meta name="description" content="Join ASIOR's Black Friday VIP list. The automatic 20% sale opens November 27 at 2 PM Central.">
  <meta property="og:title" content="ASIOR Black Friday VIP Access">
  <meta property="og:description" content="20% off automatically, November 27–30. Join for the launch reminder.">
  <meta property="og:image" content="https://asiorclothing.com/assets/og-default.jpg">
  <link rel="icon" href="/assets/favicon.ico">

  <!-- The two faces this page uses, self-hosted, same as the gate.
       While this page is running paid traffic its first paint is the
       whole first impression, so there is no fonts.googleapis.com DNS
       lookup and TLS handshake in front of it. crossorigin is required
       even same-origin: font fetches are always CORS-mode, and a
       preload without it is made in the wrong mode, ignored, and
       quietly fetched twice. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/anton-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tight-var-latin.woff2" crossorigin>

  <script async src="https://static.klaviyo.com/onsite/js/QV7rBB/klaviyo.js?company_id=QV7rBB"></script>
  <style>
    /* ===================================================================
       ASIOR — Black Friday VIP

       One centred column on black and nothing else: the mark, a clock,
       two fields drawn as single rules, and SUBMIT as plain text. The
       photograph and the paragraph are gone; the empty space is the
       design, so resist filling it.

       Built to the reference Ayush sent (zicmade.com/password): logo
       centred at the top, one colon-separated countdown with small
       spaced labels beneath, EMAIL and PHONE NUMBER as underlined
       inputs with tracked uppercase labels, a text-only submit, and a
       lot of air.
       =================================================================== */

    @font-face {
      font-family: 'Anton';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url('/fonts/anton-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter Tight';
      font-style: normal; font-weight: 400 700; font-display: swap;
      src: url('/fonts/inter-tight-var-latin.woff2') format('woff2');
    }

    :root {
      color-scheme: dark;
      /* The brand's near-black and off-white, not pure #000/#fff.
         It reads as black exactly like the reference, but Helvetica-
         class type at 10px blooms on pure black, which is the reason
         the storefront picked these two in the first place. The
         theme-color meta has to agree with --bg or check-slop fails
         the build. */
      --bg: #0B0B0C;
      --ink: #E8E8EA;
      --muted: rgba(232, 232, 234, 0.58);
      --rule: rgba(232, 232, 234, 0.55);
      --display: 'Anton', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --sans: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(40px, 7vh, 84px) max(22px, env(safe-area-inset-left, 0px))
               clamp(28px, 5vh, 56px) max(22px, env(safe-area-inset-right, 0px));
    }

    .column {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ---- the mark ---------------------------------------------------- */
    .wordmark {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(30px, 8vw, 40px);
      line-height: 1;
      letter-spacing: 0.2em;
      /* Anton's tracking pushes the last letter off centre; this pulls
         the optical centre back. */
      text-indent: 0.2em;
      text-transform: uppercase;
    }

    /* ---- the clock ----------------------------------------------------
       One colon-separated line, as in the reference, with the labels
       spread beneath it on their own row. Tabular figures so the digits
       do not twitch once a second. */
    .clock {
      margin: clamp(52px, 13vh, 116px) 0 0;
      width: 100%;
    }
    .clock[hidden] { display: none; }

    .clock-time {
      margin: 0;
      font-size: clamp(26px, 7.4vw, 34px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .clock-units {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Once the sale is running the digits give way to one line. */
    .clock-live {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(22px, 6vw, 30px);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .offer {
      margin: 26px 0 0;
      font-size: 11px;
      line-height: 1.6;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .offer[hidden] { display: none; }
    .offer b { color: var(--ink); font-weight: 600; }

    /* ---- the form -----------------------------------------------------
       Each input is a rule, not a box: transparent background, no
       border but the bottom one, no radius, nothing the browser drew. */
    form { width: 100%; margin: clamp(44px, 10vh, 92px) 0 0; text-align: left; }

    .field-label {
      display: block;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 2px;
    }

    input[type="email"],
    input[type="tel"] {
      width: 100%;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;          /* 16px or iOS zooms the page on focus */
      line-height: 1.4;
      padding: 6px 0 8px;
      transition: border-color 0.3s var(--ease);
    }
    input[type="email"]:focus,
    input[type="tel"]:focus { outline: none; border-bottom-color: var(--ink); }
    input[type="email"]:focus-visible,
    input[type="tel"]:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

    /* The consent block sits between an input and the next label,
       so .field + .field-label never matched and PHONE NUMBER was
       jammed against the email consent copy. */
    .check + .field-label { margin-top: 32px; }

    /* ---- consent ------------------------------------------------------
       Small, but never gone: the checkbox is what makes the email
       subscription consented, and the paragraph beneath the number is
       what 47 CFR 64.1200(f) requires of prior express written consent
       for marketing texts, at the point of collection. Both are
       legally load-bearing. Shrink them; do not remove them. */
    .check {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 9px;
      align-items: start;
      margin: 18px 0 0;
    }
    .check span { font-size: 10px; line-height: 1.55; color: var(--muted); }
    .check a { color: var(--muted); text-underline-offset: 2px; }
    .check a:hover { color: var(--ink); }

    .check input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 13px; height: 13px; margin: 3px 0 0;
      border: 1px solid var(--rule); border-radius: 0;
      background: transparent;
      display: grid; place-content: center;
      cursor: pointer;
      transition: background-color 0.3s var(--ease), border-color 0.3s var(--ease);
    }
    .check input[type="checkbox"]::after {
      content: "";
      width: 6px; height: 3px;
      border-left: 1.5px solid var(--bg);
      border-bottom: 1.5px solid var(--bg);
      transform: rotate(-45deg) scale(0.6);
      opacity: 0;
      transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
    }
    .check input[type="checkbox"]:checked { background: var(--ink); border-color: var(--ink); }
    .check input[type="checkbox"]:checked::after { opacity: 1; transform: rotate(-45deg) scale(1); }
    .check input[type="checkbox"]:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

    .sms-consent {
      margin: 12px 0 0;
      font-size: 10px;
      line-height: 1.55;
      color: var(--muted);
    }
    .sms-consent a { color: var(--muted); text-underline-offset: 2px; }
    .sms-consent a:hover { color: var(--ink); }

    /* ---- submit -------------------------------------------------------
       Text, not a filled button, as in the reference. It is still a
       real <button>, so every UA style is stripped off it. */
    button[type="submit"] {
      margin: 30px 0 0;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.3s var(--ease);
    }
    button[type="submit"]:hover { opacity: 0.62; }
    button[type="submit"]:active { transform: translateY(1px); transition-duration: 90ms; }
    button[type="submit"]:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
    button[type="submit"]:disabled { opacity: 0.4; cursor: wait; }

    #status { margin: 16px 0 0; font-size: 11px; line-height: 1.6; color: var(--ink); }
    #status:empty { margin: 0; }

    /* ---- foot ---------------------------------------------------------
       Pushed to the bottom so the column above it keeps its air. */
    footer {
      margin-top: auto;
      padding-top: 48px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    footer a { color: var(--muted); text-decoration: none; transition: color 0.3s var(--ease); }
    footer a:hover { color: var(--ink); }
    footer a:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

    /* ---- the arrival --------------------------------------------------
       One staged rise and nothing else. The from-state lives inside the
       animation with backwards fill, so the page is complete at rest
       and a visitor with motion off is never shown a blank column. */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: none; }
      }
      .rise { animation: rise 0.8s var(--ease) backwards; animation-delay: var(--in, 0ms); }
    }

    /* ---- the cookie notice ---------------------------------------------
       assets/ads.js appends .ad-consent to every page it runs on and its
       CSS lives in assets/site.css, which this standalone page does not
       load. Unstyled it renders as a default browser box. */
    .ad-consent {
      position: fixed; z-index: 11000; bottom: 16px; left: 16px;
      width: min(340px, calc(100vw - 32px));
      padding: 13px;
      background: #141416; color: var(--ink);
      border: 1px solid var(--rule);
      box-sizing: border-box;
      text-align: left;
    }
    .ad-consent[hidden] { display: none; }
    .ad-consent p { margin: 0 0 10px; }
    .ad-consent-copy { font-size: 11px; line-height: 1.55; color: var(--muted); }
    .ad-consent a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
    .ad-consent-actions { display: flex; gap: 9px; }
    .ad-consent-actions button {
      flex: 1; padding: 10px;
      background: transparent; border: 1px solid var(--rule); border-radius: 0;
      color: var(--ink);
      font-family: var(--sans); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.3s var(--ease);
    }
    .ad-consent-actions button:hover { border-color: var(--ink); }
    .ad-consent-actions button:focus-visible,
    .ad-preferences:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
  </style>

  <script defer src="/assets/ads-config.js"></script>
  <script defer src="/assets/ads.js"></script>
  <script defer src="/assets/vip-signup.js"></script>
</head>
<body>

  <div class="column">

    <h1 class="wordmark rise" style="--in:80ms">Asior</h1>

    <!-- Filled by the script below. Hidden until it has a real figure,
         and it stays hidden if the date is missing, unparseable or the
         sale is already over: a countdown to nothing is worse than no
         countdown. The digits are aria-hidden because a live region
         that rewrites itself every second is a screen-reader siren;
         the same fact is given once, in words, beside them. -->
    <div class="clock rise" id="clock" style="--in:200ms" hidden>
      <p class="clock-time" id="clockTime" aria-hidden="true">--:--:--:--</p>
      <ul class="clock-units" aria-hidden="true">
        <li>Days</li><li>Hrs</li><li>Mins</li><li>Secs</li>
      </ul>
      <p class="sr-only" id="clockWords"></p>
    </div>

    <!-- Written by the script below from the MEMBER_OFFER constants.
         Empty and hidden until there is something true to say. -->
    <p class="offer rise" id="offer" style="--in:260ms" hidden></p>

    <form id="vipForm" novalidate class="rise" style="--in:320ms">
      <label class="field-label" for="vipEmail">Email</label>
      <input class="field" type="email" id="vipEmail" name="email" autocomplete="email" required>
      <label class="check"><input type="checkbox" id="emailConsent" required><span>I agree to receive ASIOR Black Friday and occasional marketing emails. Frequency varies. I can unsubscribe using any email's link. See the <a href="/privacy-policy.html">Privacy Policy</a>.</span></label>

      <label class="field-label" for="vipPhone">Phone number</label>
      <input class="field" type="tel" id="vipPhone" name="phone_number" autocomplete="tel" inputmode="tel">
      <label class="check"><input type="checkbox" id="smsConsent"><span>If I provide a number, I agree to receive recurring automated ASIOR marketing texts at that number. Consent is not a condition of purchase. Message frequency varies. Msg &amp; data rates may apply. Reply STOP to unsubscribe, HELP for help. See the <a href="/privacy-policy.html">Privacy Policy</a> and <a href="/terms-of-service.html">SMS terms</a>.</span></label>

      <button type="submit" id="vipButton">Submit</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <footer class="rise" style="--in:440ms">
      <a href="/privacy-policy.html">Privacy</a>
      <a href="/terms-of-service.html">Terms</a>
      <a href="mailto:asiorclothing@gmail.com">Contact</a>
    </footer>

  </div>

  <script>
  (function () {
    'use strict';

    /* The instant the Shopify discount starts, and nothing else.

         DiscountAutomaticNode/1576926707929
         "Black Friday 2026 - 20% Off", status SCHEDULED
         startsAt 2026-11-27T20:00:00Z  (2:00 PM CT)
         endsAt   2026-12-01T05:59:00Z
         20% of AllDiscountItems              read back 2026-11-20

       A countdown is only honest while the thing it counts to is real
       and still ahead, so if that schedule moves in Shopify it moves
       here in the same change. Blank either constant and no clock is
       drawn at all. */
    var OPENS_AT = '2026-11-27T20:00:00Z';
    var ENDS_AT  = '2026-12-01T05:59:00Z';
    var LIVE_LINE = 'The sale is live';

    /* ---- what the sale actually is ---------------------------------

       PUBLIC_PCT is the automatic discount every visitor gets with no
       code. It is 20 because that is what the scheduled Shopify
       discount is set to, and it is the only number on this page that
       is safe to state today.

       MEMBER_PCT and MEMBER_CODE are the members' offer. BOTH ARE
       NULL AND MUST STAY NULL UNTIL THE CODE EXISTS IN SHOPIFY, and
       while either is null this page says nothing about a member
       discount at all.

       Why it is one code and not "20% plus an extra 10%": every
       discount in this account, the Black Friday automatic included,
       is set combinesWith.orderDiscounts FALSE. Two order-level
       discounts therefore cannot stack. A member entering a 10% code
       during the sale would get 10% INSTEAD of the automatic 20% --
       worse off for being a member. The way to give members 30% is a
       single 30% code that replaces the automatic, which Shopify does
       by itself because a code outranks an automatic it cannot
       combine with. Set MEMBER_PCT to the code's real percentage, not
       to the difference. */
    var PUBLIC_PCT  = 20;
    var MEMBER_PCT  = null;
    var MEMBER_CODE = null;

    var box = document.getElementById('clock');
    var timeEl = document.getElementById('clockTime');
    var wordsEl = document.getElementById('clockWords');
    if (!box || !timeEl) return;

    function when(v) { var t = v ? Date.parse(v) : NaN; return isFinite(t) ? t : NaN; }
    function two(n) { return (n < 10 ? '0' : '') + n; }

    var to = when(OPENS_AT), ends = when(ENDS_AT), timer = null;
    if (!isFinite(to)) return;                       /* no date: no clock */

    function live() {
      if (timer) { clearInterval(timer); timer = null; }
      /* Over and done with: claim nothing. A timer still counting after
         the sale is the same lie pointing backwards. */
      if (isFinite(ends) && Date.now() >= ends) { box.hidden = true; return; }
      var units = box.querySelector('.clock-units');
      if (units) units.remove();
      timeEl.className = 'clock-live';
      timeEl.textContent = LIVE_LINE;
      timeEl.removeAttribute('aria-hidden');
      if (wordsEl) wordsEl.textContent = '';
      box.hidden = false;
    }

    function tick() {
      var left = to - Date.now();
      if (left <= 0) { live(); return; }
      var s = Math.floor(left / 1000);
      var d = Math.floor(s / 86400);
      var h = Math.floor((s % 86400) / 3600);
      var m = Math.floor((s % 3600) / 60);
      timeEl.textContent = two(d) + ':' + two(h) + ':' + two(m) + ':' + two(s % 60);
      if (wordsEl) {
        wordsEl.textContent = 'Opens in ' + d + ' days, ' + h + ' hours and ' + m + ' minutes.';
      }
      box.hidden = false;
    }

    tick();
    if (!box.hidden && timeEl.className !== 'clock-live') timer = setInterval(tick, 1000);

    /* The offer line. Public half always, members' half only once the
       code is real, and nothing at all if PUBLIC_PCT is cleared. */
    var offerEl = document.getElementById('offer');
    if (offerEl && PUBLIC_PCT) {
      var line = '<b>' + PUBLIC_PCT + '% off</b> everything, applied automatically.';
      if (MEMBER_PCT && MEMBER_CODE) {
        line += ' Members get <b>' + MEMBER_PCT + '% off</b> with code ' + MEMBER_CODE + '.';
      }
      offerEl.innerHTML = line;
      offerEl.hidden = false;
    }
  })();
  </script>

</body>
</html>
