<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account | Asior</title>
<meta name="description" content="Sign in to view your Asior order history and track a shipment.">
<meta name="theme-color" content="#0b0a08">
<link rel="canonical" href="https://asiorclothing.com/account.html">
<!-- No search value, and the cart renders a different page per session. -->
<meta name="robots" content="noindex, follow">

<!-- Open Graph. Social crawlers never run JavaScript, so these have to be
     real tags in the served HTML or a shared link renders as a bare URL. -->
<meta property="og:site_name" content="Asior">
<meta property="og:type" content="website">
<meta property="og:title" content="Account | Asior">
<meta property="og:description" content="Sign in to view your Asior order history and track a shipment.">
<meta property="og:url" content="https://asiorclothing.com/account.html">
<meta property="og:image" content="https://asiorclothing.com/assets/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Asior — limited drops, made in small batches">
<meta name="twitter:card" content="summary_large_image">

<!-- Fonts via <link>, not @import inside a style block: an @import means the
     browser has to download and parse the CSS before it even discovers
     the font request. Weight 200 was requested site-wide and used
     nowhere, so it is not requested here. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="preload" href="assets/site.js" as="script">
<style>
  @media (hover: hover) and (pointer: fine) {
    header nav a:hover::after { width: 100%; }
  }

  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .account {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 40px 16vh;
    text-align: center;
    animation: pageFadeIn 700ms var(--ease-out);
  }

  .account p {
    margin-top: 8vh;
    font-size: 13px;
    line-height: 1.8;
    color: var(--muted);
  }

  .account a {
    color: var(--ink);
    text-decoration: underline;
  }

  .account a.account-btn {
    display: inline-block;
    margin-top: 32px;
    border: 1px solid var(--ink);
    padding: 14px 32px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    transition: opacity 200ms var(--ease-out), transform 160ms var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .account a.account-btn:hover { opacity: 0.75; }
  }

  .account a.account-btn:active { transform: scale(0.97); }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    header nav { gap: 16px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; min-width: 0; max-width: calc(100vw - 130px); }
    header nav::-webkit-scrollbar { display: none; }
    .account { padding: 0 20px 12vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    .account {
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="teaser-bar"><a href="index.html#signup">Sign Up For 10% Off Your First Order</a></div>
  <header>
    <a class="mark" href="index.html">Asior</a>
    <nav>
      <a href="shop.html">Shop</a>
      <a href="community.html">Community</a>
      <a href="contact.html">Contact</a>
      <a href="manufacturing.html">Manufacturing</a>
      <a href="cart.html" class="cart-link" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="15" height="15"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></a>
    </nav>
  </header>

  <div class="page-top-space"></div>

  <main id="main">

  <!-- Real Shopify customer accounts (account.asiorclothing.com), not a
       custom login form, real order history/tracking, no backend of our
       own needed. -->
  <section class="account">
    <h1 class="rail-label">Account</h1>
    <p>Sign in to view your order history and track a shipment.</p>
    <a class="account-btn" href="https://account.asiorclothing.com/">Sign In</a>
  </section>

  </main>

  <footer id="order">
    <div class="fmark">Asior</div>
    <div class="fmeta"><a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a></div>
    <div class="social">
      <a href="https://www.instagram.com/asior_clothing/" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1"/></svg>
      </a>
      <a href="https://www.tiktok.com/@asiorclothing" aria-label="TikTok" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3h-3v12.1a2.7 2.7 0 1 1-2-2.6v-3.1a5.8 5.8 0 1 0 5 5.7V9.4a7.5 7.5 0 0 0 4 1.2V7.5c-2.1-.2-3.7-1.8-4-4.5z"/></svg>
      </a>
    </div>
    <div class="policy-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
      <a href="account.html">Account</a>
    </div>
  </footer>

<script src="assets/site.js"></script>

</body>
</html>
