<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asior</title>
<meta name="description" content="Asior makes limited-run streetwear in small batches.">
<meta name="theme-color" content="#0b0a08">
<link rel="canonical" href="https://asiorclothing.com/product.html">

<!-- Open Graph. Social crawlers never run JavaScript, so these have to be
     real tags in the served HTML or a shared link renders as a bare URL. -->
<meta property="og:site_name" content="Asior">
<meta property="og:type" content="website">
<meta property="og:title" content="Asior">
<meta property="og:description" content="Asior makes limited-run streetwear in small batches.">
<meta property="og:url" content="https://asiorclothing.com/product.html">
<meta property="og:image" content="https://asiorclothing.com/assets/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Asior — limited drops, made in small batches">
<meta name="twitter:card" content="summary_large_image">

<!-- Fonts via <link>, not @import inside a style block: an @import means the
     browser has to download and parse the CSS before it even discovers
     the font request. Weight 200 was requested site-wide and used
     nowhere, so it is not requested here. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="preload" href="assets/site.js" as="script">
<!-- Still needed for FALL_PRODUCTS (customer-facing name overrides)
     and DROP_CLOSE_TIME (assets/drop-countdown.js) — nothing to do
     with the Early Access gate, which is retired; see shop.html's
     equivalent comment for why. -->
<script src="assets/launch-config.js"></script>
<script src="assets/promo-config.js"></script>
<style>
  @media (hover: hover) and (pointer: fine) {
    header nav a:hover::after { width: 100%; }
  }

  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- product detail ----------
     Named grid areas, not source order, decide what a shopper sees
     first — because those two need to disagree. Desktop keeps the
     gallery on the left spanning both rows, name/price/facts (.pd-head)
     and the buy box (.pd-info) stacked on the right, same visual result
     the old plain 2-column grid gave. On mobile (see the max-width:720px
     query below) the SAME three blocks collapse into a single column in
     head -> media -> info order instead of source order (which was
     media -> info) — so price and the Add to Cart button land inside
     the first mobile screen instead of below a full-bleed 3:4 image
     that alone is taller than most phones' viewport. */
  .pd {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 40px 14vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "media head" "media info";
    gap: 8px 60px;
    align-items: start;
    animation: pageFadeIn 700ms var(--ease-out);
  }

  .pd-head { grid-area: head; }
  .pd-media { grid-area: media; }
  .pd-info { grid-area: info; }

  .pd-media {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .pd-media-main {
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 2px;
  }

  .pd-media-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.8s var(--ease-img);
  }

  /* Hover gated behind a real pointer: on touch, :hover latches after a
     tap and leaves the image stuck mid-zoom. */
  @media (hover: hover) and (pointer: fine) {
    .pd-media-main:hover img { transform: scale(1.035); }
  }

  .pd-media-thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .pd-thumb {
    width: 64px;
    aspect-ratio: 3 / 4;
    padding: 0;
    border: 1px solid var(--field-line);
    background: none;
    cursor: pointer;
    overflow: hidden;
    border-radius: 2px;
    opacity: 0.55;
    transition: opacity 200ms var(--ease-out), border-color 200ms var(--ease-out), transform 160ms var(--ease-out);
  }

  .pd-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @media (hover: hover) and (pointer: fine) {
    .pd-thumb:hover { opacity: 0.85; }
  }

  .pd-thumb:active { transform: scale(0.96); }

  .pd-thumb.selected {
    opacity: 1;
    border-color: var(--ink);
  }

  .pd-media .ph {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%);
  }

  .pd-media .ph span {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-info { padding-top: 8px; }

  /* Preorder is a materially different purchase (you're charged now,
     it ships later), so it gets a solid fill rather than the muted
     outline everything else uses. It should be the first thing read. */
  .pd-preorder-badge {
    display: inline-block;
    margin-bottom: 12px;
    padding: 5px 10px;
    border-radius: 2px;
    background: var(--ink);
    color: var(--bg);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Restated next to the buy button, where the decision actually happens.
     The FTC Mail Order Rule expects a stated shipping expectation on
     advance-purchase items, so this line is compliance as well as UX. */

  .pd-name {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-weight: 700;
    line-height: 1.15;
  }

  /* Bumped from 14px/var(--muted) — the price is now a lead element in
     .pd-head (see the grid-areas comment on .pd), so it needs to read
     at a glance, not at the same weight as secondary metadata. */
  .pd-price {
    font-family: var(--font-mono);
    margin-top: 14px;
    font-size: 18px;
    letter-spacing: 0.03em;
    color: var(--ink);
  }

  .pd-price .compare {
    text-decoration: line-through;
    opacity: 0.6;
    margin-right: 10px;
  }

  .pd-price .save {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: lowercase;
    color: var(--muted);
  }

  .pd-sizes { margin-top: 30px; }

  .pd-size-group { margin-bottom: 18px; }

  .pd-size-label {
    font-family: var(--font-mono);
    margin-bottom: 12px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-size-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .pd-size {
    position: relative;
    min-width: 46px;
    height: 42px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--field-line);
    background: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 200ms var(--ease-out), color 200ms var(--ease-out), background 200ms var(--ease-out), transform 160ms var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .pd-size:hover { border-color: var(--ink); }
  }

  .pd-size:not(.unavailable):active { transform: scale(0.96); }

  .pd-size.selected {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--bg);
  }

  .pd-size.unavailable {
    color: var(--muted);
    cursor: not-allowed;
  }

  @media (hover: hover) and (pointer: fine) {
    .pd-size.unavailable:hover { border-color: var(--field-line); }
  }

  .pd-size.unavailable::after {
    content: '';
    position: absolute;
    left: -6px;
    right: -6px;
    top: 50%;
    height: 1px;
    background: var(--muted);
    transform: rotate(-16deg);
  }

  .pd-qty {
    margin-top: 34px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .pd-qty button {
    width: 30px;
    height: 30px;
    border: 1px solid var(--field-line);
    background: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    cursor: pointer;
    transition: border-color 200ms var(--ease-out), transform 140ms var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .pd-qty button:hover { border-color: var(--ink); }
  }

  .pd-qty button:active { transform: scale(0.92); }

  .pd-qty span { font-size: 13px; min-width: 16px; text-align: center; }

  .pd-actions { margin-top: 28px; }

  /* Filled, not outlined — this is the primary purchase action on the
     page and it was reading as secondary chrome next to it. Matches
     the filled-button convention already used for the equivalent
     primary action on lanyard.html/jag-sweats.html; this page and
     cart.html's Checkout were the two places still using an outline
     for what should be the loudest thing on screen. */
  .pd-add {
    position: relative;
    background: var(--ink);
    color: var(--bg);
    border: 0;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 14px 30px;
    cursor: pointer;
    transition: opacity 200ms var(--ease-out), transform 160ms var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .pd-add:hover { opacity: 0.85; }
  }

  .pd-add:not([disabled]):active { transform: scale(0.97); }

  .pd-add[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .pd-add[disabled]:hover { opacity: 0.4; }

  /* Mobile sticky buy bar. A long PDP (gallery, then price, then
     variants, then description) scrolls the real Add-to-Cart button
     out of the thumb zone right when a shopper who scrolled down to
     read more decides to buy — the moment of intent shouldn't cost a
     scroll back to the top. Carries its own compact size chips, not
     just a CTA that jumps back up: a shopper who hasn't picked a size
     yet needs to be able to finish the purchase from here, not be
     bounced back to the top of the page to do it. Desktop keeps the
     real buy box in easy reach already, so this never shows there. */
  .pd-sticky {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    border-top: 1px solid var(--line);
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.35);
    transform: translateY(100%);
    transition: transform 220ms var(--ease-out);
  }

  .pd-sticky.show { transform: translateY(0); }

  @media (max-width: 900px) {
    .pd-sticky { display: flex; }
  }

  .pd-sticky-info { min-width: 0; flex-shrink: 1; }

  .pd-sticky-name {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pd-sticky-price { font-size: 14px; font-weight: 600; }

  .pd-sticky-sizes {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    overflow-x: auto;
  }

  .pd-sticky-sizes .pd-size {
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    font-size: 12px;
    flex-shrink: 0;
  }

  .pd-sticky .pd-add {
    flex-shrink: 0;
    padding: 11px 20px;
    font-size: 11px;
  }

  .pd-desc {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
  }

  .pd-desc-label {
    font-family: var(--font-mono);
    margin-bottom: 14px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-desc p, .pd-desc ul {
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink);
  }

  .pd-desc p + p { margin-top: 12px; }
  .pd-desc ul { list-style: none; }
  .pd-desc li { position: relative; padding-left: 16px; }
  .pd-desc li + li { margin-top: 8px; }
  .pd-desc li::before { content: '-'; position: absolute; left: 0; color: var(--muted); }

  .pd-ship {
    margin-top: 24px;
  }

  .pd-ship summary {
    cursor: pointer;
    list-style: none;
    position: relative;
    padding: 12px 20px 12px 0;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    border-top: 1px solid var(--line);
    transition: color 0.3s ease;
  }

  .pd-ship summary::-webkit-details-marker { display: none; }
  .pd-ship summary:hover { color: var(--ink); }

  .pd-ship summary::after {
    content: '+';
    position: absolute;
    right: 2px;
    top: 10px;
    font-family: var(--font-body);
    font-size: 15px;
  }

  .pd-ship[open] summary::after { content: '\2212'; }

  .pd-ship-body {
    padding: 4px 0 16px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink);
  }

  .pd-ship-body p + p { margin-top: 10px; }

  .pd-size-chart-note {
    font-size: 11px;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .pd-stock-note {
    display: none;
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .pd-stock-note.show { display: block; }

  .pd-confirm {
    display: none;
    margin-top: 16px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-confirm.show { display: block; }
  .pd-confirm a { text-decoration: underline; color: var(--ink); }

  .pd-note {
    margin-top: 34px;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--muted);
    line-height: 1.7;
  }

  .pd-note + .pd-note { margin-top: 8px; }

  /* Restated where the decision actually happens (right under the
     price, above everything else in .pd-head), not just in the
     sitewide banner — same instant, read from the same source
     (assets/drop-countdown.js), so the two can never disagree. */
  .pd-countdown {
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
  }

  /* Sign-up value prop, directly under the ticking countdown. It has
     to be a separate element: renderDropCountdown owns #pdCountdown's
     textContent and rewrites it every tick, so a link placed in there
     would be wiped within 30 seconds — and this one needs to be a
     link. Carries the real welcome discount (5%, the Shopify SIGNUP
     pool) and no other number, and no price on this page is ever
     struck through for it. The close instant is left to the countdown
     directly above rather than repeated here. */
  .pd-signup-prop {
    margin: 6px 0 0;
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.03em;
    color: var(--muted);
  }

  .pd-signup-prop a { color: var(--ink); }

  /* Second shipping line. Same voice as .pd-note, just tighter to it
     so the pair reads as one shipping statement rather than two
     competing claims. */
  .pd-note-intl { margin-top: 4px; }

  /* ---------- trust block ----------
     Renders nothing until assets/reviews.js has a real entry for this
     handle — see that file. Grid shape matches .rel-grid on purpose:
     one visual language for "a row of product tiles" on this page,
     whether it's related items or customer photos. */
  .pd-trust {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
  }

  .pd-trust-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .pd-trust-item {
    margin: 0;
  }

  .pd-trust-item img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 2px;
  }

  .pd-trust-item figcaption {
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink);
  }

  .pd-trust-size {
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .pd-trust-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---------- related / recently viewed ---------- */
  .rel-section {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 40px 10vh;
  }

  .rel-label {
    font-family: var(--font-mono);
    margin-bottom: 20px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rel-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .rel-item {
    display: block;
    aspect-ratio: 3 / 4;
    position: relative;
    overflow: hidden;
    border-radius: 2px;
  }

  .rel-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .rel-item .ph {
    width: 100%;
    height: 100%;
    background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%);
  }

  .rel-item:hover img { transform: scale(1.04); }

  .rel-item .rel-name {
    position: absolute;
    left: 10px;
    bottom: 8px;
    right: 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.45);
  }

  @media (max-width: 640px) {
    .rel-grid { grid-template-columns: repeat(2, 1fr); }
    .rel-section { padding: 0 20px 8vh; }
  }

  .not-found {
    min-height: 40vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
  }

  .not-found a { text-decoration: underline; }

  /* Same gap shop.html had: #pd-root starts empty and nothing showed
     while fetchProduct/fetchCatalogLite were in flight. This is the
     single most purchase-critical page on the site, so a stalled
     connection here is worse than anywhere else to leave silent. */
  .pd-loading {
    min-height: 40vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .pd-loading.hide { display: none; }

  @media (max-width: 720px) {
    /* head -> media -> info: see the comment on .pd above. Same three
       blocks as desktop, reordered so price and the buy box don't sit
       below a full-width image taller than the viewport. */
    .pd {
      grid-template-columns: 1fr;
      grid-template-areas: "head" "media" "info";
      gap: 18px;
    }
    .pd-head { margin-bottom: 0; }
  }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    header nav { gap: 16px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; min-width: 0; max-width: calc(100vw - 130px); }
    header nav::-webkit-scrollbar { display: none; }
    .pd { padding: 0 20px 10vh; }
  }

  /* ---------- facts row ----------
     Fabric and fit, stated plainly under the price. Only renders for
     fields that are actually filled in on assets/product-details.js. */
  .pd-facts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  .pd-fact {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 5px 9px;
  }

  /* ---------- model reference ----------
     Sits directly under the size row, because that is the moment the
     question ("will this fit me?") actually gets asked. Photography
     alone cannot answer it; height + size worn can. */
  .pd-model {
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ---------- image zoom ---------- */
  .pd-media-main { position: relative; cursor: zoom-in; }

  .pd-zoom-hint {
    position: absolute;
    right: 10px;
    bottom: 10px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 9px;
    border-radius: 2px;
    background: rgba(11, 10, 8, 0.66);
    backdrop-filter: blur(6px);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 200ms var(--ease-out);
    pointer-events: none;
  }

  /* Touch devices fire :hover on tap, so the hint would stick after a
     tap. Only offer it where there's a real pointer. */
  @media (hover: hover) and (pointer: fine) {
    .pd-media-main:hover .pd-zoom-hint { opacity: 1; }
  }

  .pd-lightbox {
    border: none;
    padding: 0;
    background: transparent;
    max-width: 100vw;
    max-height: 100vh;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .pd-lightbox::backdrop { background: rgba(11, 10, 8, 0.94); }

  .pd-lightbox-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    /* lets mobile pinch-zoom the high-res source natively */
    overflow: auto;
    touch-action: pinch-zoom;
  }

  .pd-lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 2px;
  }

  /* Nothing in the real world appears from nothing: scale from 0.96,
     not 0, and exit faster than it enters. */
  .pd-lightbox[open] .pd-lightbox-inner {
    animation: pdZoomIn 200ms var(--ease-out);
  }

  @keyframes pdZoomIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  .pd-lightbox-close {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 38px;
    height: 38px;
    border: 1px solid var(--field-line);
    border-radius: 2px;
    background: rgba(11, 10, 8, 0.7);
    color: var(--ink);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    transition: border-color 200ms var(--ease-out), transform 160ms var(--ease-out);
  }

  .pd-lightbox-close:hover { border-color: var(--ink); }
  .pd-lightbox-close:active { transform: scale(0.94); }

  /* ---------- size guide ---------- */
  .pd-measure-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 4px;
  }

  .pd-measure-table caption {
    text-align: left;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 8px;
  }

  .pd-measure-table th,
  .pd-measure-table td {
    text-align: left;
    padding: 7px 10px 7px 0;
    border-bottom: 1px solid var(--line);
  }

  .pd-measure-table th {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 400;
    color: var(--muted);
  }

  .pd-measure-table td { color: var(--ink); font-weight: 300; }
  .pd-measure-table tbody tr:last-child th,
  .pd-measure-table tbody tr:last-child td { border-bottom: none; }

  .pd-measure-how { margin-top: 20px; }

  .pd-measure-how li {
    margin: 0 0 7px 16px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
  }

  .pd-measure-how li strong { color: var(--ink); font-weight: 500; }

  /* Shown when nobody has measured this garment yet. Deliberately says
     so rather than rendering a grid of "--", which reads as broken and
     tells the shopper nothing. */
  .pd-measure-empty {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }

  .pd-measure-empty a { text-decoration: underline; }

  /* ---------- back in stock ----------
     Tapping a sold-out size used to do nothing at all. Now it turns a
     dead end into a signup. */
  .pd-bis {
    margin-top: 16px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 2px;
    display: none;
  }

  .pd-bis.show { display: block; }

  .pd-bis-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .pd-bis-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .pd-bis-row input { flex: 1; min-width: 150px; }

  .pd-bis-row button {
    border: 1px solid var(--field-line);
    background: none;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0 16px;
    cursor: pointer;
    border-radius: 2px;
    transition: border-color 200ms var(--ease-out), background 200ms var(--ease-out),
                color 200ms var(--ease-out), transform 160ms var(--ease-out);
  }

  .pd-bis-row button:hover { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .pd-bis-row button:active { transform: scale(0.97); }
  .pd-bis-row button:disabled { opacity: 0.5; cursor: default; transform: none; }

  .pd-bis-msg {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  @media (max-width: 640px) {
    .pd-lightbox-inner { padding: 12px; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>

<script src="assets/site.js"></script>
<script src="assets/product-details.js"></script>
<script src="assets/reviews.js"></script>
<script src="assets/drop-countdown.js"></script>
<script>
  // ---------------------------------------------------------------
  // Product page. Shared plumbing (Storefront fetch, cart, Klaviyo,
  // browsing history) lives in assets/site.js; only page behaviour is
  // here. Real garment measurements and model info come from
  // assets/product-details.js — nothing on this page is invented.
  // ---------------------------------------------------------------
  const A = window.Asior;

  // Sitewide banner (the old email-signup teaser bar, replaced — see
  // scripts/build.js's comment on HEADER_FULL). Independent of the
  // product fetch below, so it doesn't wait on Shopify.
  if (A.renderDropCountdown) {
    A.renderDropCountdown({
      el: document.getElementById('teaserBar'),
      prefix: 'fall drop closes — ',
      // Verified shipping offer rides along in the same bar; null when
      // nothing is confirmed, in which case nothing is appended.
      suffix: window.Asior.freeShippingBadge && window.Asior.freeShippingBadge(),
      closedText: 'fall drop closed',
    });
  }

  // Generated pages (/products/<handle>.html) set this. The ?id= form
  // still works so older shared links don't break.
  const HANDLE = window.__PRODUCT_HANDLE
    || new URLSearchParams(location.search).get('id');

  const root = document.getElementById('pd-root');
  const relRoot = document.getElementById('rel-root');

  // Product links are always root-absolute: this same markup renders
  // both at /product.html and at /products/<handle>.html, and a relative
  // href would resolve differently in each.
  const productUrl = h => '/products/' + h + '.html';

  // ---------------------------------------------------------------
  // Two queries, not one.
  //
  // This page used to pull the entire catalog — every description, all
  // twelve images and twenty variants for every product — just to show
  // one item. That was ~4.5x more data than needed and it got worse with
  // every product added. Now: everything for the product being viewed,
  // and only handle/title/one image for the related rail.
  // ---------------------------------------------------------------
  async function fetchProduct(handle) {
    const data = await A.shopifyFetch(`
      query($handle: String!) {
        product(handle: $handle) {
          id title handle descriptionHtml
          images(first: 12) { edges { node { ${A.IMAGE_FIELDS} } } }
          options { name values }
          variants(first: 40) {
            edges { node {
              id sku availableForSale
              price { amount currencyCode }
              compareAtPrice { amount }
              selectedOptions { name value }
            } }
          }
        }
      }`, { handle });
    return data.product;
  }

  async function fetchCatalogLite() {
    const data = await A.shopifyFetch(`{
      products(first: 50) {
        edges { node { handle title featuredImage { ${A.IMAGE_FIELDS} } } }
      }
    }`);
    return data.products.edges.map(e => e.node);
  }

  // Real per-size stock, for the "only N left" note. Deliberately its
  // own query, not a field added to fetchProduct above: an earlier pass
  // added quantityAvailable to a product-catalog query (assets/fall-grid.js)
  // and it broke live images and pricing across browsers in production —
  // see that file's history. Whatever the exact cause, isolating this
  // field means a permission error or bad response here can only ever
  // cost the stock note, never the price, images, or ability to buy.
  // Resolves to null (not a thrown error) on any failure, so the caller
  // never needs a try/catch of its own.
  async function fetchVariantStock(handle) {
    try {
      const data = await A.shopifyFetch(`
        query($handle: String!) {
          product(handle: $handle) {
            variants(first: 40) { edges { node { id quantityAvailable } } }
          }
        }`, { handle });
      if (!data.product) return null;
      return new Map(data.product.variants.edges.map(e => [e.node.id, e.node.quantityAvailable]));
    } catch (err) {
      return null;
    }
  }

  // A placeholder line left in Shopify's own product description field
  // (draft/internal notes like "specs pending") is invisible to this
  // codebase — it lives in Shopify admin, not here — but it still
  // shouldn't reach a customer. Strip any paragraph that reads like an
  // internal placeholder rather than real copy, whatever page it's on.
  const PLACEHOLDER_LINE = /\b(spec[s]?\s*pending|pending\s*spec[s]?|tbd|tba|coming soon|placeholder|lorem ipsum|to be (determined|announced|confirmed|added))\b/i;

  function descriptionFromHtml(html) {
    if (!html) return null;
    const paragraphs = html
      .split(/<\/p>|<br\s*\/?>/i)
      .map(p => p.replace(/<[^>]+>/g, '').trim())
      .filter(Boolean)
      .filter(p => !PLACEHOLDER_LINE.test(p));
    return paragraphs.length ? paragraphs : null;
  }

  function normalizeProduct(node, stockByVariant) {
    const optionNames = node.options.map(o => o.name).filter(n => n !== 'Title');
    const variants = node.variants.edges.map(e => {
      const v = e.node;
      const options = {};
      v.selectedOptions.forEach(so => { if (so.name !== 'Title') options[so.name] = so.value; });
      return {
        options,
        variantId: v.id,
        sku: v.sku,
        price: parseFloat(v.price.amount),
        currency: v.price.currencyCode,
        comparePrice: v.compareAtPrice ? parseFloat(v.compareAtPrice.amount) : null,
        available: v.availableForSale,
        // null means "unknown" (fetchVariantStock failed, or this
        // variant wasn't in its response) — never treat null as zero.
        // 0 is itself a real, meaningful value (genuinely sold out) and
        // is left as 0, not coerced to null.
        stockCount: stockByVariant && stockByVariant.has(v.id) ? stockByVariant.get(v.id) : null,
      };
    });
    // FALL_PRODUCTS (assets/launch-config.js) carries the customer-
    // facing name for any Fall piece — Shopify's own title can be an
    // internal/manufacturing name a customer should never see. Falls
    // through to Shopify's title for every product not in that list.
    const fallOverride = (window.ASIOR_LAUNCH && window.ASIOR_LAUNCH.FALL_PRODUCTS || [])
      .find(p => p.handle === node.handle);
    return {
      handle: node.handle,
      name: fallOverride ? fallOverride.name : node.title.replace(/\s*\[preorder\]\s*/i, '').trim(),
      images: node.images.edges.map(e => e.node),
      description: descriptionFromHtml(node.descriptionHtml),
      optionNames,
      variants,
      isPreorder: /\[preorder\]/i.test(node.title),
    };
  }

  // ---------------------------------------------------------------
  // Size guide, built from assets/product-details.js.
  //
  // Never renders a table of "--": an empty grid reads as broken. When
  // there's no real measurement data, the guide falls back to the
  // general comparison method (howToMeasure) with no apologetic framing
  // and no invented numbers — see sizeGuideHTML below.
  // ---------------------------------------------------------------
  const details = (window.ASIOR_PRODUCT_DETAILS || {})[HANDLE] || null;
  const MCOLS = window.ASIOR_MEASUREMENT_COLUMNS || {};

  const toCm = inches => Math.round(inches * 2.54 * 10) / 10;

  function measurementTable(caption, colKey, rows) {
    const cols = MCOLS[colKey];
    if (!cols || !rows) return '';
    const sizes = Object.keys(rows);
    const hasAny = sizes.some(sz => cols.some(c => rows[sz] && rows[sz][c.key] != null));
    if (!hasAny) return '';
    return `
      <table class="pd-measure-table">
        ${caption ? `<caption>${A.escapeHtml(caption)}</caption>` : ''}
        <thead>
          <tr>
            <th scope="col">Size</th>
            ${cols.map(c => `<th scope="col">${c.label} (in / cm)</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${sizes.map(sz => `
            <tr>
              <th scope="row">${A.escapeHtml(sz)}</th>
              ${cols.map(c => {
                const v = rows[sz] ? rows[sz][c.key] : null;
                return `<td>${v == null ? '—' : v + ' / ' + toCm(v)}</td>`;
              }).join('')}
            </tr>`).join('')}
        </tbody>
      </table>`;
  }

  function howToMeasure(kind) {
    const top = `
      <li><strong>Chest</strong> — measure armpit to armpit across the front, then double it.</li>
      <li><strong>Length</strong> — from the highest point of the shoulder straight down to the hem.</li>
      <li><strong>Sleeve</strong> — from the centre back of the neck out to the cuff.</li>`;
    // Sweats: no rise line — an elastic waistband isn't measured that way.
    const bottom = `
      <li><strong>Waist</strong> — across the flat waistband, then double it.</li>
      <li><strong>Inseam</strong> — crotch seam down to the leg opening.</li>
      <li><strong>Outseam</strong> — top of the waistband straight down the outside of the leg.</li>`;
    const shorts = `
      <li><strong>Waist</strong> — across the flat waistband, then double it.</li>
      <li><strong>Rise</strong> — crotch seam up to the top of the waistband.</li>
      <li><strong>Inseam</strong> — crotch seam down to the leg opening.</li>
      <li><strong>Outseam</strong> — top of the waistband straight down the outside of the leg.</li>`;
    const which = kind === 'bottom' ? bottom
      : kind === 'shorts' ? shorts
      : kind === 'set' ? top + bottom
      : top; // top and polo share the same three measurements
    return `
      <div class="pd-measure-how">
        <p class="pd-size-chart-note">Garment measured flat, not body measurements. Compare against a piece you already own and like the fit of.</p>
        <ul>${which}</ul>
      </div>`;
  }

  function sizeGuideHTML(product) {
    if (!product.optionNames.includes('Size')) return '';
    const kind = details && details.garment ? details.garment : 'top';

    let tables = '';
    if (details && details.measurements) {
      if (kind === 'set') {
        tables = measurementTable('Crewneck', 'top', details.measurements.top)
               + measurementTable('Sweats', 'bottom', details.measurements.bottom);
      } else {
        tables = measurementTable('', kind, details.measurements);
      }
    }

    const model = details && details.model && details.model.height && details.model.wearing
      ? `<p class="pd-model">Model is ${A.escapeHtml(details.model.height)}, wearing size ${A.escapeHtml(details.model.wearing)}.</p>`
      : '';

    // No apologetic "not measured yet" framing when there's no table —
    // just the real, always-true comparison method (howToMeasure), which
    // stands on its own as useful guidance. Never invented numbers to
    // fill the gap instead.
    const body = tables ? tables + model + howToMeasure(kind) : model + howToMeasure(kind);

    // Label it for what's actually inside. Until this garment has real
    // measurements in product-details.js there is no table here, only
    // the how-to-measure method — and "Size Guide" on a panel with no
    // sizes in it spends a shopper's attention and returns nothing,
    // which is worse than not offering the link. The moment real
    // numbers land, this becomes a Size Guide again automatically.
    const label = tables ? 'Size Guide' : 'How to Measure';

    return `
      <details class="pd-ship pd-size-chart">
        <summary>${label}</summary>
        <div class="pd-ship-body">${body}</div>
      </details>`;
  }

  // ---------------------------------------------------------------
  (async function () {
    let product, catalog, stockByVariant;
    try {
      // fetchVariantStock never throws (it catches internally and
      // resolves null instead) — that's what makes it safe to run
      // alongside the two queries that must succeed for the page to
      // render at all.
      const [p, c, stock] = await Promise.all([
        fetchProduct(HANDLE), fetchCatalogLite(), fetchVariantStock(HANDLE),
      ]);
      stockByVariant = stock;
      document.getElementById('pdLoading').classList.add('hide');
      if (!p) {
        // Soft 404: the page renders a friendly message but used to
        // still return 200 with no robots hint, so Google indexed it as
        // a real page. noindex tells it not to.
        document.head.insertAdjacentHTML('beforeend', '<meta name="robots" content="noindex">');
        root.innerHTML = `
          <div class="not-found">
            <div>That piece isn't in the catalog.</div>
            <a href="/shop.html">Back to Shop All</a>
          </div>`;
        return;
      }
      product = normalizeProduct(p, stockByVariant);
      catalog = c;
    } catch (err) {
      console.error('Product page failed to load:', err);
      document.getElementById('pdLoading').classList.add('hide');
      root.innerHTML = `
        <div class="not-found">
          <div>Couldn't load this product right now. Try refreshing.</div>
          <a href="/shop.html">Back to Shop All</a>
        </div>`;
      return;
    }

    document.title = product.name + ' | Asior';

    // Consolidate ?id= and /products/<handle>.html onto one indexable URL.
    const canonical = document.querySelector('link[rel="canonical"]');
    if (canonical) canonical.href = location.origin + productUrl(product.handle);

    const hasOptions = product.optionNames.length > 0;
    const findVariant = sel => product.variants.find(v =>
      product.optionNames.every(n => v.options[n] === sel[n]));

    // Nothing preselected. A past "usual size, preselected" feature
    // here defaulted the size picker to whichever size this browser
    // had clicked most before (assets/site.js's preferredSize()) — a
    // real signal, never invented, but the founder's call is that a
    // silent default (however honestly derived) still ends up biasing
    // orders toward whatever a visitor happened to click first, and
    // that's not worth the personalization. A size-less product still
    // has exactly one real variant, so it's still selected by default
    // — there's no picker to leave blank in that case.
    const selection = hasOptions ? {} : { ...product.variants[0].options };

    // ---- media ----
    const mainImg = product.images.length
      ? A.imgTag(product.images[0], {
          id: 'pdMainImg', eager: true, alt: product.images[0].altText || product.name,
          sizes: '(max-width: 720px) 100vw, 480px',
        })
      : `<div class="ph"><span>No image available</span></div>`;

    const thumbs = product.images.length > 1
      ? `<div class="pd-media-thumbs" id="pdThumbs">${product.images.map((img, i) => `
          <button type="button" class="pd-thumb${i === 0 ? ' selected' : ''}" data-index="${i}"
                  aria-pressed="${i === 0}" aria-label="View image ${i + 1} of ${product.images.length}">
            ${A.imgTag(img, { alt: img.altText || product.name + ' view ' + (i + 1), sizes: '64px' })}
          </button>`).join('')}</div>`
      : '';

    const zoomHint = product.images.length
      ? `<div class="pd-zoom-hint" aria-hidden="true">Click to zoom</div>` : '';

    // ---- copy blocks ----
    const shipHTML = `
      <details class="pd-ship">
        <summary>Shipping &amp; Returns</summary>
        <div class="pd-ship-body">
          <p>Ships within 1-2 business days via USPS. Delivery typically takes 2-5 business days after that. Shipping within the US only for now.</p>
          <p>Returns and exchanges accepted within 14 days of delivery, email <a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a> to start one. Sizing exchanges are subject to availability. Items must be unworn, unwashed, with tags attached. Return shipping is on us if something arrived damaged or wrong, otherwise it's on you.</p>
        </div>
      </details>`;

    const descHTML = product.description
      ? `<div class="pd-desc">
          <div class="pd-desc-label">Description</div>
          ${product.description.length && product.description[0].length < 60 && product.description.length > 2
            ? `<ul>${product.description.map(l => `<li>${A.escapeHtml(l)}</li>`).join('')}</ul>`
            : product.description.map(p => `<p>${A.escapeHtml(p)}</p>`).join('')}
        </div>${shipHTML}`
      : shipHTML;

    // Renders nothing until assets/reviews.js has a real entry for this
    // handle. Built now, on purpose, while there's nothing to show yet —
    // see that file's own comment for the exact shape to add later.
    function trustBlockHTML(handle) {
      const items = (window.ASIOR_REVIEWS || {})[handle];
      if (!items || !items.length) return '';
      return `
        <section class="pd-trust">
          <div class="pd-desc-label">From Customers</div>
          <div class="pd-trust-grid">
            ${items.map(r => `
              <figure class="pd-trust-item">
                <img src="${A.escapeAttr(r.image)}" alt="${A.escapeAttr(r.name ? r.name + '’s photo' : 'Customer photo')}" loading="lazy">
                ${r.quote ? `<figcaption>${A.escapeHtml(r.quote)}${r.size ? ` <span class="pd-trust-size">— size ${A.escapeHtml(r.size)}</span>` : ''}</figcaption>` : ''}
              </figure>`).join('')}
          </div>
        </section>`;
    }

    // No fit note fabricated when there isn't one — simply omitted, same
    // as fabric/chainLength/pendantSize below when those are unset.
    const fitFact = details && details.fit ? details.fit : null;

    const facts = [
      details && details.fabric,
      fitFact,
      details && details.chainLength && 'Chain ' + details.chainLength,
      details && details.pendantSize && 'Pendant ' + details.pendantSize,
    ].filter(Boolean);

    const factsHTML = facts.length
      ? `<div class="pd-facts">${facts.map(f => `<span class="pd-fact">${A.escapeHtml(f)}</span>`).join('')}</div>`
      : '';

    // A preorder with no stated date defaults you to the FTC's 30-day
    // rule. If a real window is set in product-details.js, say it.
    const preorderNote = details && details.shipBy
      ? `You'll be charged now. This drop is expected to ship ${A.escapeHtml(details.shipBy)}.`
      : "You'll be charged now and it ships as soon as this drop is ready. Ships in 1-2 business days via USPS after that.";

    root.innerHTML = `
      <div class="pd">
        <div class="pd-head">
          ${product.isPreorder ? `<div class="pd-preorder-badge">Preorder</div>` : ''}
          <h1 class="pd-name">${A.escapeHtml(product.name)}</h1>
          <div class="pd-price tnum" id="pdPrice"></div>
          <p class="pd-countdown" id="pdCountdown"></p>
          <p class="pd-signup-prop" id="pdSignupProp"></p>
          ${factsHTML}
        </div>
        <div class="pd-media">
          <div class="pd-media-main">${mainImg}${zoomHint}</div>
          ${thumbs}
        </div>
        <div class="pd-info">
          <div class="pd-buy" id="pdBuy">
            ${hasOptions ? `<div class="pd-sizes" id="pdSizes"></div>` : ''}
            <div class="pd-bis" id="pdBis">
              <div class="pd-bis-label" id="pdBisLabel">Email me when this is back</div>
              <div class="pd-bis-row">
                <label class="sr-only" for="pdBisEmail">Email address</label>
                <input class="field" type="email" id="pdBisEmail" name="email" placeholder="Email"
                       autocomplete="email" spellcheck="false" required>
                <button type="button" id="pdBisBtn">Notify Me</button>
              </div>
              <p class="pd-bis-msg" id="pdBisMsg" role="status" aria-live="polite"></p>
            </div>
            ${sizeGuideHTML(product)}
            <div class="pd-qty">
              <button type="button" id="qtyDown" aria-label="Decrease quantity">-</button>
              <span id="qtyVal" aria-live="polite">1</span>
              <button type="button" id="qtyUp" aria-label="Increase quantity">+</button>
            </div>
            <div class="pd-actions">
              <button class="pd-add" id="addBtn">${product.isPreorder ? 'Preorder' : 'Buy Now'}</button>
              <div class="pd-confirm" id="addConfirm" role="status" aria-live="polite">Added, <a href="/cart.html">view cart</a></div>
            </div>
            <p class="pd-stock-note" id="pdStockNote"></p>
          </div>
          ${product.isPreorder
            ? `<p class="pd-note" id="pdNote">${preorderNote}</p>
               <p class="pd-note">14-day returns on unworn, unwashed items with tags attached.</p>`
            : `<p class="pd-note" id="pdNote">${A.escapeHtml(A.shippingLine())}</p>
              ${A.internationalLine() ? `<p class="pd-note pd-note-intl">${A.escapeHtml(A.internationalLine())}</p>` : ''}
               <p class="pd-note">14-day returns on unworn, unwashed items with tags attached. No account needed at checkout.</p>`}
          ${descHTML}
          ${trustBlockHTML(product.handle)}
        </div>
      </div>
      <div class="pd-sticky" id="pdSticky">
        <div class="pd-sticky-info">
          <div class="pd-sticky-name">${A.escapeHtml(product.name)}</div>
          <div class="pd-sticky-price tnum" id="pdStickyPrice"></div>
        </div>
        ${hasOptions ? `<div class="pd-sticky-sizes" id="pdStickySizes"></div>` : ''}
        <button class="pd-add" id="addBtnSticky">${product.isPreorder ? 'Preorder' : 'Buy Now'}</button>
      </div>`;

    const currentVariant = () => hasOptions ? findVariant(selection) : product.variants[0];

    function renderPrice() {
      const v = currentVariant();
      const el = document.getElementById('pdPrice');
      const stickyEl = document.getElementById('pdStickyPrice');
      if (v) {
        const onSale = v.comparePrice && v.comparePrice > v.price;
        el.innerHTML = onSale
          ? `<span class="compare">$${v.comparePrice}</span>$${v.price}`
            + `<span class="save">save $${Math.round(v.comparePrice - v.price)}</span>`
          : `$${v.price}`;
        if (stickyEl) stickyEl.textContent = `$${v.price}`;
        return;
      }
      // No size picked yet (nothing is preselected) — still a real
      // price, same min/max-across-variants fact shop.html's grid
      // cards already show, not a placeholder.
      const prices = product.variants.map(vv => vv.price);
      const min = Math.min(...prices), max = Math.max(...prices);
      const label = min === max ? `$${min}` : `From $${min}`;
      el.textContent = label;
      if (stickyEl) stickyEl.textContent = label;
    }

    function renderSizes() {
      if (!hasOptions) return;
      const wrap = document.getElementById('pdSizes');
      wrap.innerHTML = product.optionNames.map(name => {
        const values = [...new Set(product.variants.map(v => v.options[name]))];
        const row = values.map(val => {
          const v = findVariant({ ...selection, [name]: val });
          const sel = selection[name] === val;
          const avail = v ? v.available : false;
          return `<button type="button" class="pd-size${sel ? ' selected' : ''}${!avail ? ' unavailable' : ''}"
                    data-option="${A.escapeAttr(name)}" data-value="${A.escapeAttr(val)}"
                    aria-pressed="${sel}">${A.escapeHtml(val)}</button>`;
        }).join('');
        return `<div class="pd-size-group"><div class="pd-size-label">${A.escapeHtml(name)}</div><div class="pd-size-row">${row}</div></div>`;
      }).join('');

      wrap.querySelectorAll('.pd-size').forEach(btn => {
        btn.addEventListener('click', () => selectOption(btn.dataset.option, btn.dataset.value, btn.classList.contains('unavailable')));
      });

      renderStickySizes();
    }

    // The sticky bar only ever offers the "Size" option — the one
    // choice that actually blocks a purchase from finishing. A product
    // with a second option (color, material) still routes that pick
    // through the full buy box; duplicating every option down here
    // would turn a quick bar into a second product page.
    function renderStickySizes() {
      const wrap = document.getElementById('pdStickySizes');
      if (!wrap || !product.optionNames.includes('Size')) return;
      const values = [...new Set(product.variants.map(v => v.options.Size))];
      wrap.innerHTML = values.map(val => {
        const v = findVariant({ ...selection, Size: val });
        const sel = selection.Size === val;
        const avail = v ? v.available : false;
        return `<button type="button" class="pd-size${sel ? ' selected' : ''}${!avail ? ' unavailable' : ''}"
                  data-option="Size" data-value="${A.escapeAttr(val)}"
                  aria-label="Size ${A.escapeAttr(val)}" aria-pressed="${sel}">${A.escapeHtml(val)}</button>`;
      }).join('');
      wrap.querySelectorAll('.pd-size').forEach(btn => {
        btn.addEventListener('click', () => selectOption(btn.dataset.option, btn.dataset.value, btn.classList.contains('unavailable')));
      });
    }

    // Shared by both the main size buttons and the sticky bar's —
    // whichever one a shopper actually taps, both stay in sync.
    function selectOption(option, value, wasUnavailable) {
      if (wasUnavailable) { openBackInStock(value); return; }
      selection[option] = value;
      if (option === 'Size') A.recordSizeChoice(value);
      hideBackInStock();
      renderSizes(); renderPrice(); renderAddButton(); renderStockNote();
    }

    function renderAddButton() {
      const v = currentVariant();
      const btn = document.getElementById('addBtn');
      const stickyBtn = document.getElementById('addBtnSticky');
      const needsPick = hasOptions && product.optionNames.includes('Size') && !selection.Size;
      if (needsPick) {
        // Genuinely nothing chosen — not sold out, not ready to buy.
        // Disabled stays disabled until a real click sets selection.Size.
        btn.textContent = 'Select a Size';
        btn.disabled = true;
        if (stickyBtn) { stickyBtn.textContent = 'Select a Size'; stickyBtn.disabled = true; }
        return;
      }
      const sold = !v || !v.available;
      const label = sold ? 'Sold Out' : (product.isPreorder ? 'Preorder' : 'Buy Now');
      btn.textContent = label;
      btn.disabled = sold;
      if (stickyBtn) { stickyBtn.textContent = label; stickyBtn.disabled = sold; }
      if (sold && v) openBackInStock(selection.Size);
    }

    // ---- back in stock ----
    function openBackInStock(sizeLabel) {
      const box = document.getElementById('pdBis');
      document.getElementById('pdBisLabel').textContent =
        sizeLabel ? `Sold out in ${sizeLabel}. Email me when it's back.` : 'Email me when this is back';
      box.classList.add('show');
      box.dataset.size = sizeLabel || '';
    }
    function hideBackInStock() {
      const box = document.getElementById('pdBis');
      box.classList.remove('show');
      document.getElementById('pdBisMsg').textContent = '';
    }

    document.getElementById('pdBisBtn').addEventListener('click', async () => {
      const input = document.getElementById('pdBisEmail');
      const msg = document.getElementById('pdBisMsg');
      const btn = document.getElementById('pdBisBtn');
      const size = document.getElementById('pdBis').dataset.size;
      if (!input.checkValidity()) { input.reportValidity(); return; }

      const wanted = product.variants.find(v => v.options.Size === size) || currentVariant();
      btn.disabled = true;
      try {
        await A.klaviyoBackInStock(input.value, wanted && wanted.variantId, {
          product: product.name, handle: product.handle, size: size || null,
        });
        msg.textContent = "You're on the list. We'll email you the moment it's back.";
        input.style.display = 'none';
        btn.style.display = 'none';
      } catch (err) {
        msg.textContent = "That didn't go through. Try again in a moment.";
        btn.disabled = false;
      }
    });

    // ---- gallery + zoom ----
    let currentIndex = 0;

    function wireGallery() {
      const img = document.getElementById('pdMainImg');
      const thumbEls = document.querySelectorAll('.pd-thumb');
      if (!img) return;
      thumbEls.forEach(btn => {
        btn.addEventListener('click', () => {
          currentIndex = parseInt(btn.dataset.index, 10);
          const next = product.images[currentIndex];
          img.src = next.w1200 || next.url;
          img.srcset = A.srcsetFor(next);
          img.alt = next.altText || product.name;
          thumbEls.forEach(b => { b.classList.remove('selected'); b.setAttribute('aria-pressed', 'false'); });
          btn.classList.add('selected');
          btn.setAttribute('aria-pressed', 'true');
        });
      });
      document.querySelector('.pd-media-main').addEventListener('click', openZoom);
    }

    // 56% of shoppers' first action on a product page is exploring the
    // images, and zoom was missing at every breakpoint. <dialog> gives
    // focus trapping and Escape-to-close for free; the inner container
    // allows native pinch-zoom on touch.
    function openZoom() {
      if (!product.images.length) return;
      const src = product.images[currentIndex];
      const dlg = document.getElementById('pdLightbox');
      const holder = document.getElementById('pdLightboxImg');
      holder.innerHTML = A.imgTag(src, {
        alt: src.altText || product.name, eager: true, sizes: '92vw',
      });
      // swap in the largest rendition available for the zoomed state
      const el = holder.querySelector('img');
      if (src.w2000) el.src = src.w2000;
      dlg.showModal();
    }

    const lightbox = document.getElementById('pdLightbox');
    document.getElementById('pdLightboxClose').addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.close(); });

    renderPrice(); renderSizes(); renderAddButton(); wireGallery();

    // Same instant as the sitewide banner (scripts/build.js's
    // HEADER_FULL) and index.html's post-Early-Access section — all
    // three read window.ASIOR_LAUNCH.DROP_CLOSE_TIME via this one
    // renderer (assets/drop-countdown.js), so none of them can drift
    // from another.
    // Display only — this does not disable Buy Now when the clock
    // passes. Whether to actually stop taking orders at close is a
    // business call for whoever runs the drop, not something a display
    // countdown should decide unilaterally.
    if (A.renderDropCountdown) {
      A.renderDropCountdown({
        el: document.getElementById('pdCountdown'),
        prefix: 'fall drop closes — ',
        closedText: 'fall drop closed',
      });
    }

    // Sign-up is how you get a discount — there is no sitewide sale and
    // no code applied on anyone's behalf, so this is the honest offer
    // to make here. 5% is the real welcome code (Shopify SIGNUP pool);
    // no other number belongs in this sentence.
    //
    // No close date here, unlike the cart's version of this line: the
    // ticking countdown sits directly above it and the teaser bar sits
    // above that, so stating the deadline a third time reads as
    // clutter rather than urgency. The cart has no buy-box countdown,
    // so it carries the date itself.
    const propEl = document.getElementById('pdSignupProp');
    if (propEl) {
      propEl.innerHTML =
        '<a href="shop.html#signup">Sign up and get 5% off your first order.</a>';
    }

    // ---- quantity ----
    let qty = 1;
    const qtyVal = document.getElementById('qtyVal');
    document.getElementById('qtyDown').addEventListener('click', () => { qty = Math.max(1, qty - 1); qtyVal.textContent = qty; });
    document.getElementById('qtyUp').addEventListener('click', () => { qty += 1; qtyVal.textContent = qty; });

    // Straight to Shopify's own checkout on click — same pattern as
    // lanyard.html. Used to add the item and just show "Added, view
    // cart", leaving checkout two clicks away (cart.html, then its own
    // Checkout button). Now it's one: add, then go straight there.
    document.getElementById('addBtn').addEventListener('click', async () => {
      const v = currentVariant();
      if (!v || !v.available) return;
      const btn = document.getElementById('addBtn');
      const confirmEl = document.getElementById('addConfirm');
      btn.disabled = true;
      btn.textContent = 'Redirecting…';
      try {
        // Buy Now gets its own single-line cart rather than appending to
        // the saved one. Buying, pressing back, and buying again used to
        // stack a second line, so checkout showed two of the same piece
        // for what the shopper meant as one purchase. Their saved cart
        // is untouched, so anything quick-added from the grid survives.
        const updated = await A.createBuyNowCart(v.variantId, qty);
        if (selection.Size) A.recordSizeChoice(selection.Size);
        A.klaviyoAddedToCart({
          handle: product.handle,
          name: product.name,
          url: location.origin + productUrl(product.handle),
          price: v.price,
          quantity: qty,
          size: selection.Size || null,
        });
        if (window.AsiorAnalytics) {
          window.AsiorAnalytics.addToCart({
            handle: product.handle, name: product.name,
            variantId: v.variantId, price: v.price,
            quantity: qty, currency: v.currency,
          });
        }
        A.klaviyoTrack('Added To Cart', {
          product: product.name, handle: product.handle,
          size: selection.Size || null, price: v.price, quantity: qty,
        });
        location.href = updated.checkoutUrl;
      } catch (err) {
        confirmEl.textContent = 'Something went wrong adding that. Try again.';
        confirmEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = product.isPreorder ? 'Preorder' : 'Buy Now';
      }
    });

    // Proxy straight to the real button's own handler rather than
    // duplicating the cart/checkout logic here — one source of truth
    // for what "buy" actually does.
    const addBtnSticky = document.getElementById('addBtnSticky');
    if (addBtnSticky) {
      addBtnSticky.addEventListener('click', () => {
        if (!addBtnSticky.disabled) document.getElementById('addBtn').click();
      });
    }

    // Shows once the real Add-to-Cart button has been seen and then
    // scrolled past — never on load. On a tall mobile layout (big hero
    // image, name, price, countdown) the real button often hasn't
    // rendered into view yet at the moment this observer attaches, so
    // "not intersecting" alone would fire the sticky bar immediately —
    // exactly the "appears before the visitor has even seen the page"
    // mistake this bar exists to avoid. Requiring one real sighting
    // first means it only ever appears after an actual scroll-past.
    const pdSticky = document.getElementById('pdSticky');
    if (pdSticky) {
      let hasBeenSeen = false;
      const observer = new IntersectionObserver(
        (entries) => entries.forEach(entry => {
          if (entry.isIntersecting) hasBeenSeen = true;
          pdSticky.classList.toggle('show', hasBeenSeen && !entry.isIntersecting);
        }),
        { threshold: 0 }
      );
      observer.observe(document.getElementById('addBtn'));
    }

    // Honest, real-inventory urgency: only ever fires when genuinely
    // true, re-run on every size change so it always describes the
    // variant actually selected rather than the product in general.
    // Real, live per-size stock (product.variants[].stockCount, from
    // fetchVariantStock above) when it's available; the old
    // count-of-available-sizes signal as a fallback when it isn't
    // (fetchVariantStock failed, or Shopify hasn't returned a count for
    // this variant). Never hardcoded, never shown unless a number says
    // the current selection is genuinely low, and re-run on every size
    // change so it always describes the variant actually selected.
    function renderStockNote() {
      const note = document.getElementById('pdStockNote');
      if (!hasOptions) { note.textContent = ''; note.classList.remove('show'); return; }

      const v = currentVariant();
      const haveRealStock = product.variants.some(vv => typeof vv.stockCount === 'number');

      if (v && v.available && typeof v.stockCount === 'number') {
        // Real data exists for this exact selection — it's the whole
        // answer, whether that's genuinely low or perfectly healthy.
        // Never fall through to the aggregate heuristic below once a
        // real count is known, or a healthy size could still show a
        // stale-feeling "sizes left" note driven by a *different*,
        // unrelated size being low.
        if (v.stockCount > 0 && v.stockCount <= 3) {
          note.textContent = v.stockCount === 1
            ? `Only 1 left in ${v.options.Size || 'this size'}.`
            : `Only ${v.stockCount} left in ${v.options.Size || 'this size'}.`;
          note.classList.add('show');
        } else {
          note.textContent = '';
          note.classList.remove('show');
        }
        return;
      }

      // Real per-size data never came back (fetchVariantStock failed) —
      // the only honest signal left is how many sizes remain available
      // across the whole product.
      if (haveRealStock) { note.textContent = ''; note.classList.remove('show'); return; }

      const total = product.variants.length;
      const availableCount = product.variants.filter(vv => vv.available).length;
      if (availableCount > 0 && availableCount <= 2 && availableCount < total) {
        note.textContent = availableCount === 1
          ? 'Only 1 size left in stock.'
          : `Only ${availableCount} sizes left in stock.`;
        note.classList.add('show');
      } else {
        note.textContent = '';
        note.classList.remove('show');
      }
    }
    renderStockNote();

    // ---- structured data ----
    // Product JSON-LD makes price and availability eligible for rich
    // results. No aggregateRating: there are no reviews, and marking up
    // ratings that don't exist is a manual-action offence.
    const v0 = currentVariant() || product.variants[0];
    const ld = {
      '@context': 'https://schema.org', '@type': 'Product',
      name: product.name,
      image: product.images.map(i => i.url),
      description: product.description ? product.description.join(' ') : undefined,
      brand: { '@type': 'Brand', name: 'Asior' },
      sku: v0 && v0.sku ? v0.sku : undefined,
      offers: {
        '@type': 'Offer',
        price: v0 ? v0.price : undefined,
        priceCurrency: v0 ? v0.currency : 'USD',
        availability: v0 && v0.available
          ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock',
        itemCondition: 'https://schema.org/NewCondition',
        url: location.origin + productUrl(product.handle),
      },
    };
    const ldTag = document.createElement('script');
    ldTag.type = 'application/ld+json';
    ldTag.textContent = JSON.stringify(ld);
    document.head.appendChild(ldTag);

    // ---- related + recently viewed ----
    // "You Might Also Like" used to be catalog.filter(not-this-product)
    // with no other scope — on a live storefront with every Active
    // product mixed together, that recommends whatever happens to sort
    // first in Shopify's catalog order, drop or not. Scoped to the real
    // Fall lineup (window.ASIOR_LAUNCH.FALL_PRODUCTS, the same source
    // of truth shop.html's merchandising sort and every name override
    // on this page already use) instead — the other three Fall pieces,
    // never something outside the drop.
    const fallList = (window.ASIOR_LAUNCH && window.ASIOR_LAUNCH.FALL_PRODUCTS) || [];
    const fallHandles = new Set(fallList.map(p => p.handle));
    const fallName = handle => { const f = fallList.find(p => p.handle === handle); return f ? f.name : null; };

    const tiles = list => list.map(p => {
      const media = p.featuredImage
        ? A.imgTag(p.featuredImage, { alt: p.title, sizes: '(max-width: 640px) 50vw, 220px' })
        : `<div class="ph"></div>`;
      // Same rule as everywhere else on this page: the customer-facing
      // Fall name overrides Shopify's own (sometimes internal) title.
      const name = fallName(p.handle) || p.title;
      return `<a class="rel-item" href="${productUrl(p.handle)}">${media}<div class="rel-name">${A.escapeHtml(name)}</div></a>`;
    }).join('');

    const priorViews = A.getViewed()
      .filter(h => h !== product.handle)
      .map(h => catalog.find(p => p.handle === h))
      .filter(Boolean);

    const related = catalog
      .filter(p => fallHandles.has(p.handle) && p.handle !== product.handle)
      .slice(0, 4);
    let relHTML = '';

    if (related.length) {
      const label = priorViews.length === 1
        ? `Since You Looked At ${A.escapeHtml(priorViews[0].title)}`
        : 'You Might Also Like';
      relHTML += `<section class="rel-section"><div class="rel-label">${label}</div>
        <div class="rel-grid">${tiles(related)}</div></section>`;
    }
    if (priorViews.length) {
      relHTML += `<section class="rel-section"><div class="rel-label">Recently Viewed</div>
        <div class="rel-grid">${tiles(priorViews.slice(0, 4))}</div></section>`;
    }
    relRoot.innerHTML = relHTML;

    A.recordView(product.handle);
    A.klaviyoTrack('Viewed Product', { product: product.name, handle: product.handle });
    // Onsite twin of the line above. Only this one sets the cookie
    // Klaviyo's Browse Abandonment flow keys off — the Client API
    // event above rides an anonymous_id of our own and can't trigger
    // it. Prices and names come from the live product, never invented.
    A.klaviyoViewedProduct({
      handle: product.handle,
      name: product.name,
      url: location.origin + productUrl(product.handle),
      image: (product.images && product.images[0] && product.images[0].url) || null,
      price: Math.min.apply(null, product.variants.map(function (v) { return v.price; })),
    });

    // Shopify's own funnel. Same real values, different collector —
    // see assets/shopify-analytics.js for why Shopify's pixel can't
    // reach this domain. No-ops silently if it didn't load.
    if (window.AsiorAnalytics) {
      window.AsiorAnalytics.productView({
        handle: product.handle,
        name: product.name,
        price: Math.min.apply(null, product.variants.map(function (v) { return v.price; })),
        currency: product.variants[0] && product.variants[0].currency,
      });
    }
  })();
</script>

</body>
</html>
