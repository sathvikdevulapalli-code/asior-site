<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asior</title>
<meta name="description" content="Asior makes limited-run streetwear in small batches.">
<meta name="theme-color" content="#0b0a08">
<link rel="canonical" href="https://asiorclothing.com/product.html">

<!-- Open Graph. Social crawlers never run JavaScript, so these have to be
     real tags in the served HTML or a shared link renders as a bare URL. -->
<meta property="og:site_name" content="Asior">
<meta property="og:type" content="website">
<meta property="og:title" content="Asior">
<meta property="og:description" content="Asior makes limited-run streetwear in small batches.">
<meta property="og:url" content="https://asiorclothing.com/product.html">
<meta property="og:image" content="https://asiorclothing.com/assets/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Asior — limited drops, made in small batches">
<meta name="twitter:card" content="summary_large_image">

<!-- Fonts via <link>, not @import inside a style block: an @import means the
     browser has to download and parse the CSS before it even discovers
     the font request. Weight 200 was requested site-wide and used
     nowhere, so it is not requested here. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="preload" href="assets/site.js" as="script">
<!-- Still needed for FALL_PRODUCTS (customer-facing name overrides).
     The Early Access gate is retired; see shop.html's equivalent
     comment for why. No drop-close date lives here any more — the
     collection has no end date. -->
<script src="assets/launch-config.js"></script>
<script src="assets/promo-config.js"></script>
<style>
  @media (hover: hover) and (pointer: fine) {
    header nav a:hover::after { width: 100%; }
  }

  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- product detail ----------
     Named grid areas, not source order, decide what a shopper sees
     first — because those two need to disagree. Desktop keeps the
     gallery on the left and the buy panel on the right, same result
     the old plain 2-column grid gave. On mobile (see the max-width:720px
     query below) the SAME three blocks collapse into a single column in
     head -> media -> info order instead of source order (which was
     media -> info) — so price and the Add to Cart button land inside
     the first mobile screen instead of below a full-bleed 3:4 image
     that alone is taller than most phones' viewport. */
  /* Photography scrolls; the purchase panel does not.

     Two columns, no grid-areas. The left column is every real shot the
     product has, stacked. The right column sticks, so the name, price,
     size run and Add to Cart stay on screen however far down the
     photography a shopper goes. That is the whole answer to "where do
     I buy this". */
  .pd {
    max-width: 1340px;
    margin: 0 auto;
    padding: 0 32px 12vh;
    display: grid;
    grid-template-columns: minmax(0, 1.75fr) minmax(330px, 0.85fr);
    gap: 40px;
    align-items: start;
    animation: pageFadeIn 400ms var(--ease-out);
  }

  .pd-gallery { display: grid; gap: 6px; }

  .pd-shot {
    margin: 0;
    aspect-ratio: 2 / 3;
    /* Capped against the window, not just the column. The gallery
       column is about 830px wide at 1440px, so an uncapped 2:3 frame
       computes 1248px tall and the first photograph alone is taller
       than the screen -- you cannot see the whole garment at once, and
       the rest of the set is two scroll-lengths away. The cap crops
       rather than shrinks (object-fit: cover below), so the frame
       stays full width. */
    max-height: 86vh;
    /* Width-driven, so the cap crops the frame instead of shrinking it.
       aspect-ratio with only a max-height lets the box shrink both
       dimensions to keep the ratio, which pulled the photograph in to
       550px inside an 830px column and left a third of the gallery
       empty. The image inside is object-fit: cover, so the height cap
       takes it off the bottom of the frame and nothing is letterboxed. */
    width: 100%;
    overflow: hidden;
    background: #141210;
    cursor: zoom-in;
  }

  .pd-shot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .pd-panel { position: sticky; top: 104px; }

  /* The panel can outgrow the viewport once the accordions open, so it
     scrolls inside itself rather than sticking something off-screen. */
  .pd-panel-in {
    max-height: calc(100vh - 128px);
    overflow-y: auto;
    scrollbar-width: thin;
    padding-right: 2px;
  }

  /* Quantity sits beside the button, not on a row above it. It used to
     add a whole step between choosing a size and buying. */
  .pd-qtyrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .pd-qty-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-trustlines {
    list-style: none;
    margin: 18px 0 0;
    padding: 16px 0 0;
    border-top: 1px solid var(--line);
    display: grid;
    gap: 7px;
  }

  .pd-trustlines li {
    font-family: var(--font-body);
    font-size: 12px;
    line-height: 1.55;
    color: var(--muted);
  }

  /* Detail lives here, below the buying controls, closed by default.
     Nothing was deleted -- description, measurements, shipping and
     returns are all still on the page, just no longer in front of the
     button. */
  .pd-acc { margin-top: 22px; border-top: 1px solid var(--line); }

  .pd-row { border-bottom: 1px solid var(--line); }

  .pd-row > summary {
    list-style: none;
    cursor: pointer;
    padding: 15px 0;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .pd-row > summary::-webkit-details-marker { display: none; }
  .pd-row > summary::after { content: '+'; color: var(--muted); font-size: 14px; }
  .pd-row[open] > summary::after { content: '\2013'; }

  .pd-row-body {
    padding: 0 0 16px;
    font-family: var(--font-body);
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--muted);
  }

  .pd-row-body p + p { margin-top: 9px; }

  /* Everything that is not part of buying. */
  .pd-below {
    max-width: 1340px;
    margin: 0 auto;
    padding: 0 32px 14vh;
  }

  .pd-gallery .ph {
    aspect-ratio: 2 / 3;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%);
  }

  .pd-gallery .ph span {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Preorder is a materially different purchase (you're charged now,
     it ships later), so it gets a solid fill rather than the muted
     outline everything else uses. It should be the first thing read. */
  .pd-preorder-badge {
    display: inline-block;
    margin-bottom: 12px;
    padding: 5px 10px;
    border-radius: 0;
    background: var(--ink);
    color: var(--bg);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Restated next to the buy button, where the decision actually happens.
     The FTC Mail Order Rule expects a stated shipping expectation on
     advance-purchase items, so this line is compliance as well as UX. */

  /* A garment name is a label, not a headline. Down from 2.2rem/700
     with the tracking pulled in, so it reads as a caption on the
     photograph rather than as a page title above a product. */
  /* The garment's name is the first thing the panel has to answer, so
     it is set like a name and not like a field label: Archivo pushed
     out on its width axis, heavy, tight, and large enough that it is
     read before the price under it. */
  .pd-name {
    font-family: var(--font-display);
    font-variation-settings: var(--display-wide);
    font-size: clamp(1.6rem, 2.6vw, 2.3rem);
    font-weight: 800;
    line-height: 0.96;
    letter-spacing: -0.025em;
    text-transform: uppercase;
  }

  /* The count sits at the same weight as the average on purpose --
     see ratingHTML(). Nothing here is a star row: five glyphs make one
     review look like a verdict. */
  /* The fit sentence sits directly above the size picker, where the
     decision it informs is made. Brief v12 section 7. */
  .pd-fit {
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-dim);
    margin-top: 14px;
  }

  .pd-care {
    font-family: var(--font-body);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
    margin-top: 10px;
  }

  .pd-set-note {
    font-family: var(--font-body);
    font-size: 12px;
    line-height: 1.55;
    color: var(--muted);
    margin-top: 10px;
  }

  .pd-set-note a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }

  .pd-rating {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
  }

  .pd-rating-value { color: var(--ink); }
  .pd-rating-count { color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; font-size: 10px; }

  /* Bumped from 14px/var(--muted) — the price is a lead element in the
     buy panel now, so it needs to read at a glance rather than at the
     same weight as secondary metadata. */
  .pd-price {
    font-family: var(--font-mono);
    margin-top: 9px;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
  }

  .pd-price .compare {
    text-decoration: line-through;
    opacity: 0.6;
    margin-right: 10px;
  }

  .pd-price .save {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: lowercase;
    color: var(--muted);
  }

  .pd-sizes { margin-top: 22px; }

  .pd-size-group { margin-bottom: 18px; }

  .pd-size-label {
    font-family: var(--font-mono);
    margin-bottom: 12px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-size-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* Small squares with a hairline, the way a size run is printed on a
     tag. 40px still clears the tap target minimum. */
  .pd-size {
    position: relative;
    min-width: 40px;
    height: 40px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--field-line);
    border-radius: 0;
    background: none;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 160ms var(--ease-out), color 160ms var(--ease-out), background 160ms var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .pd-size:hover { border-color: var(--ink); }
  }

  .pd-size:not(.unavailable):active { transform: scale(0.96); }

  .pd-size.selected {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--bg);
  }

  .pd-size.unavailable {
    color: var(--muted);
    cursor: not-allowed;
  }

  @media (hover: hover) and (pointer: fine) {
    .pd-size.unavailable:hover { border-color: var(--field-line); }
  }

  .pd-size.unavailable::after {
    content: '';
    position: absolute;
    left: -6px;
    right: -6px;
    top: 50%;
    height: 1px;
    background: var(--muted);
    transform: rotate(-16deg);
  }

  .pd-qty {
    margin-top: 34px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .pd-qty button {
    width: 30px;
    height: 30px;
    border: 1px solid var(--field-line);
    background: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    cursor: pointer;
    transition: border-color 200ms var(--ease-out), transform 140ms var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .pd-qty button:hover { border-color: var(--ink); }
  }

  .pd-qty button:active { transform: scale(0.92); }

  .pd-qty span { font-size: 13px; min-width: 16px; text-align: center; }

  .pd-actions { margin-top: 28px; }

  /* Filled, not outlined — this is the primary purchase action on the
     page and it was reading as secondary chrome next to it. Matches
     the filled-button convention already used for the equivalent
     primary action on lanyard.html; this page and
     cart.html's Checkout were the two places still using an outline
     for what should be the loudest thing on screen. */
  /* Buy Now sits under Add to Cart as the quieter of the two: same
     size and hit area, outline instead of fill, so the default action
     reads as the one that keeps you on the page. */
  .pd-buynow {
    display: block;
    width: 100%;
    margin-top: 8px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--field-line);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 16px 20px;
    min-height: 48px;
    cursor: pointer;
    transition: border-color 160ms var(--ease-out), color 160ms var(--ease-out);
  }

  .pd-buynow:hover:not([disabled]) { border-color: var(--ink); }
  .pd-buynow[disabled] { opacity: 0.4; cursor: default; }

  /* The accent, not off-white. This was --ink on --bg: the same two
     values as the body text, the footer links and the teaser bar, so
     the one control that buys the garment was styled identically to
     everything that does not. Colour is what makes it findable. */
  .pd-add {
    position: relative;
    display: block;
    width: 100%;
    background: var(--accent);
    color: var(--on-accent);
    border: 0;
    border-radius: 0;
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 19px 20px;
    min-height: 54px;
    cursor: pointer;
    transition: opacity 160ms var(--ease-out);
  }

  /* Disabled still reads as the buy button, just not yet usable. It
     must not look like a different, dead control. */
  .pd-add[disabled] {
    opacity: 1;
    background: #58524733;
    color: #8b8475;
    box-shadow: inset 0 0 0 1px #585247;
    cursor: default;
  }

  @media (hover: hover) and (pointer: fine) {
    .pd-add:hover { opacity: 0.85; }
  }

  .pd-add:not([disabled]):active { transform: scale(0.97); }


  /* Mobile sticky buy bar. A long PDP (gallery, then price, then
     variants, then description) scrolls the real Add-to-Cart button
     out of the thumb zone right when a shopper who scrolled down to
     read more decides to buy — the moment of intent shouldn't cost a
     scroll back to the top. Carries its own compact size chips, not
     just a CTA that jumps back up: a shopper who hasn't picked a size
     yet needs to be able to finish the purchase from here, not be
     bounced back to the top of the page to do it. Desktop keeps the
     real buy box in easy reach already, so this never shows there. */
  /* Two rows, not one.

     This was a single flex row -- name/price, size chips and the
     button, with flex-shrink:0 on both the chips and the button. At
     390px the three together measured wider than the viewport and the
     button was pushed clean off the right edge (measured left 154,
     right 512 on a 390px screen), so the sticky bar's whole reason for
     existing was unreachable. The button now owns its own full-width
     row, which is also what the primary action is supposed to look
     like everywhere else on this page. */
  .pd-sticky {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    border-top: 1px solid var(--line);
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.35);
    transform: translateY(100%);
    transition: transform 220ms var(--ease-out);
  }

  .pd-sticky.show { transform: translateY(0); }

  @media (max-width: 900px) {
    .pd-sticky { display: flex; }
  }

  /* Row one: what it is and what it costs, beside the size chips. */
  .pd-sticky-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
  }

  .pd-sticky-info { min-width: 0; flex-shrink: 1; }

  .pd-sticky-name {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pd-sticky-price { font-size: 14px; font-weight: 600; }

  .pd-sticky-sizes {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    overflow-x: auto;
  }

  .pd-sticky-sizes .pd-size {
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    font-size: 12px;
    flex-shrink: 0;
  }

  .pd-sticky .pd-add {
    width: 100%;
    min-height: 48px;
    padding: 11px 20px;
    font-size: 11px;
  }

  .pd-desc {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
  }

  .pd-desc-label {
    font-family: var(--font-mono);
    margin-bottom: 14px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-desc p, .pd-desc ul {
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink);
  }

  .pd-desc p + p { margin-top: 12px; }
  .pd-desc ul { list-style: none; }
  .pd-desc li { position: relative; padding-left: 16px; }
  .pd-desc li + li { margin-top: 8px; }
  .pd-desc li::before { content: '-'; position: absolute; left: 0; color: var(--muted); }

  .pd-ship {
    margin-top: 24px;
  }

  .pd-ship summary {
    cursor: pointer;
    list-style: none;
    position: relative;
    padding: 12px 20px 12px 0;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    border-top: 1px solid var(--line);
    transition: color 0.3s ease;
  }

  .pd-ship summary::-webkit-details-marker { display: none; }
  .pd-ship summary:hover { color: var(--ink); }

  .pd-ship summary::after {
    content: '+';
    position: absolute;
    right: 2px;
    top: 10px;
    font-family: var(--font-body);
    font-size: 15px;
  }

  .pd-ship[open] summary::after { content: '\2212'; }

  .pd-ship-body {
    padding: 4px 0 16px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink);
  }

  .pd-ship-body p + p { margin-top: 10px; }

  /* The real US rate card, rendered from assets/promo-config.js. Each
     transit time stays attached to the rate it belongs to -- quoting
     the 3-4 day Standard speed next to the $4.90 Economy price would
     advertise a combination nobody can actually buy. */
  .ship-rates {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0 8px;
    font-family: var(--font-mono);
    font-size: 11.5px;
  }

  .ship-rates th,
  .ship-rates td {
    text-align: left;
    padding: 7px 10px 7px 0;
    border-bottom: 1px solid var(--line);
    font-weight: 400;
    color: var(--ink-dim);
  }

  .ship-rates thead th {
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .ship-rates tbody th { color: var(--ink); }
  .ship-rates td.tnum { font-variant-numeric: tabular-nums; }
  .ship-note { font-size: 11.5px; color: var(--muted); }

  .pd-size-chart-note {
    font-size: 11px;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .pd-stock-note {
    display: none;
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .pd-stock-note.show { display: block; }

  .pd-confirm {
    display: none;
    margin-top: 16px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-confirm.show { display: block; }
  .pd-confirm a { text-decoration: underline; color: var(--ink); }

  .pd-note {
    margin-top: 34px;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--muted);
    line-height: 1.7;
  }

  .pd-note + .pd-note { margin-top: 8px; }

  /* Restated where the decision actually happens (right under the
     price, at the top of the buy panel), not just in the sitewide
     banner — same instant, read from the same source, so the two can
     never disagree. */
  /* Sign-up value prop. Carries the real welcome discount (the
     one Shopify code) and no other number, and no price on this
     page is ever struck through for it. It used to sit under a
     countdown to a close date; the collection has no end date now, so
     the offer stands on its own. */
  .pd-signup-prop {
    margin: 6px 0 0;
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.03em;
    color: var(--muted);
  }

  .pd-signup-prop a { color: var(--ink); }

  /* Second shipping line. Same voice as .pd-note, just tighter to it
     so the pair reads as one shipping statement rather than two
     competing claims. */
  .pd-note-intl { margin-top: 4px; }

  /* ---------- trust block ----------
     Renders nothing until assets/reviews.js has a real entry for this
     handle — see that file. Grid shape matches .rel-grid on purpose:
     one visual language for "a row of product tiles" on this page,
     whether it's related items or customer photos. */
  .pd-trust {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
  }

  .pd-trust-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .pd-trust-item {
    margin: 0;
  }

  .pd-trust-item img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 0;
  }

  .pd-trust-item figcaption {
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink);
  }

  .pd-trust-size {
    color: var(--muted);
  }

  @media (max-width: 480px) {
    .pd-trust-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---------- related / recently viewed ---------- */
  .rel-section {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 40px 10vh;
  }

  .rel-label {
    font-family: var(--font-mono);
    margin-bottom: 20px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rel-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .rel-item {
    display: block;
    aspect-ratio: 3 / 4;
    position: relative;
    overflow: hidden;
    border-radius: 0;
  }

  .rel-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .rel-item .ph {
    width: 100%;
    height: 100%;
    background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%);
  }

  .rel-item:hover img { transform: scale(1.04); }

  .rel-item .rel-name {
    position: absolute;
    left: 10px;
    bottom: 8px;
    right: 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.45);
  }

  @media (max-width: 640px) {
    .rel-grid { grid-template-columns: repeat(2, 1fr); }
    .rel-section { padding: 0 20px 8vh; }
  }

  .not-found {
    min-height: 40vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
  }

  .not-found a { text-decoration: underline; }

  /* Same gap shop.html had: #pd-root starts empty and nothing showed
     while fetchProduct/fetchCatalogLite were in flight. This is the
     single most purchase-critical page on the site, so a stalled
     connection here is worse than anywhere else to leave silent. */
  .pd-loading {
    min-height: 40vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .pd-loading.hide { display: none; }

  /* Wrapper for the build-time product summary that generated pages
     ship inside #pd-root (scripts/build.js, prerenderedPdp). Not the
     .pd grid: that grid expects head/media/info areas and this block
     has no media. Everything inside reuses the real classes, so it
     reads as the product rather than as a placeholder. */
  .pd-prerender {
    max-width: 560px;
    margin: 0 auto;
    /* Side gutter matters here: this block is the whole page for a
       client with no JS, and without it the title and the photo run
       into both edges of a phone screen. */
    padding: 48px 20px;
  }

  /* The build-time product photo. Same 3:4 frame and top-anchored crop
     as the real gallery, so the swap at hydration is not a visible
     change of shape. */
  .pd-prerender-media {
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 0;
    margin: 22px 0 26px;
  }

  .pd-prerender-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  @media (max-width: 900px) {
    /* One column, source order: gallery, then the panel. Nothing is
       repositioned by grid-areas any more -- the markup is already in
       the order a phone wants, which is image, then name and price,
       then size, then the button.

       The first shot is capped so the photograph leads without burying
       the price, and the rest of the gallery moves below the panel so
       the buying controls are not stranded behind four full-height
       images. */
    .pd {
      grid-template-columns: 1fr;
      gap: 14px;
      padding: 0 16px 10vh;
    }

    .pd-gallery {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      margin: 0 -16px;
      padding: 0 16px;
    }

    .pd-gallery::-webkit-scrollbar { display: none; }

    /* A swipeable row rather than a vertical stack: four 2:3 frames
       stacked on a phone is four screens of scrolling before the
       price. */
    .pd-shot {
      flex: 0 0 86%;
      scroll-snap-align: start;
      aspect-ratio: 3 / 4;
    }

    .pd-panel { position: static; }
    .pd-panel-in { max-height: none; overflow: visible; }
  }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    /* The phone nav is a full-screen panel now, defined once in
       assets/site.css. The horizontally scrolling link strip this
       page used to redeclare for itself is gone -- it was also
       overriding the shared rule, which is why the panel opened at
       the width of the old strip. */
    .pd { padding: 0 20px 10vh; }
  }

  /* ---------- facts row ----------
     Fabric and fit, stated plainly under the price. Only renders for
     fields that are actually filled in on assets/product-details.js. */
  .pd-facts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  .pd-fact {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 5px 9px;
  }

  /* ---------- model reference ----------
     Sits directly under the size row, because that is the moment the
     question ("will this fit me?") actually gets asked. Photography
     alone cannot answer it; height + size worn can. */
  .pd-model {
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ---------- image zoom ----------
     Every frame in the gallery opens the lightbox (wireGallery), so the
     cursor is the affordance. The old "Click to zoom" chip hung off
     a hover state on an element that no longer exists. */
  .pd-shot { cursor: zoom-in; }

  .pd-lightbox {
    border: none;
    padding: 0;
    background: transparent;
    max-width: 100vw;
    max-height: 100vh;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .pd-lightbox::backdrop { background: rgba(11, 10, 8, 0.94); }

  .pd-lightbox-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    /* lets mobile pinch-zoom the high-res source natively */
    overflow: auto;
    touch-action: pinch-zoom;
  }

  .pd-lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 0;
  }

  /* Nothing in the real world appears from nothing: scale from 0.96,
     not 0, and exit faster than it enters. */
  .pd-lightbox[open] .pd-lightbox-inner {
    animation: pdZoomIn 200ms var(--ease-out);
  }

  @keyframes pdZoomIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  .pd-lightbox-close {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 38px;
    height: 38px;
    border: 1px solid var(--field-line);
    border-radius: 0;
    background: rgba(11, 10, 8, 0.7);
    color: var(--ink);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    transition: border-color 200ms var(--ease-out), transform 160ms var(--ease-out);
  }

  .pd-lightbox-close:hover { border-color: var(--ink); }
  .pd-lightbox-close:active { transform: scale(0.94); }

  /* ---------- size guide ---------- */
  .pd-measure-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 4px;
  }

  .pd-measure-table caption {
    text-align: left;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 8px;
  }

  .pd-measure-table th,
  .pd-measure-table td {
    text-align: left;
    padding: 7px 10px 7px 0;
    border-bottom: 1px solid var(--line);
  }

  .pd-measure-table th {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 400;
    color: var(--muted);
  }

  .pd-measure-table td { color: var(--ink); font-weight: 300; }
  .pd-measure-table tbody tr:last-child th,
  .pd-measure-table tbody tr:last-child td { border-bottom: none; }

  .pd-measure-how { margin-top: 20px; }

  .pd-measure-how li {
    margin: 0 0 7px 16px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
  }

  .pd-measure-how li strong { color: var(--ink); font-weight: 500; }

  /* Shown when nobody has measured this garment yet. Deliberately says
     so rather than rendering a grid of "--", which reads as broken and
     tells the shopper nothing. */
  .pd-measure-empty {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }

  .pd-measure-empty a { text-decoration: underline; }

  /* ---------- back in stock ----------
     Tapping a sold-out size used to do nothing at all. Now it turns a
     dead end into a signup. */
  .pd-bis {
    margin-top: 16px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 0;
    display: none;
  }

  .pd-bis.show { display: block; }

  .pd-bis-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .pd-bis-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .pd-bis-row input { flex: 1; min-width: 150px; }

  .pd-bis-row button {
    border: 1px solid var(--field-line);
    background: none;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0 16px;
    cursor: pointer;
    border-radius: 0;
    transition: border-color 200ms var(--ease-out), background 200ms var(--ease-out),
                color 200ms var(--ease-out), transform 160ms var(--ease-out);
  }

  .pd-bis-row button:hover { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .pd-bis-row button:active { transform: scale(0.97); }
  .pd-bis-row button:disabled { opacity: 0.5; cursor: default; transform: none; }

  .pd-bis-msg {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  @media (max-width: 640px) {
    .pd-lightbox-inner { padding: 12px; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
