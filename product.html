<script src="assets/site.js"></script>
<script src="assets/product-details.js"></script>
<script src="assets/reviews.js"></script>
<script>
  // ---------------------------------------------------------------
  // Product page. Shared plumbing (Storefront fetch, cart, Klaviyo,
  // browsing history) lives in assets/site.js; only page behaviour is
  // here. Real garment measurements and model info come from
  // assets/product-details.js — nothing on this page is invented.
  // ---------------------------------------------------------------
  const A = window.Asior;

  // Sitewide banner (the old email-signup teaser bar, replaced — see
  // scripts/build.js's comment on HEADER_FULL). Independent of the
  // product fetch below, so it doesn't wait on Shopify.

  // Generated pages (/products/<handle>.html) set this. The ?id= form
  // still works so older shared links don't break.
  const HANDLE = window.__PRODUCT_HANDLE
    || new URLSearchParams(location.search).get('id');

  const root = document.getElementById('pd-root');
  const relRoot = document.getElementById('rel-root');

  // Product links are always root-absolute: this same markup renders
  // both at /product.html and at /products/<handle>.html, and a relative
  // href would resolve differently in each.
  const productUrl = h => '/products/' + h + '.html';

  // ---------------------------------------------------------------
  // Two queries, not one.
  //
  // This page used to pull the entire catalog — every description, all
  // twelve images and twenty variants for every product — just to show
  // one item. That was ~4.5x more data than needed and it got worse with
  // every product added. Now: everything for the product being viewed,
  // and only handle/title/one image for the related rail.
  // ---------------------------------------------------------------
  /* The ratings are asked for separately from everything else, on
     purpose.

     shopifyFetch throws on any GraphQL error, so one unrecognised field
     takes the whole response down -- and a Storefront API that will not
     serve reviews.rating (the definition has to be exposed to the
     storefront, which cannot be confirmed from the build sandbox) would
     therefore have broken every product page rather than just hiding a
     rating. On the pages ads land on.

     So: the product query never mentions metafields, and the rating is
     a second, optional request whose failure is swallowed. Worst case
     the rating is absent, which is the same as it was before it
     existed. Best case it renders. Neither case can stop a visitor
     buying. */
  /* Every metafield the page would like but can live without, in one
     optional request.

     custom.fit_notes is filled for the Polo and both shorts;
     custom.size_chart, custom.model_info and custom.fabric_care are
     defined but empty everywhere as of 2026-10-06. Each renders only
     when it has a value, so an empty field produces no empty box.

     Deliberately NOT part of the product query: see fetchProduct. A
     metafield the Storefront API will not serve returns a GraphQL
     error, and shopifyFetch throws on errors, so asking for these
     alongside the product would let a permissions problem take down
     every product page. Here it just means no fit line. */
  async function fetchExtras(handle) {
    try {
      const d = await A.shopifyFetch(`
        query($handle: String!) {
          product(handle: $handle) {
            rating: metafield(namespace: "reviews", key: "rating") { value }
            ratingCount: metafield(namespace: "reviews", key: "rating_count") { value }
            fitNotes: metafield(namespace: "custom", key: "fit_notes") { value }
            sizeChart: metafield(namespace: "custom", key: "size_chart") { value }
            modelInfo: metafield(namespace: "custom", key: "model_info") { value }
            fabricCare: metafield(namespace: "custom", key: "fabric_care") { value }
          }
        }`, { handle });
      return d.product || null;
    } catch (err) {
      // Expected on a store that has not exposed the definitions.
      // Logged once, never surfaced, never retried.
      console.info('[asior] product metafields unavailable:', err && err.message);
      return null;
    }
  }

  /* A metafield's text, or null. Never an empty string, so callers can
     test truthiness and render nothing for a field that exists but has
     not been filled in. */
  function metaText(node, key) {
    const v = node && node[key] && node[key].value;
    const t = typeof v === 'string' ? v.trim() : '';
    return t || null;
  }

  /* The size chart, only when it really parses.

     Shape: {"unit":"in","columns":["Chest","Length"],"rows":{"S":[20,27]}}
     Anything malformed returns null rather than a half-drawn table --
     a measurement table is the one thing on this page a shopper will
     act on, so a broken one is worse than none. */
  function parseSizeChart(raw) {
    try {
      if (!raw) return null;
      const d = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if (!d || !Array.isArray(d.columns) || !d.columns.length) return null;
      if (!d.rows || typeof d.rows !== 'object') return null;
      const sizes = Object.keys(d.rows);
      if (!sizes.length) return null;
      const ok = sizes.every(sz => Array.isArray(d.rows[sz]) && d.rows[sz].length === d.columns.length);
      if (!ok) return null;
      return { unit: d.unit === 'cm' ? 'cm' : 'in', columns: d.columns, rows: d.rows, sizes };
    } catch (err) { return null; }
  }

  async function fetchProduct(handle) {
    const data = await A.shopifyFetch(`
      query($handle: String!) {
        product(handle: $handle) {
          id title handle descriptionHtml
          images(first: 12) { edges { node { ${A.IMAGE_FIELDS} } } }
          options { name values }
          variants(first: 40) {
            edges { node {
              id sku availableForSale
              price { amount currencyCode }
              compareAtPrice { amount }
              selectedOptions { name value }
            } }
          }
        }
      }`, { handle });
    return data.product;
  }

  async function fetchCatalogLite() {
    const data = await A.shopifyFetch(`{
      products(first: 50) {
        edges { node { handle title featuredImage { ${A.IMAGE_FIELDS} } } }
      }
    }`);
    return data.products.edges.map(e => e.node);
  }

  // Real per-size stock, for the "only N left" note. Deliberately its
  // own query, not a field added to fetchProduct above: an earlier pass
  // added quantityAvailable to a product-catalog query (assets/fall-grid.js)
  // and it broke live images and pricing across browsers in production —
  // see that file's history. Whatever the exact cause, isolating this
  // field means a permission error or bad response here can only ever
  // cost the stock note, never the price, images, or ability to buy.
  // Resolves to null (not a thrown error) on any failure, so the caller
  // never needs a try/catch of its own.
  async function fetchVariantStock(handle) {
    try {
      const data = await A.shopifyFetch(`
        query($handle: String!) {
          product(handle: $handle) {
            variants(first: 40) { edges { node { id quantityAvailable } } }
          }
        }`, { handle });
      if (!data.product) return null;
      return new Map(data.product.variants.edges.map(e => [e.node.id, e.node.quantityAvailable]));
    } catch (err) {
      return null;
    }
  }

  // A placeholder line left in Shopify's own product description field
  // (draft/internal notes like "specs pending") is invisible to this
  // codebase — it lives in Shopify admin, not here — but it still
  // shouldn't reach a customer. Strip any paragraph that reads like an
  // internal placeholder rather than real copy, whatever page it's on.
  const PLACEHOLDER_LINE = /\b(spec[s]?\s*pending|pending\s*spec[s]?|tbd|tba|coming soon|placeholder|lorem ipsum|to be (determined|announced|confirmed|added))\b/i;

  function descriptionFromHtml(html) {
    if (!html) return null;
    const paragraphs = html
      .split(/<\/p>|<br\s*\/?>/i)
      .map(p => p.replace(/<[^>]+>/g, '').trim())
      .filter(Boolean)
      .filter(p => !PLACEHOLDER_LINE.test(p));
    return paragraphs.length ? paragraphs : null;
  }

  function normalizeProduct(node, stockByVariant) {
    const optionNames = node.options.map(o => o.name).filter(n => n !== 'Title');
    const variants = node.variants.edges.map(e => {
      const v = e.node;
      const options = {};
      v.selectedOptions.forEach(so => { if (so.name !== 'Title') options[so.name] = so.value; });
      return {
        options,
        variantId: v.id,
        sku: v.sku,
        price: parseFloat(v.price.amount),
        currency: v.price.currencyCode,
        comparePrice: v.compareAtPrice ? parseFloat(v.compareAtPrice.amount) : null,
        // null means "unknown" (fetchVariantStock failed, or this
        // variant wasn't in its response) — never treat null as zero.
        // 0 is itself a real, meaningful value (genuinely sold out) and
        // is left as 0, not coerced to null.
        stockCount: stockByVariant && stockByVariant.has(v.id) ? stockByVariant.get(v.id) : null,
        // Sold out when Shopify says so OR when we can see the real
        // count is gone.
        //
        // availableForSale on its own is not enough: a variant set to
        // keep selling when out of stock stays available:true while its
        // quantity runs negative. The JAG Lanyard is sitting at -5 right
        // now — five units sold that don't exist — and on
        // availableForSale alone this page would happily sell a sixth.
        // Any real count at or below zero wins over that flag.
        //
        // Unknown (null) still defers to Shopify, because refusing to
        // sell on missing data would be the more expensive mistake.
        available: v.availableForSale
          && !(typeof (stockByVariant && stockByVariant.get(v.id)) === 'number'
               && stockByVariant.get(v.id) <= 0),
      };
    });
    // FALL_PRODUCTS (assets/launch-config.js) carries the customer-
    // facing name for any Fall piece — Shopify's own title can be an
    // internal/manufacturing name a customer should never see. Falls
    // through to Shopify's title for every product not in that list.
    const fallOverride = (window.ASIOR_LAUNCH && window.ASIOR_LAUNCH.FALL_PRODUCTS || [])
      .find(p => p.handle === node.handle);
    return {
      handle: node.handle,
      name: fallOverride ? fallOverride.name : node.title.replace(/\s*\[preorder\]\s*/i, '').trim(),
      images: node.images.edges.map(e => e.node),
      description: descriptionFromHtml(node.descriptionHtml),
      optionNames,
      variants,
      isPreorder: /\[preorder\]/i.test(node.title),
      // Filled in afterwards from fetchRating(), which is a separate
      // optional request -- see the comment there.
      rating: null,
    };
  }

  /* Parsed defensively: the metafield is a JSON string, it is absent on
     most products (only three carry one), and a product with no reviews
     must render nothing rather than "0 / 5". */
  function parseRating(node) {
    try {
      if (!node || !node.rating || !node.ratingCount) return null;
      const r = JSON.parse(node.rating.value);
      const value = parseFloat(r.value);
      const count = parseInt(node.ratingCount.value, 10);
      const max = parseFloat(r.scale_max) || 5;
      if (!isFinite(value) || !isFinite(count) || count < 1) return null;
      return { value, count, max };
    } catch (err) { return null; }
  }

  // ---------------------------------------------------------------
  // Size guide, built from assets/product-details.js.
  //
  // Never renders a table of "--": an empty grid reads as broken. When
  // there's no real measurement data, the guide falls back to the
  // general comparison method (howToMeasure) with no apologetic framing
  // and no invented numbers — see sizeGuideHTML below.
  // ---------------------------------------------------------------
  const details = (window.ASIOR_PRODUCT_DETAILS || {})[HANDLE] || null;
  const MCOLS = window.ASIOR_MEASUREMENT_COLUMNS || {};

  const toCm = inches => Math.round(inches * 2.54 * 10) / 10;

  function measurementTable(caption, colKey, rows) {
    const cols = MCOLS[colKey];
    if (!cols || !rows) return '';
    const sizes = Object.keys(rows);
    const hasAny = sizes.some(sz => cols.some(c => rows[sz] && rows[sz][c.key] != null));
    if (!hasAny) return '';
    return `
      <table class="pd-measure-table">
        ${caption ? `<caption>${A.escapeHtml(caption)}</caption>` : ''}
        <thead>
          <tr>
            <th scope="col">Size</th>
            ${cols.map(c => `<th scope="col">${c.label} (in / cm)</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${sizes.map(sz => `
            <tr>
              <th scope="row">${A.escapeHtml(sz)}</th>
              ${cols.map(c => {
                const v = rows[sz] ? rows[sz][c.key] : null;
                return `<td>${v == null ? '—' : v + ' / ' + toCm(v)}</td>`;
              }).join('')}
            </tr>`).join('')}
        </tbody>
      </table>`;
  }

  function howToMeasure(kind) {
    const top = `
      <li><strong>Chest</strong> — measure armpit to armpit across the front, then double it.</li>
      <li><strong>Length</strong> — from the highest point of the shoulder straight down to the hem.</li>
      <li><strong>Sleeve</strong> — from the centre back of the neck out to the cuff.</li>`;
    // Sweats: no rise line — an elastic waistband isn't measured that way.
    const bottom = `
      <li><strong>Waist</strong> — across the flat waistband, then double it.</li>
      <li><strong>Inseam</strong> — crotch seam down to the leg opening.</li>
      <li><strong>Outseam</strong> — top of the waistband straight down the outside of the leg.</li>`;
    const shorts = `
      <li><strong>Waist</strong> — across the flat waistband, then double it.</li>
      <li><strong>Rise</strong> — crotch seam up to the top of the waistband.</li>
      <li><strong>Inseam</strong> — crotch seam down to the leg opening.</li>
      <li><strong>Outseam</strong> — top of the waistband straight down the outside of the leg.</li>`;
    const which = kind === 'bottom' ? bottom
      : kind === 'shorts' ? shorts
      : kind === 'set' ? top + bottom
      : top; // top and polo share the same three measurements
    return `
      <div class="pd-measure-how">
        <p class="pd-size-chart-note">Garment measured flat, not body measurements. Compare against a piece you already own and like the fit of.</p>
        <ul>${which}</ul>
      </div>`;
  }

  /* The JAG Set's one real sizing constraint, said out loud.

     Checked against Shopify: the set is a single product with one Size
     option (XS/S/M/L) and one $80 price per variant. There is no
     separate top and bottom inventory behind it, so a customer who
     takes a different size on top than on the bottom genuinely cannot
     buy the set -- and the page used to let them find that out by
     failing to find the combination they wanted.

     Separate top/bottom selection is not implemented, because it would
     be a lie about what checkout can fulfil. Restructuring the bundle
     is a Shopify Admin change and not this repo's to make. What the
     page can do is say so, and point at the thing that does work: the
     crewneck and the sweats are both sold separately, at $45 each. */
  function setSizingNote(product) {
    const d = (window.ASIOR_PRODUCT_DETAILS || {})[product.handle];
    if (!d || d.garment !== 'set') return '';
    return `
      <p class="pd-set-note">
        One size covers both pieces. If you take a different size on top,
        buy the <a href="/products/jaguar-crewneck.html">crewneck</a> and
        <a href="/products/jaguar-sweats.html">sweats</a> separately.
      </p>`;
  }

  /* Real customer rating, or nothing.

     The store runs Judge.me and Shopify carries its numbers in the
     standard reviews.rating / reviews.rating_count metafields, but this
     storefront never showed them -- so genuine proof the brand had
     already earned was invisible while the page asked people to trust
     it.

     Two rules, both about not overstating thin evidence. The count is
     always rendered beside the average, never suppressed, because
     "5 / 5" from a single review implies a body of evidence that does
     not exist. And every rating is shown, including the low one: a
     storefront that displays its 5.0 and hides its 1.0 is not showing
     customer proof, it is advertising. If a rating should not be
     public, that belongs in Judge.me, not in a display filter here. */
  function ratingHTML(product) {
    const r = product.rating;
    if (!r) return '';
    const rounded = Math.round(r.value * 10) / 10;
    return `
      <p class="pd-rating">
        <span class="pd-rating-value tnum">${rounded} / ${r.max}</span>
        <span class="pd-rating-count">${r.count} ${r.count === 1 ? 'review' : 'reviews'}</span>
      </p>`;
  }

  /* Shopify's custom.size_chart, rendered in both units.

     The stored unit is authoritative and the other is computed, so one
     of the two columns is always derived rather than separately
     entered -- there is no way for the inches and the centimetres to
     disagree. One decimal, because a garment measured to a tenth of a
     centimetre is precision nobody has. */
  function shopifySizeChart(chart) {
    const other = chart.unit === 'in' ? 'cm' : 'in';
    const conv = v => chart.unit === 'in'
      ? Math.round(v * 2.54 * 10) / 10
      : Math.round((v / 2.54) * 10) / 10;
    return `
      <table class="pd-measure-table">
        <thead>
          <tr>
            <th scope="col">Size</th>
            ${chart.columns.map(c => `<th scope="col">${A.escapeHtml(c)} (${chart.unit} / ${other})</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${chart.sizes.map(sz => `
            <tr>
              <th scope="row">${A.escapeHtml(sz)}</th>
              ${chart.rows[sz].map(v => {
                const n = Number(v);
                return `<td>${isFinite(n) ? n + ' / ' + conv(n) : '\u2014'}</td>`;
              }).join('')}
            </tr>`).join('')}
        </tbody>
      </table>`;
  }

  function sizeGuideHTML(product) {
    if (!product.optionNames.includes('Size')) return '';
    const kind = details && details.garment ? details.garment : 'top';

    /* Shopify's custom.size_chart wins over the local file: it is the
       one the founder can edit without a deploy, and the local
       measurements in assets/product-details.js are still empty for
       every handle. */
    let tables = '';
    if (product.sizeChart) {
      tables = shopifySizeChart(product.sizeChart);
    } else if (details && details.measurements) {
      if (kind === 'set') {
        tables = measurementTable('Crewneck', 'top', details.measurements.top)
               + measurementTable('Sweats', 'bottom', details.measurements.bottom);
      } else {
        tables = measurementTable('', kind, details.measurements);
      }
    }

    const model = details && details.model && details.model.height && details.model.wearing
      ? `<p class="pd-model">Model is ${A.escapeHtml(details.model.height)}, wearing size ${A.escapeHtml(details.model.wearing)}.</p>`
      : '';

    // No apologetic "not measured yet" framing when there's no table —
    // just the real, always-true comparison method (howToMeasure), which
    // stands on its own as useful guidance. Never invented numbers to
    // fill the gap instead.
    const careBlock = product.fabricCare
      ? `<p class="pd-care">${A.escapeHtml(product.fabricCare)}</p>` : '';

    /* No table and nothing else real to say means no accordion at all.

       This used to fall back to a generic "How to Measure" method with
       no garment numbers behind it. Brief v12 section 7: drop it unless
       a real chart exists. A panel that teaches a shopper to measure
       themselves and then gives them nothing to compare against spends
       their attention and returns nothing -- and it is the specific
       thing the audit called out on the Polo. The method is still shown
       alongside a chart, where it is useful. */
    if (!tables && !model && !careBlock) return '';

    const body = tables
      ? tables + model + careBlock + howToMeasure(kind)
      : model + careBlock;

    return `
      <details class="pd-row pd-ship pd-size-chart">
        <summary>${tables ? 'Size Guide' : 'Fit &amp; Care'}</summary>
        <div class="pd-ship-body">${body}</div>
      </details>`;
  }

  // ---------------------------------------------------------------
  (async function () {
    let product, catalog, stockByVariant;
    try {
      // fetchVariantStock and fetchRating never throw (both catch
      // internally and resolve null instead) — that's what makes them
      // safe to run alongside the two queries that must succeed for the
      // page to render at all.
      const [p, c, stock, extras] = await Promise.all([
        fetchProduct(HANDLE), fetchCatalogLite(), fetchVariantStock(HANDLE), fetchExtras(HANDLE),
      ]);
      stockByVariant = stock;
      document.getElementById('pdLoading').classList.add('hide');
      if (!p) {
        // Soft 404: the page renders a friendly message but used to
        // still return 200 with no robots hint, so Google indexed it as
        // a real page. noindex tells it not to.
        document.head.insertAdjacentHTML('beforeend', '<meta name="robots" content="noindex">');
        root.innerHTML = `
          <div class="not-found">
            <div>That piece isn't in the catalog.</div>
            <a href="/shop.html">Back to Shop All</a>
          </div>`;
        return;
      }
      product = normalizeProduct(p, stockByVariant);
      // After normalizeProduct, not before: it builds a fresh object
      // from the raw node, so a field set on the node never arrives.
      product.rating = parseRating(extras);
      product.fitNotes = metaText(extras, 'fitNotes');
      product.modelInfo = metaText(extras, 'modelInfo');
      product.fabricCare = metaText(extras, 'fabricCare');
      product.sizeChart = parseSizeChart(metaText(extras, 'sizeChart'));
      catalog = c;
    } catch (err) {
      console.error('Product page failed to load:', err);
      document.getElementById('pdLoading').classList.add('hide');
      root.innerHTML = `
        <div class="not-found">
          <div>Couldn't load this product right now. Try refreshing.</div>
          <a href="/shop.html">Back to Shop All</a>
        </div>`;
      return;
    }

    document.title = product.name + ' | Asior';

    // Consolidate ?id= and /products/<handle>.html onto one indexable URL.
    const canonical = document.querySelector('link[rel="canonical"]');
    if (canonical) canonical.href = location.origin + productUrl(product.handle);

    const hasOptions = product.optionNames.length > 0;
    const findVariant = sel => product.variants.find(v =>
      product.optionNames.every(n => v.options[n] === sel[n]));

    // Nothing preselected. A past "usual size, preselected" feature
    // here defaulted the size picker to whichever size this browser
    // had clicked most before (assets/site.js's preferredSize()) — a
    // real signal, never invented, but the founder's call is that a
    // silent default (however honestly derived) still ends up biasing
    // orders toward whatever a visitor happened to click first, and
    // that's not worth the personalization. A size-less product still
    // has exactly one real variant, so it's still selected by default
    // — there's no picker to leave blank in that case.
    const selection = hasOptions ? {} : { ...product.variants[0].options };

    // ---- media ----
    // Every real image the product has, at full size, stacked. The
    // thumbnail strip is gone: it hid the rest of the photography
    // behind 64px squares, and photography is what sells the garment.
    // Nothing is duplicated to fill space -- a product with one image
    // renders one frame.
    const galleryHTML = product.images.length
      ? product.images.map((im, i) => `
          <figure class="pd-shot" data-index="${i}">
            ${A.imgTag(im, {
              id: i === 0 ? 'pdMainImg' : '',
              eager: i === 0,
              alt: im.altText || product.name + (i ? ' view ' + (i + 1) : ''),
              sizes: '(max-width: 900px) 100vw, 60vw',
            })}
          </figure>`).join('')
      : `<div class="ph"><span>No image available</span></div>`;


    // ---- copy blocks ----
    const shipHTML = `
      <details class="pd-row pd-ship">
        <summary>Shipping &amp; Returns</summary>
        <div class="pd-row-body pd-ship-body">
          ${A.shippingDetailHTML()}
          <p>Returns and exchanges accepted within 14 days of delivery, email <a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a> to start one. Sizing exchanges are subject to availability. Items must be unworn, unwashed, with tags attached. Return shipping is on us if something arrived damaged or wrong, otherwise it's on you.</p>
        </div>
      </details>`;

    // Closed by default and in the same accordion rhythm as the rest.
    // The copy is Shopify's own and is kept verbatim -- it is factual
    // (cut, length, fabric), it is simply no longer in front of the
    // button.
    const descHTML = product.description
      ? `<details class="pd-row">
          <summary>Description</summary>
          <div class="pd-row-body">
          ${product.description.length && product.description[0].length < 60 && product.description.length > 2
            ? `<ul>${product.description.map(l => `<li>${A.escapeHtml(l)}</li>`).join('')}</ul>`
            : product.description.map(p => `<p>${A.escapeHtml(p)}</p>`).join('')}
          </div>
        </details>${shipHTML}`
      : shipHTML;

    // Renders nothing until assets/reviews.js has a real entry for this
    // handle. Built now, on purpose, while there's nothing to show yet —
    // see that file's own comment for the exact shape to add later.
    function trustBlockHTML(handle) {
      const items = (window.ASIOR_REVIEWS || {})[handle];
      if (!items || !items.length) return '';
      return `
        <section class="pd-trust">
          <div class="pd-desc-label">From Customers</div>
          <div class="pd-trust-grid">
            ${items.map(r => `
              <figure class="pd-trust-item">
                <img src="${A.escapeAttr(r.image)}" alt="${A.escapeAttr(r.name ? r.name + '’s photo' : 'Customer photo')}" loading="lazy">
                ${r.quote ? `<figcaption>${A.escapeHtml(r.quote)}${r.size ? ` <span class="pd-trust-size">— size ${A.escapeHtml(r.size)}</span>` : ''}</figcaption>` : ''}
              </figure>`).join('')}
          </div>
        </section>`;
    }

    // No fit note fabricated when there isn't one — simply omitted, same
    // as fabric/chainLength/pendantSize below when those are unset.
    const fitFact = details && details.fit ? details.fit : null;

    const facts = [
      details && details.fabric,
      fitFact,
      details && details.chainLength && 'Chain ' + details.chainLength,
      details && details.pendantSize && 'Pendant ' + details.pendantSize,
    ].filter(Boolean);

    const factsHTML = facts.length
      ? `<div class="pd-facts">${facts.map(f => `<span class="pd-fact">${A.escapeHtml(f)}</span>`).join('')}</div>`
      : '';

    // A preorder with no stated date defaults you to the FTC's 30-day
    // rule. If a real window is set in product-details.js, say it.
    const preorderNote = details && details.shipBy
      ? `You'll be charged now. This drop is expected to ship ${A.escapeHtml(details.shipBy)}.`
      : "You'll be charged now and it ships as soon as this drop is ready. Ships in 1-2 business days via USPS after that.";

    /* The panel answers four questions in order, and nothing is
       allowed between them: what is it, what does it cost, what size,
       how do I buy it.

       What used to sit in that space and has been moved out:
         - the quantity stepper, now inline beside the button instead of
           a row above it;
         - the HOW TO MEASURE disclosure, now an accordion below;
         - the shipping and returns paragraphs, now two short lines
           under the button with the detail in an accordion;
         - the product description, now an accordion;
         - the whole SMS signup block with its six lines of consent
           copy, which sat between the buy controls and the shipping
           information. It is still on the page, below the fold, where
           it can be read by someone who is not mid-purchase. */
    root.innerHTML = `
      <div class="pd">
        <div class="pd-gallery">${galleryHTML}</div>

        <aside class="pd-panel">
          <div class="pd-panel-in">
            ${product.isPreorder ? `<div class="pd-preorder-badge">Preorder</div>` : ''}
            <h1 class="pd-name">${A.escapeHtml(product.name)}</h1>
            <div class="pd-price tnum" id="pdPrice"></div>
            ${ratingHTML(product)}
            ${factsHTML}

            ${product.fitNotes ? `<p class="pd-fit">${A.escapeHtml(product.fitNotes)}</p>` : ''}
            ${hasOptions ? `<div class="pd-sizes" id="pdSizes"></div>` : ''}
            ${setSizingNote(product)}

            <div class="pd-actions">
              <div class="pd-qtyrow">
                <span class="pd-qty-label">Qty</span>
                <div class="pd-qty">
                  <button type="button" id="qtyDown" aria-label="Decrease quantity">-</button>
                  <span id="qtyVal" aria-live="polite">1</span>
                  <button type="button" id="qtyUp" aria-label="Increase quantity">+</button>
                </div>
              </div>
              <button class="pd-add" id="addBtn">${product.isPreorder ? 'Preorder' : 'Add to Cart'}</button>
              <button class="pd-buynow" id="buyNowBtn">Buy it now</button>
              <div class="pd-confirm" id="addConfirm" role="status" aria-live="polite">Added, <a href="/cart.html">view cart</a></div>
            </div>
            <p class="pd-stock-note" id="pdStockNote"></p>

            <div class="pd-bis" id="pdBis">
              <div class="pd-bis-label" id="pdBisLabel">Email me when this is back</div>
              <div class="pd-bis-row">
                <label class="sr-only" for="pdBisEmail">Email address</label>
                <input class="field" type="email" id="pdBisEmail" name="email" placeholder="Email"
                       autocomplete="email" spellcheck="false" required>
                <button type="button" id="pdBisBtn">Notify Me</button>
              </div>
              <p class="pd-bis-msg" id="pdBisMsg" role="status" aria-live="polite"></p>
            </div>

            <ul class="pd-trustlines">
              ${product.isPreorder
                ? `<li id="pdNote">${A.escapeHtml(preorderNote)}</li>
                   <li>14-day returns on unworn, unwashed items with tags.</li>`
                : `<li id="pdNote">${A.escapeHtml(A.shippingLine())}</li>
                   <li>14-day returns on unworn, unwashed items with tags.</li>`}
              <li class="pd-signup-prop" id="pdSignupProp"></li>
            </ul>

            <div class="pd-acc">
              ${descHTML}
              ${sizeGuideHTML(product)}
            </div>
          </div>
        </aside>
      </div>
      <section class="pd-below">
        ${trustBlockHTML(product.handle)}
        ${A.smsSignupHTML()}
      </section>
      <div class="pd-sticky" id="pdSticky">
        <div class="pd-sticky-top">
          <div class="pd-sticky-info">
            <div class="pd-sticky-name">${A.escapeHtml(product.name)}</div>
            <div class="pd-sticky-price tnum" id="pdStickyPrice"></div>
          </div>
          ${hasOptions ? `<div class="pd-sticky-sizes" id="pdStickySizes"></div>` : ''}
        </div>
        <button class="pd-add" id="addBtnSticky">${product.isPreorder ? 'Preorder' : 'Add to Cart'}</button>
      </div>`;

    const currentVariant = () => hasOptions ? findVariant(selection) : product.variants[0];

    function renderPrice() {
      const v = currentVariant();
      const el = document.getElementById('pdPrice');
      const stickyEl = document.getElementById('pdStickyPrice');
      if (v) {
        const onSale = v.comparePrice && v.comparePrice > v.price;
        el.innerHTML = onSale
          ? `<span class="compare">$${v.comparePrice}</span>$${v.price}`
            + `<span class="save">save $${Math.round(v.comparePrice - v.price)}</span>`
          : `$${v.price}`;
        if (stickyEl) stickyEl.textContent = `$${v.price}`;
        return;
      }
      // No size picked yet (nothing is preselected) — still a real
      // price, same min/max-across-variants fact shop.html's grid
      // cards already show, not a placeholder.
      const prices = product.variants.map(vv => vv.price);
      const min = Math.min(...prices), max = Math.max(...prices);
      const label = min === max ? `$${min}` : `From $${min}`;
      el.textContent = label;
      if (stickyEl) stickyEl.textContent = label;
    }

    function renderSizes() {
      if (!hasOptions) return;
      const wrap = document.getElementById('pdSizes');
      wrap.innerHTML = product.optionNames.map(name => {
        const values = [...new Set(product.variants.map(v => v.options[name]))];
        const row = values.map(val => {
          const v = findVariant({ ...selection, [name]: val });
          const sel = selection[name] === val;
          const avail = v ? v.available : false;
          return `<button type="button" class="pd-size${sel ? ' selected' : ''}${!avail ? ' unavailable' : ''}"
                    data-option="${A.escapeAttr(name)}" data-value="${A.escapeAttr(val)}"
                    aria-pressed="${sel}">${A.escapeHtml(val)}</button>`;
        }).join('');
        return `<div class="pd-size-group"><div class="pd-size-label">${A.escapeHtml(name)}</div><div class="pd-size-row">${row}</div></div>`;
      }).join('');

      wrap.querySelectorAll('.pd-size').forEach(btn => {
        btn.addEventListener('click', () => selectOption(btn.dataset.option, btn.dataset.value, btn.classList.contains('unavailable')));
      });

      renderStickySizes();
    }

    // The sticky bar only ever offers the "Size" option — the one
    // choice that actually blocks a purchase from finishing. A product
    // with a second option (color, material) still routes that pick
    // through the full buy box; duplicating every option down here
    // would turn a quick bar into a second product page.
    function renderStickySizes() {
      const wrap = document.getElementById('pdStickySizes');
      if (!wrap || !product.optionNames.includes('Size')) return;
      const values = [...new Set(product.variants.map(v => v.options.Size))];
      wrap.innerHTML = values.map(val => {
        const v = findVariant({ ...selection, Size: val });
        const sel = selection.Size === val;
        const avail = v ? v.available : false;
        return `<button type="button" class="pd-size${sel ? ' selected' : ''}${!avail ? ' unavailable' : ''}"
                  data-option="Size" data-value="${A.escapeAttr(val)}"
                  aria-label="Size ${A.escapeAttr(val)}" aria-pressed="${sel}">${A.escapeHtml(val)}</button>`;
      }).join('');
      wrap.querySelectorAll('.pd-size').forEach(btn => {
        btn.addEventListener('click', () => selectOption(btn.dataset.option, btn.dataset.value, btn.classList.contains('unavailable')));
      });
    }

    // Shared by both the main size buttons and the sticky bar's —
    // whichever one a shopper actually taps, both stay in sync.
    function selectOption(option, value, wasUnavailable) {
      if (wasUnavailable) { openBackInStock(value); return; }
      selection[option] = value;
      if (option === 'Size') A.recordSizeChoice(value);
      hideBackInStock();
      renderSizes(); renderPrice(); renderAddButton(); renderStockNote();
    }

    function renderAddButton() {
      const v = currentVariant();
      const btn = document.getElementById('addBtn');
      const buyBtn = document.getElementById('buyNowBtn');
      const stickyBtn = document.getElementById('addBtnSticky');
      const needsPick = hasOptions && product.optionNames.includes('Size') && !selection.Size;
      if (needsPick) {
        // Nothing chosen yet. The button keeps saying what it does and
        // is simply disabled: it used to relabel itself "Select a Size",
        // which made the one control that buys the product read as a
        // dead grey box and was the single clearest complaint about
        // this page.
        btn.textContent = 'Add to Cart';
        btn.disabled = true;
        // Buy Now keeps its own label while disabled: two buttons both
        // reading "Select a Size" says the same thing twice and hides
        // what the second one is for.
        if (buyBtn) buyBtn.disabled = true;
        // Same reasoning as the main button above: it says what it
        // does and is disabled until a size is chosen. It used to be
        // relabelled "Select a Size" here, which left the two Add to
        // Cart controls on the same page reading differently.
        if (stickyBtn) { stickyBtn.textContent = 'Add to Cart'; stickyBtn.disabled = true; }
        return;
      }
      const sold = !v || !v.available;
      const price = v ? ' \u2014 $' + v.price : '';
      const label = sold
        ? 'Sold Out'
        : (product.isPreorder ? 'Preorder' + price : 'Add to Cart' + price);
      btn.textContent = label;
      btn.disabled = sold;
      if (buyBtn) buyBtn.disabled = sold;
      if (stickyBtn) { stickyBtn.textContent = label; stickyBtn.disabled = sold; }
      if (sold && v) openBackInStock(selection.Size);
    }

    // ---- back in stock ----
    function openBackInStock(sizeLabel) {
      const box = document.getElementById('pdBis');
      document.getElementById('pdBisLabel').textContent =
        sizeLabel ? `Sold out in ${sizeLabel}. Email me when it's back.` : 'Email me when this is back';
      box.classList.add('show');
      box.dataset.size = sizeLabel || '';
    }
    function hideBackInStock() {
      const box = document.getElementById('pdBis');
      box.classList.remove('show');
      document.getElementById('pdBisMsg').textContent = '';
    }

    document.getElementById('pdBisBtn').addEventListener('click', async () => {
      const input = document.getElementById('pdBisEmail');
      const msg = document.getElementById('pdBisMsg');
      const btn = document.getElementById('pdBisBtn');
      const size = document.getElementById('pdBis').dataset.size;
      if (!input.checkValidity()) { input.reportValidity(); return; }

      const wanted = product.variants.find(v => v.options.Size === size) || currentVariant();
      btn.disabled = true;
      try {
        await A.klaviyoBackInStock(input.value, wanted && wanted.variantId, {
          product: product.name, handle: product.handle, size: size || null,
        });
        msg.textContent = "You're on the list. We'll email you the moment it's back.";
        input.style.display = 'none';
        btn.style.display = 'none';
      } catch (err) {
        msg.textContent = "That didn't go through. Try again in a moment.";
        btn.disabled = false;
      }
    });

    // ---- gallery + zoom ----
    let currentIndex = 0;

    // Every shot is on the page, so there is nothing to swap -- a
    // click just opens that shot full size.
    function wireGallery() {
      document.querySelectorAll('.pd-shot').forEach(fig => {
        fig.addEventListener('click', () => {
          currentIndex = parseInt(fig.dataset.index, 10) || 0;
          openZoom();
        });
      });
    }

    // 56% of shoppers' first action on a product page is exploring the
    // images, and zoom was missing at every breakpoint. <dialog> gives
    // focus trapping and Escape-to-close for free; the inner container
    // allows native pinch-zoom on touch.
    function openZoom() {
      if (!product.images.length) return;
      const src = product.images[currentIndex];
      const dlg = document.getElementById('pdLightbox');
      const holder = document.getElementById('pdLightboxImg');
      holder.innerHTML = A.imgTag(src, {
        alt: src.altText || product.name, eager: true, sizes: '92vw',
      });
      // swap in the largest rendition available for the zoomed state
      const el = holder.querySelector('img');
      if (src.w2000) el.src = src.w2000;
      dlg.showModal();
    }

    const lightbox = document.getElementById('pdLightbox');
    document.getElementById('pdLightboxClose').addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.close(); });

    renderPrice(); renderSizes(); renderAddButton(); wireGallery();

    // Same instant as the sitewide banner (scripts/build.js's
    // HEADER_FULL) and index.html's post-Early-Access section — all

    // Sign-up is how you get a discount — there is no sitewide sale and
    // no code applied on anyone's behalf, so this is the honest offer
    // to make here. ASIORTEN is the only redeemable code in the store:
    // 10% off, all products, no expiry, once per customer. No other
    // number belongs in this sentence, and no close date does either —
    // neither the collection nor the code has one.
    //
    // It no longer reads as something you get BY signing up, because
    // you don't: it is a standing public code, and saying otherwise
    // made a reward out of something anyone can already type in.
    const propEl = document.getElementById('pdSignupProp');
    if (propEl) {
      propEl.textContent = 'Use code ASIORTEN for 10% off your first order.';
    }

    // ---- quantity ----
    let qty = 1;
    const qtyVal = document.getElementById('qtyVal');
    document.getElementById('qtyDown').addEventListener('click', () => { qty = Math.max(1, qty - 1); qtyVal.textContent = qty; });
    document.getElementById('qtyUp').addEventListener('click', () => { qty += 1; qtyVal.textContent = qty; });

    // Straight to Shopify's own checkout on click — same pattern as
    // lanyard.html. Used to add the item and just show "Added, view
    // cart", leaving checkout two clicks away (cart.html, then its own
    // Checkout button). Now it's one: add, then go straight there.
    // Everything both buttons report, in one place: the two buttons
    // differ only in which cart they write to and where they leave you.
    function trackPurchaseIntent(v) {
      if (selection.Size) A.recordSizeChoice(selection.Size);
      A.klaviyoAddedToCart({
        handle: product.handle,
        name: product.name,
        url: location.origin + productUrl(product.handle),
        price: v.price,
        quantity: qty,
        size: selection.Size || null,
      });
      if (window.AsiorAds) {
        window.AsiorAds.addToCart({
          handle: product.handle, name: product.name,
          price: v.price, currency: v.currency, quantity: qty,
        });
      }
      if (window.AsiorAnalytics) {
        window.AsiorAnalytics.addToCart({
          handle: product.handle, name: product.name,
          variantId: v.variantId, price: v.price,
          quantity: qty, currency: v.currency,
        });
      }
      // trackCart merges the first touch, so every Added To Cart on
      // the site carries the same attribution.
      A.trackCart('Added To Cart', {
        product: product.name, handle: product.handle,
        size: selection.Size || null, price: v.price, quantity: qty,
        source: 'pdp',
      });
    }

    // Add to Cart: writes to the saved cart, updates the header count,
    // opens the drawer, and leaves the shopper on the page so they can
    // carry on and add something else.
    document.getElementById('addBtn').addEventListener('click', async () => {
      const v = currentVariant();
      if (!v || !v.available) return;
      const btn = document.getElementById('addBtn');
      const confirmEl = document.getElementById('addConfirm');
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Adding…';
      try {
        await A.addToShopifyCart(v.variantId, qty);
        trackPurchaseIntent(v);
        confirmEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = label;
        A.openCartDrawer();
      } catch (err) {
        confirmEl.textContent = 'Something went wrong adding that. Try again.';
        confirmEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = label;
      }
    });

    document.getElementById('buyNowBtn').addEventListener('click', async () => {
      const v = currentVariant();
      if (!v || !v.available) return;
      const btn = document.getElementById('buyNowBtn');
      const confirmEl = document.getElementById('addConfirm');
      btn.disabled = true;
      btn.textContent = 'Redirecting…';
      try {
        // Buy Now gets its own single-line cart rather than appending to
        // the saved one. Buying, pressing back, and buying again used to
        // stack a second line, so checkout showed two of the same piece
        // for what the shopper meant as one purchase. Their saved cart
        // is untouched, so anything added above survives.
        const updated = await A.createBuyNowCart(v.variantId, qty);
        trackPurchaseIntent(v);
        location.href = updated.checkoutUrl;
      } catch (err) {
        confirmEl.textContent = "Couldn't start checkout. Try again.";
        confirmEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Buy Now';
      }
    });

    // Proxy straight to the real button's own handler rather than
    // duplicating the cart/checkout logic here — one source of truth
    // for what "buy" actually does.
    const addBtnSticky = document.getElementById('addBtnSticky');
    if (addBtnSticky) {
      addBtnSticky.addEventListener('click', () => {
        if (!addBtnSticky.disabled) document.getElementById('addBtn').click();
      });
    }

    // Shows once the real Add-to-Cart button has been seen and then
    // scrolled past — never on load. On a tall mobile layout (big hero
    // image, name, price, countdown) the real button often hasn't
    // rendered into view yet at the moment this observer attaches, so
    // "not intersecting" alone would fire the sticky bar immediately —
    // exactly the "appears before the visitor has even seen the page"
    // mistake this bar exists to avoid. Requiring one real sighting
    // first means it only ever appears after an actual scroll-past.
    const pdSticky = document.getElementById('pdSticky');
    if (pdSticky) {
      let hasBeenSeen = false;
      const observer = new IntersectionObserver(
        (entries) => entries.forEach(entry => {
          if (entry.isIntersecting) hasBeenSeen = true;
          pdSticky.classList.toggle('show', hasBeenSeen && !entry.isIntersecting);
        }),
        { threshold: 0 }
      );
      observer.observe(document.getElementById('addBtn'));
    }

    // Honest, real-inventory urgency: only ever fires when genuinely
    // true, re-run on every size change so it always describes the
    // variant actually selected rather than the product in general.
    // Real, live per-size stock (product.variants[].stockCount, from
    // fetchVariantStock above) when it's available; the old
    // count-of-available-sizes signal as a fallback when it isn't
    // (fetchVariantStock failed, or Shopify hasn't returned a count for
    // this variant). Never hardcoded, never shown unless a number says
    // the current selection is genuinely low, and re-run on every size
    // change so it always describes the variant actually selected.
    function renderStockNote() {
      const note = document.getElementById('pdStockNote');
      if (!hasOptions) { note.textContent = ''; note.classList.remove('show'); return; }

      const v = currentVariant();

      if (v && v.available && typeof v.stockCount === 'number') {
        // Real data exists for this exact selection — it's the whole
        // answer, whether that's genuinely low or perfectly healthy.
        // Never fall through to the aggregate heuristic below once a
        // real count is known, or a healthy size could still show a
        // stale-feeling "sizes left" note driven by a *different*,
        // unrelated size being low.
        if (v.stockCount > 0 && v.stockCount <= 3) {
          note.textContent = v.stockCount === 1
            ? `Only 1 left in ${v.options.Size || 'this size'}.`
            : `Only ${v.stockCount} left in ${v.options.Size || 'this size'}.`;
          note.classList.add('show');
        } else {
          note.textContent = '';
          note.classList.remove('show');
        }
        return;
      }

      // No real per-size count for this selection: say nothing.
      //
      // There used to be a fallback here that counted how many sizes
      // were still available and wrote "Only N sizes left in stock".
      // That number was true, but it is a different claim from the one
      // the line appears to make, and it rendered precisely when the
      // real inventory data had failed to load — urgency copy standing
      // in for the fact we couldn't read. Scarcity is worth showing
      // only when it comes from live quantityAvailable; the rest of
      // the time the honest output is nothing at all.
      note.textContent = '';
      note.classList.remove('show');
    }
    renderStockNote();

    // ---- structured data ----
    // Product JSON-LD makes price and availability eligible for rich
    // results. No aggregateRating: there are no reviews, and marking up
    // ratings that don't exist is a manual-action offence.
    const v0 = currentVariant() || product.variants[0];
    const ld = {
      '@context': 'https://schema.org', '@type': 'Product',
      name: product.name,
      image: product.images.map(i => i.url),
      description: product.description ? product.description.join(' ') : undefined,
      brand: { '@type': 'Brand', name: 'Asior' },
      sku: v0 && v0.sku ? v0.sku : undefined,
      offers: {
        '@type': 'Offer',
        price: v0 ? v0.price : undefined,
        priceCurrency: v0 ? v0.currency : 'USD',
        availability: v0 && v0.available
          ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock',
        itemCondition: 'https://schema.org/NewCondition',
        url: location.origin + productUrl(product.handle),
      },
    };
    const ldTag = document.createElement('script');
    ldTag.type = 'application/ld+json';
    ldTag.textContent = JSON.stringify(ld);
    document.head.appendChild(ldTag);

    // ---- related + recently viewed ----
    // "You Might Also Like" used to be catalog.filter(not-this-product)
    // with no other scope — on a live storefront with every Active
    // product mixed together, that recommends whatever happens to sort
    // first in Shopify's catalog order, drop or not. Scoped to the real
    // Fall lineup (window.ASIOR_LAUNCH.FALL_PRODUCTS, the same source
    // of truth shop.html's merchandising sort and every name override
    // on this page already use) instead — the other three Fall pieces,
    // never something outside the drop.
    const fallList = (window.ASIOR_LAUNCH && window.ASIOR_LAUNCH.FALL_PRODUCTS) || [];
    const fallHandles = new Set(fallList.map(p => p.handle));
    const fallName = handle => { const f = fallList.find(p => p.handle === handle); return f ? f.name : null; };

    const tiles = list => list.map(p => {
      const media = p.featuredImage
        ? A.imgTag(p.featuredImage, { alt: p.title, sizes: '(max-width: 640px) 50vw, 220px' })
        : `<div class="ph"></div>`;
      // Same rule as everywhere else on this page: the customer-facing
      // Fall name overrides Shopify's own (sometimes internal) title.
      const name = fallName(p.handle) || p.title;
      return `<a class="rel-item" href="${productUrl(p.handle)}">${media}<div class="rel-name">${A.escapeHtml(name)}</div></a>`;
    }).join('');

    const priorViews = A.getViewed()
      .filter(h => h !== product.handle)
      .map(h => catalog.find(p => p.handle === h))
      .filter(Boolean);

    const related = catalog
      .filter(p => fallHandles.has(p.handle) && p.handle !== product.handle)
      .slice(0, 4);
    let relHTML = '';

    if (related.length) {
      const label = priorViews.length === 1
        ? `Since You Looked At ${A.escapeHtml(priorViews[0].title)}`
        : 'You Might Also Like';
      relHTML += `<section class="rel-section"><div class="rel-label">${label}</div>
        <div class="rel-grid">${tiles(related)}</div></section>`;
    }
    if (priorViews.length) {
      relHTML += `<section class="rel-section"><div class="rel-label">Recently Viewed</div>
        <div class="rel-grid">${tiles(priorViews.slice(0, 4))}</div></section>`;
    }
    relRoot.innerHTML = relHTML;

    // The block above renders with the buy box, so it is wired here
    // rather than on page load like the footer's.
    A.wireSmsSignup(root);

    A.recordView(product.handle);
    A.klaviyoTrack('Viewed Product', { product: product.name, handle: product.handle });
    // Onsite twin of the line above. Only this one sets the cookie
    // Klaviyo's Browse Abandonment flow keys off — the Client API
    // event above rides an anonymous_id of our own and can't trigger
    // it. Prices and names come from the live product, never invented.
    if (window.AsiorAds) {
      window.AsiorAds.viewContent({
        handle: product.handle, name: product.name,
        price: product.variants[0] ? product.variants[0].price : undefined,
        currency: product.variants[0] ? product.variants[0].currency : 'USD',
      });
    }
    A.klaviyoViewedProduct({
      handle: product.handle,
      name: product.name,
      url: location.origin + productUrl(product.handle),
      image: (product.images && product.images[0] && product.images[0].url) || null,
      price: Math.min.apply(null, product.variants.map(function (v) { return v.price; })),
    });

    // Shopify's own funnel. Same real values, different collector —
    // see assets/shopify-analytics.js for why Shopify's pixel can't
    // reach this domain. No-ops silently if it didn't load.
    if (window.AsiorAnalytics) {
      window.AsiorAnalytics.productView({
        handle: product.handle,
        name: product.name,
        price: Math.min.apply(null, product.variants.map(function (v) { return v.price; })),
        currency: product.variants[0] && product.variants[0].currency,
      });
    }
  })();
</script>

</body>
</html>
