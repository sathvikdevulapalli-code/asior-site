<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asior</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0b0a08;
    --ink: #f5f3ee;
    --muted: #a89f8f;
    --line: #2b2822;
    --font-display: 'Unbounded', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }

  a:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 1px solid var(--ink);
    outline-offset: 4px;
  }

  img { display: block; max-width: 100%; }

  .teaser-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 34px;
    z-index: 11;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .teaser-bar a {
    color: inherit;
    text-decoration: none;
    position: relative;
    padding-bottom: 2px;
    transition: color 0.3s ease;
  }

  .teaser-bar a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.3s ease;
  }

  .teaser-bar a:hover { color: var(--ink); }
  .teaser-bar a:hover::after { width: 100%; }

  header {
    position: fixed;
    top: 34px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px 40px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    z-index: 10;
    color: var(--ink);
  }

  header .mark { font-family: var(--font-display); font-weight: 600; font-size: 13px; }
  header nav { display: flex; gap: 36px; }
  header nav a { position: relative; padding-bottom: 6px; }

  header nav a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.4s ease;
  }

  header nav a:hover::after { width: 100%; }

  header nav a.cart-link { display: inline-flex; align-items: center; }

  .page-top-space { height: 144px; }

  /* ---------- product detail ---------- */
  .pd {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 40px 14vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: start;
  }

  .pd-media {
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 2px;
  }

  .pd-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .pd-media .ph {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%);
  }

  .pd-media .ph span {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-info { padding-top: 8px; }

  .pd-preorder-badge {
    display: inline-block;
    margin-bottom: 10px;
    padding: 4px 9px;
    border: 1px solid var(--muted);
    border-radius: 2px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-name {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-weight: 700;
    line-height: 1.15;
  }

  .pd-price {
    font-family: var(--font-mono);
    margin-top: 14px;
    font-size: 14px;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .pd-price .compare {
    text-decoration: line-through;
    opacity: 0.6;
    margin-right: 10px;
  }

  .pd-sizes { margin-top: 30px; }

  .pd-size-group { margin-bottom: 18px; }

  .pd-size-label {
    font-family: var(--font-mono);
    margin-bottom: 12px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-size-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .pd-size {
    position: relative;
    min-width: 46px;
    height: 42px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    background: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  }

  .pd-size:hover { border-color: var(--ink); }

  .pd-size.selected {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--bg);
  }

  .pd-size.unavailable {
    color: var(--muted);
    cursor: not-allowed;
  }

  .pd-size.unavailable:hover { border-color: var(--line); }

  .pd-size.unavailable::after {
    content: '';
    position: absolute;
    left: -6px;
    right: -6px;
    top: 50%;
    height: 1px;
    background: var(--muted);
    transform: rotate(-16deg);
  }

  .pd-qty {
    margin-top: 34px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .pd-qty button {
    width: 30px;
    height: 30px;
    border: 1px solid var(--line);
    background: none;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    cursor: pointer;
  }

  .pd-qty span { font-size: 13px; min-width: 16px; text-align: center; }

  .pd-actions { margin-top: 28px; }

  .pd-add {
    position: relative;
    background: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 14px 30px;
    cursor: pointer;
    transition: opacity 0.3s ease;
  }

  .pd-add:hover { opacity: 0.75; }

  .pd-add[disabled] {
    opacity: 0.35;
    border-color: var(--muted);
    color: var(--muted);
    cursor: not-allowed;
  }

  .pd-add[disabled]:hover { opacity: 0.35; }

  .pd-desc {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
  }

  .pd-desc-label {
    font-family: var(--font-mono);
    margin-bottom: 14px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-desc p, .pd-desc ul {
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink);
  }

  .pd-desc p + p { margin-top: 12px; }
  .pd-desc ul { list-style: none; }
  .pd-desc li { position: relative; padding-left: 16px; }
  .pd-desc li + li { margin-top: 8px; }
  .pd-desc li::before { content: '-'; position: absolute; left: 0; color: var(--muted); }

  .pd-ship {
    margin-top: 24px;
  }

  .pd-ship summary {
    cursor: pointer;
    list-style: none;
    position: relative;
    padding: 12px 20px 12px 0;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    border-top: 1px solid var(--line);
    transition: color 0.3s ease;
  }

  .pd-ship summary::-webkit-details-marker { display: none; }
  .pd-ship summary:hover { color: var(--ink); }

  .pd-ship summary::after {
    content: '+';
    position: absolute;
    right: 2px;
    top: 10px;
    font-family: var(--font-body);
    font-size: 15px;
  }

  .pd-ship[open] summary::after { content: '\2212'; }

  .pd-ship-body {
    padding: 4px 0 16px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink);
  }

  .pd-ship-body p + p { margin-top: 10px; }

  .pd-stock-note {
    display: none;
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .pd-stock-note.show { display: block; }

  .pd-confirm {
    display: none;
    margin-top: 16px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pd-confirm.show { display: block; }
  .pd-confirm a { text-decoration: underline; color: var(--ink); }

  .pd-note {
    margin-top: 34px;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--muted);
    line-height: 1.7;
  }

  /* ---------- related / recently viewed ---------- */
  .rel-section {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 40px 10vh;
  }

  .rel-label {
    font-family: var(--font-mono);
    margin-bottom: 20px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rel-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .rel-item {
    display: block;
    aspect-ratio: 3 / 4;
    position: relative;
    overflow: hidden;
    border-radius: 2px;
  }

  .rel-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .rel-item .ph {
    width: 100%;
    height: 100%;
    background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%);
  }

  .rel-item:hover img { transform: scale(1.04); }

  .rel-item .rel-name {
    position: absolute;
    left: 10px;
    bottom: 8px;
    right: 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.45);
  }

  @media (max-width: 640px) {
    .rel-grid { grid-template-columns: repeat(2, 1fr); }
    .rel-section { padding: 0 20px 8vh; }
  }

  .not-found {
    min-height: 40vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
  }

  .not-found a { text-decoration: underline; }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--line);
    text-align: center;
    padding: 56px 24px 48px;
  }

  footer .fmark {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  footer .fmeta {
    font-family: var(--font-mono);
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 300;
  }

  footer .fmeta a { position: relative; }

  footer .fmeta a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.4s ease;
  }

  footer .fmeta a:hover::after { width: 100%; }

  footer .social {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  footer .social a {
    display: inline-flex;
    color: var(--muted);
    transition: color 0.3s ease;
  }

  footer .social a:hover { color: var(--ink); }
  footer .social svg { width: 16px; height: 16px; display: block; }

  footer .policy-links {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  footer .policy-links a { transition: color 0.3s ease; }
  footer .policy-links a:hover { color: var(--ink); }

  @media (max-width: 720px) {
    .pd { grid-template-columns: 1fr; gap: 28px; }
  }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    header nav { gap: 16px; }
    .pd { padding: 0 20px 10vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
    .hero, .quick-links, .signup, .product, .look {
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>

<script>
  // ---------------------------------------------------------------
  // Shopify Storefront API. Everything on this page (name, price, images,
  // sizes, stock, description) is fetched live from the real catalog on
  // every page load, nothing is hardcoded. Add a product in Shopify Admin
  // and it works here automatically; set one to Draft and it disappears
  // cleanly (shows the "not in the catalog" state) instead of erroring,
  // since Draft products are simply absent from this query entirely.
  // ---------------------------------------------------------------
  const SHOPIFY_DOMAIN = 'b0vvek-yz.myshopify.com';
  const SHOPIFY_STOREFRONT_TOKEN = '90d08a1b479f1a4245738f227c5c6749';
  const SHOPIFY_API_VERSION = '2025-10';

  async function shopifyFetch(query, variables = {}) {
    const res = await fetch(`https://${SHOPIFY_DOMAIN}/api/${SHOPIFY_API_VERSION}/graphql.json`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Shopify-Storefront-Access-Token': SHOPIFY_STOREFRONT_TOKEN,
      },
      body: JSON.stringify({ query, variables }),
    });
    const json = await res.json();
    if (json.errors) throw new Error(json.errors.map(e => e.message).join(', '));
    return json.data;
  }

  async function getOrCreateCart() {
    const existingId = localStorage.getItem('shopify_cart_id');
    if (existingId) {
      const data = await shopifyFetch(
        `query($id: ID!) { cart(id: $id) { id checkoutUrl } }`,
        { id: existingId }
      );
      if (data.cart) return data.cart;
    }
    const data = await shopifyFetch(`mutation { cartCreate { cart { id checkoutUrl } } }`);
    localStorage.setItem('shopify_cart_id', data.cartCreate.cart.id);
    return data.cartCreate.cart;
  }

  async function addToShopifyCart(variantId, qty) {
    const cart = await getOrCreateCart();
    const data = await shopifyFetch(
      `mutation($cartId: ID!, $lines: [CartLineInput!]!) {
        cartLinesAdd(cartId: $cartId, lines: $lines) {
          cart { id checkoutUrl totalQuantity }
        }
      }`,
      { cartId: cart.id, lines: [{ merchandiseId: variantId, quantity: qty }] }
    );
    return data.cartLinesAdd.cart;
  }
  // ---------------------------------------------------------------

  // Fetch the whole live, Active catalog once per page load. Draft
  // products are simply absent from this response, that's how Shopify's
  // Storefront API works, so a product going Draft just makes it vanish
  // cleanly from every part of the site that reads from this list, no
  // special-casing needed and nothing to break.
  async function fetchCatalog() {
    const data = await shopifyFetch(`{
      products(first: 50) {
        edges {
          node {
            title
            handle
            descriptionHtml
            featuredImage { url }
            options { name values }
            variants(first: 20) {
              edges {
                node {
                  id
                  availableForSale
                  price { amount }
                  compareAtPrice { amount }
                  selectedOptions { name value }
                }
              }
            }
          }
        }
      }
    }`);
    return data.products.edges.map(e => normalizeProduct(e.node));
  }

  function descriptionFromHtml(html) {
    if (!html) return null;
    const paragraphs = html
      .split(/<\/p>|<br\s*\/?>/i)
      .map(p => p.replace(/<[^>]+>/g, '').trim())
      .filter(Boolean);
    return paragraphs.length ? paragraphs : null;
  }

  function normalizeProduct(node) {
    const optionNames = node.options.map(o => o.name).filter(n => n !== 'Title');
    const variants = node.variants.edges.map(e => {
      const v = e.node;
      const options = {};
      v.selectedOptions.forEach(so => { if (so.name !== 'Title') options[so.name] = so.value; });
      return {
        options,
        variantId: v.id,
        price: parseFloat(v.price.amount),
        comparePrice: v.compareAtPrice ? parseFloat(v.compareAtPrice.amount) : null,
        available: v.availableForSale,
      };
    });
    const isPreorder = /\[preorder\]/i.test(node.title);
    return {
      handle: node.handle,
      name: node.title.replace(/\s*\[preorder\]\s*/i, '').trim(),
      img: node.featuredImage ? node.featuredImage.url : null,
      description: descriptionFromHtml(node.descriptionHtml),
      optionNames,
      variants,
      isPreorder,
    };
  }

  const CATALOG_ROOT_ID = new URLSearchParams(location.search).get('id');
  const root = document.getElementById('pd-root');
  const relRoot = document.getElementById('rel-root');

  fetchCatalog().then(catalog => {
    const product = catalog.find(p => p.handle === CATALOG_ROOT_ID);

    if (!product) {
      root.innerHTML = `
        <div class="not-found">
          <div>That piece isn't in the catalog.</div>
          <a href="shop.html">Back to Shop All</a>
        </div>`;
      return;
    }

    document.title = product.name + ' | Asior';

    const hasOptions = product.optionNames.length > 0;

    function findVariant(selection) {
      return product.variants.find(v =>
        product.optionNames.every(name => v.options[name] === selection[name])
      );
    }

    const defaultVariant = product.variants.find(v => v.available) || product.variants[0];
    const selection = hasOptions ? { ...defaultVariant.options } : {};

    const media = product.img
      ? `<img src="${product.img}" alt="${product.name}">`
      : `<div class="ph"><span>Image coming soon</span></div>`;

    const shipHTML = `
      <details class="pd-ship">
        <summary>Shipping &amp; Returns</summary>
        <div class="pd-ship-body">
          <p>Ships within 1-2 business days via USPS. Delivery typically takes 2-5 business days after that. Shipping within the US only for now.</p>
          <p>Returns and exchanges accepted within 14 days of delivery, email <a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a> to start one. Sizing exchanges are subject to availability. Items must be unworn, unwashed, with tags attached. Return shipping is on us if something arrived damaged or wrong, otherwise it's on you.</p>
        </div>
      </details>`;

    const descHTML = product.description
      ? `<div class="pd-desc">
          <div class="pd-desc-label">Description</div>
          ${
            product.description.length && product.description[0].length < 60 && product.description.length > 2
              ? `<ul>${product.description.map(line => `<li>${line}</li>`).join('')}</ul>`
              : product.description.map(p => `<p>${p}</p>`).join('')
          }
        </div>
        ${shipHTML}`
      : shipHTML;

    root.innerHTML = `
      <div class="pd">
        <div class="pd-media">${media}</div>
        <div class="pd-info">
          ${product.isPreorder ? `<div class="pd-preorder-badge">Preorder</div>` : ''}
          <h1 class="pd-name">${product.name}</h1>
          <div class="pd-price" id="pdPrice"></div>
          <div class="pd-buy" id="pdBuy">
            ${hasOptions ? `<div class="pd-sizes" id="pdSizes"></div>` : ''}
            <div class="pd-qty">
              <button type="button" id="qtyDown">-</button>
              <span id="qtyVal">1</span>
              <button type="button" id="qtyUp">+</button>
            </div>
            <div class="pd-actions">
              <button class="pd-add" id="addBtn">${product.isPreorder ? 'Preorder' : 'Add to Cart'}</button>
              <div class="pd-confirm" id="addConfirm">Added, <a href="cart.html">view cart</a></div>
            </div>
            <p class="pd-stock-note" id="pdStockNote"></p>
          </div>
          <p class="pd-note" id="pdNote">${
            product.isPreorder
              ? "You'll be charged now and it ships as soon as this drop is ready. Ships in 1-2 business days via USPS after that."
              : 'Ships in 1-2 business days via USPS. No account needed at checkout.'
          }</p>
          ${descHTML}
        </div>
      </div>`;

    function currentVariant() {
      return hasOptions ? findVariant(selection) : product.variants[0];
    }

    function renderPrice() {
      const v = currentVariant();
      const priceEl = document.getElementById('pdPrice');
      if (!v) { priceEl.textContent = 'Price coming soon'; return; }
      priceEl.innerHTML = `${v.comparePrice && v.comparePrice > v.price ? `<span class="compare">$${v.comparePrice}</span>` : ''}$${v.price}`;
    }

    function renderSizes() {
      if (!hasOptions) return;
      const wrap = document.getElementById('pdSizes');
      wrap.innerHTML = product.optionNames.map(name => {
        const values = [...new Set(product.variants.map(v => v.options[name]))];
        const row = values.map(val => {
          const v = findVariant({ ...selection, [name]: val });
          const isSelected = selection[name] === val;
          const isAvailable = v ? v.available : false;
          return `<button type="button" class="pd-size${isSelected ? ' selected' : ''}${!isAvailable ? ' unavailable' : ''}" data-option="${name}" data-value="${val}">${val}</button>`;
        }).join('');
        return `<div class="pd-size-group"><div class="pd-size-label">${name}</div><div class="pd-size-row">${row}</div></div>`;
      }).join('');

      wrap.querySelectorAll('.pd-size').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.classList.contains('unavailable')) return;
          selection[btn.dataset.option] = btn.dataset.value;
          renderSizes();
          renderPrice();
          renderAddButton();
        });
      });
    }

    function renderAddButton() {
      const v = currentVariant();
      const btn = document.getElementById('addBtn');
      if (!v || !v.available) {
        btn.textContent = 'Sold Out';
        btn.disabled = true;
      } else {
        btn.textContent = product.isPreorder ? 'Preorder' : 'Add to Cart';
        btn.disabled = false;
      }
    }

    renderPrice();
    renderSizes();
    renderAddButton();
    renderStockNote();

    let qty = 1;
    const qtyVal = document.getElementById('qtyVal');
    document.getElementById('qtyDown').addEventListener('click', () => {
      qty = Math.max(1, qty - 1);
      qtyVal.textContent = qty;
    });
    document.getElementById('qtyUp').addEventListener('click', () => {
      qty += 1;
      qtyVal.textContent = qty;
    });

    document.getElementById('addBtn').addEventListener('click', async () => {
      const v = currentVariant();
      if (!v || !v.available) return;
      const btn = document.getElementById('addBtn');
      const confirmEl = document.getElementById('addConfirm');

      btn.disabled = true;
      try {
        await addToShopifyCart(v.variantId, qty);
        confirmEl.innerHTML = 'Added to cart. <a href="cart.html">View cart</a>';
        confirmEl.classList.add('show');
      } catch (err) {
        confirmEl.textContent = 'Something went wrong adding that. Try again.';
        confirmEl.classList.add('show');
      }
      btn.disabled = false;
    });

    // Honest, real-inventory urgency: only fires when genuinely true (2 or
    // fewer sizes actually left in stock), never a made-up countdown.
    function renderStockNote() {
      if (!hasOptions) return;
      const total = product.variants.length;
      const availableCount = product.variants.filter(v => v.available).length;
      const note = document.getElementById('pdStockNote');
      if (availableCount > 0 && availableCount <= 2 && availableCount < total) {
        note.textContent = availableCount === 1
          ? 'Only 1 size left in stock.'
          : `Only ${availableCount} sizes left in stock.`;
        note.classList.add('show');
      }
    }

    // ---------------------------------------------------------------
    // Personalization: real browsing history only, nothing fabricated.
    // "Recently Viewed" is literally the products this browser has looked
    // at, read back from localStorage. "You Might Also Like" is the rest
    // of the live catalog. No fake urgency, no invented activity.
    // ---------------------------------------------------------------
    function renderTiles(products) {
      return products.map(p => {
        const media = p.img ? `<img src="${p.img}" alt="${p.name}">` : `<div class="ph"></div>`;
        return `<a class="rel-item" href="product.html?id=${p.handle}">${media}<div class="rel-name">${p.name}</div></a>`;
      }).join('');
    }

    let relHTML = '';

    const priorViews = JSON.parse(localStorage.getItem('asior_viewed') || '[]')
      .filter(handle => handle !== product.handle)
      .map(handle => catalog.find(p => p.handle === handle))
      .filter(Boolean);

    const related = catalog.filter(p => p.handle !== product.handle).slice(0, 4);

    if (related.length > 0) {
      const relLabel = priorViews.length === 1
        ? `Since You Looked At ${priorViews[0].name}`
        : 'You Might Also Like';
      relHTML += `
        <section class="rel-section">
          <div class="rel-label">${relLabel}</div>
          <div class="rel-grid">${renderTiles(related)}</div>
        </section>`;
    }

    if (priorViews.length > 0) {
      relHTML += `
        <section class="rel-section">
          <div class="rel-label">Recently Viewed</div>
          <div class="rel-grid">${renderTiles(priorViews.slice(0, 4))}</div>
        </section>`;
    }

    relRoot.innerHTML = relHTML;

    // record this view for next time (most-recent-first, deduped, capped)
    const history = [product.handle, ...JSON.parse(localStorage.getItem('asior_viewed') || '[]').filter(h => h !== product.handle)].slice(0, 8);
    localStorage.setItem('asior_viewed', JSON.stringify(history));
  }).catch(() => {
    // Fail open, honestly: if the live fetch itself fails (network,
    // Shopify hiccup), say so instead of pretending the product doesn't
    // exist or leaving a blank page.
    root.innerHTML = `
      <div class="not-found">
        <div>Couldn't load this product right now. Try refreshing.</div>
        <a href="shop.html">Back to Shop All</a>
      </div>`;
  });
</script>

</body>
</html>
