<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop All | Asior</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0b0a08;
    --ink: #f5f3ee;
    --muted: #a89f8f;
    --line: #2b2822;
    --font-display: 'Unbounded', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }

  a:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 1px solid var(--ink);
    outline-offset: 4px;
  }

  img { display: block; max-width: 100%; }

  /* ---------- header ---------- */
  .teaser-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 34px;
    z-index: 11;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .teaser-bar a {
    color: inherit;
    text-decoration: none;
    position: relative;
    padding-bottom: 2px;
    transition: color 0.3s ease;
  }

  .teaser-bar a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.3s ease;
  }

  .teaser-bar a:hover { color: var(--ink); }
  .teaser-bar a:hover::after { width: 100%; }

  header {
    position: fixed;
    top: 34px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px 40px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    z-index: 10;
    color: var(--ink);
  }

  header .mark { font-family: var(--font-display); font-weight: 600; font-size: 13px; }
  header nav { display: flex; gap: 36px; }
  header nav a { position: relative; padding-bottom: 6px; }

  header nav a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.4s ease;
  }

  header nav a:hover::after { width: 100%; }

  header nav a.cart-link { display: inline-flex; align-items: center; }

  /* ---------- page top space ---------- */
  .page-top-space { height: 144px; }

  .rail-label {
    font-family: var(--font-mono);
    margin-bottom: 26px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
    color: var(--muted);
  }

  /* ---------- shop grid ---------- */
  .shop {
    padding: 0 40px 14vh;
    max-width: 1180px;
    margin: 0 auto;
  }

  .shop-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  .product {
    display: block;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .product.in { opacity: 1; transform: translateY(0); }

  .product-img {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 2px;
    background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%);
  }

  .price-badge {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 2;
    background: rgba(11, 10, 8, 0.72);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 5px 8px;
    border-radius: 2px;
  }

  .price-badge .compare {
    text-decoration: line-through;
    opacity: 0.6;
    margin-right: 5px;
  }

  .product-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
  }

  .product:hover .product-img img {
    transform: scale(1.035);
    filter: brightness(1.03);
  }

  .name-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .product .name {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .divider-label {
    grid-column: 1 / -1;
    margin: 10px 0 4px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.7;
    border-top: 1px solid var(--line);
    padding-top: 24px;
  }

  .preorder-tag {
    flex: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 2px;
  }

  .shop-empty {
    display: none;
    padding: 6vh 0;
    color: var(--muted);
    font-size: 13px;
  }

  .shop-empty.show { display: block; }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--line);
    text-align: center;
    padding: 56px 24px 48px;
  }

  footer .fmark {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  footer .fmeta {
    font-family: var(--font-mono);
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 300;
  }

  footer .fmeta a { position: relative; }

  footer .fmeta a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 0.4s ease;
  }

  footer .fmeta a:hover::after { width: 100%; }

  footer .social {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  footer .social a {
    display: inline-flex;
    color: var(--muted);
    transition: color 0.3s ease;
  }

  footer .social a:hover {
    color: var(--ink);
  }

  footer .social svg {
    width: 16px;
    height: 16px;
    display: block;
  }

  footer .policy-links {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  footer .policy-links a { transition: color 0.3s ease; }
  footer .policy-links a:hover { color: var(--ink); }

  @media (max-width: 900px) {
    .shop-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    header nav { gap: 16px; }
    .shop { padding: 0 20px 10vh; }
    .shop-grid { grid-template-columns: 1fr; gap: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
    .hero, .quick-links, .signup, .product, .look {
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>

  <div class="teaser-bar"><a href="index.html#signup">Sign Up For 10% Off Your First Order</a></div>
  <header>
    <a class="mark" href="index.html">Asior</a>
    <nav>
      <a href="shop.html">Shop</a>
      <a href="collection.html">Summer Collection</a>
      <a href="community.html">Community</a>
      <a href="contact.html">Contact</a>
      <a href="manufacturing.html">Manufacturing</a>
      <a href="cart.html" class="cart-link" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="15" height="15"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></a>
    </nav>
  </header>

  <div class="page-top-space"></div>

  <!-- Every Active product in the real Shopify catalog, fetched live on
       load. Add, remove, or change something in Shopify Admin and this
       page reflects it automatically, nothing here is hardcoded. -->
  <section class="shop" id="shop">
    <div class="rail-label">Shop All</div>
    <div class="shop-grid" id="shopGrid"></div>
    <div class="shop-empty" id="shopEmpty">Nothing in the shop right now, check back soon.</div>
  </section>

  <footer id="order">
    <div class="fmark">Asior</div>
    <div class="fmeta"><a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a></div>
    <div class="social">
      <a href="https://www.instagram.com/asior_clothing/" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1"/></svg>
      </a>
      <a href="https://www.tiktok.com/@asiorclothing" aria-label="TikTok" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3h-3v12.1a2.7 2.7 0 1 1-2-2.6v-3.1a5.8 5.8 0 1 0 5 5.7V9.4a7.5 7.5 0 0 0 4 1.2V7.5c-2.1-.2-3.7-1.8-4-4.5z"/></svg>
      </a>
    </div>
    <div class="policy-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
      <a href="account.html">Account</a>
    </div>
  </footer>

<script>
  const SHOPIFY_DOMAIN = 'b0vvek-yz.myshopify.com';
  const SHOPIFY_STOREFRONT_TOKEN = '90d08a1b479f1a4245738f227c5c6749';
  const SHOPIFY_API_VERSION = '2024-10';

  async function shopifyFetch(query, variables = {}) {
    const res = await fetch(`https://${SHOPIFY_DOMAIN}/api/${SHOPIFY_API_VERSION}/graphql.json`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Shopify-Storefront-Access-Token': SHOPIFY_STOREFRONT_TOKEN,
      },
      body: JSON.stringify({ query, variables }),
    });
    const json = await res.json();
    if (json.errors) throw new Error(json.errors.map(e => e.message).join(', '));
    return json.data;
  }

  // Real, live catalog, same as product.html. Whatever's Active in
  // Shopify shows here; Draft products are absent from the response
  // entirely, so they just don't appear rather than erroring.
  async function fetchCatalog() {
    const data = await shopifyFetch(`{
      products(first: 50) {
        edges {
          node {
            title
            handle
            featuredImage { url }
            variants(first: 20) {
              edges { node { price { amount } compareAtPrice { amount } } }
            }
          }
        }
      }
    }`);
    return data.products.edges.map(e => {
      const node = e.node;
      const prices = node.variants.edges.map(v => parseFloat(v.node.price.amount));
      const compares = node.variants.edges
        .map(v => v.node.compareAtPrice ? parseFloat(v.node.compareAtPrice.amount) : null)
        .filter(Boolean);
      const minPrice = Math.min(...prices);
      const maxPrice = Math.max(...prices);
      const compare = compares.length && compares[0] > minPrice ? compares[0] : null;
      return {
        handle: node.handle,
        name: node.title.replace(/\s*\[preorder\]\s*/i, '').trim(),
        img: node.featuredImage ? node.featuredImage.url : null,
        isPreorder: /\[preorder\]/i.test(node.title),
        priceLabel: minPrice === maxPrice
          ? `${compare ? `<span class="compare">$${compare}</span>` : ''}$${minPrice}`
          : `From $${minPrice}`,
      };
    });
  }

  function renderGrid(catalog) {
    const grid = document.getElementById('shopGrid');
    const empty = document.getElementById('shopEmpty');

    if (catalog.length === 0) {
      empty.classList.add('show');
      return;
    }

    grid.innerHTML = catalog.map(p => `
      <a class="product" href="product.html?id=${p.handle}">
        <div class="product-img">
          ${p.img ? `<img src="${p.img}" alt="Asior ${p.name}">` : ''}
          <div class="price-badge">${p.priceLabel}</div>
        </div>
        <div class="name-row">
          <div class="name">${p.name}</div>
          ${p.isPreorder ? `<span class="preorder-tag">Preorder</span>` : ''}
        </div>
      </a>`).join('');

    const items = grid.querySelectorAll('.product');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('in'), (i % 4) * 100);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    items.forEach(p => observer.observe(p));
  }

  fetchCatalog()
    .then(renderGrid)
    .catch(() => {
      // fail open and honest, no fake stock left standing
      document.getElementById('shopEmpty').textContent = "Couldn't load the shop right now, try refreshing.";
      document.getElementById('shopEmpty').classList.add('show');
    });
</script>

</body>
</html>
