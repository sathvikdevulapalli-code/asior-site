<!-- Open Graph. Social crawlers never run JavaScript, so these have to be
     real tags in the served HTML or a shared link renders as a bare URL.
     This page is the destination of the Instagram and TikTok bio links,
     so what it looks like when pasted is most of its job. -->
<meta property="og:site_name" content="Asior">

<link rel="stylesheet" href="assets/site.css">
<link rel="preload" href="assets/site.js" as="script">
<style>
  /* A stack of rules, not a stack of buttons. Every link-in-bio page
     on the internet is a column of rounded pills; this one is the same
     1px rule the product rows and the footer already use, so the page
     looks like the rest of the site instead of like the tool that
     usually makes it. */
  .links {
    max-width: 520px;
    margin: 0 auto;
    padding: 7vh 20px 14vh;
  }

  /* The wordmark, same face the header uses. It carries .mark-text so
     the Pinyon Script @font-face in site.css applies; setting a
     family here would have quietly fallen back to the body sans. */
  .links-mark {
    display: block;
    text-align: center;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 10px;
  }

  .links-mark .mark-text { font-size: 44px; }

  .links-sub {
    margin: 0 0 40px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .links-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }

  .links-row { border-bottom: 1px solid var(--line); }

  .links-row a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 4px;
    color: var(--ink);
    text-decoration: none;
    /* 44px minimum target comes from the 20px padding either side of a
       13px line, not from a fixed height, so a row with a note under it
       simply gets taller. */
    min-height: 44px;
  }

  .links-row a:hover .links-label,
  .links-row a:focus-visible .links-label { color: var(--muted); }
  .links-row a:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

  .links-text { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

  .links-label {
    font-size: var(--t-sm);
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color var(--dur) var(--ease-out);
  }

  .links-note {
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
    text-transform: none;
    letter-spacing: 0;
  }

  /* Points right for a page on this site, up-and-out for one that
     leaves it. The only difference between the two rows. */
  .links-arrow { flex: none; color: var(--muted); font-size: var(--t-sm); line-height: 1; }

  @media (max-width: 600px) {
    .links { padding-top: 5vh; }
    .links-mark { font-size: var(--t-lg); }
  }
</style>
<!-- HEAD:START -->
  <link rel="preconnect" href="https://static.klaviyo.com" crossorigin>
  <script async src="https://static.klaviyo.com/onsite/js/QV7rBB/klaviyo.js?company_id=QV7rBB"></script>
  <!-- A REAL VISITOR COUNT, which nothing else here provides.

       Checked 2026-11-14: Shopify reported 50 sessions in 30 days and
       attributed 100% of them to "direct" -- not one to social. That
       is not Shopify being wrong, it is Shopify having nothing to go
       on: Instagram's in-app browser sends no document.referrer, so
       unless the inbound URL carries UTM parameters there is nothing
       to attribute with. Klaviyo is no second opinion either; its
       Active on Site metric fired 5 times in the same 30 days,
       because it only counts profiles Klaviyo already knows.

       Vercel counts at the edge, on the request itself, so it is
       immune to the referrer being stripped, to ad blockers, and to
       the gate. It is the only number here that answers "how many
       people actually arrived".

       NEEDS ONE CLICK FROM THE OWNER: Web Analytics has to be enabled
       on the Vercel project or this script 404s harmlessly and counts
       nothing. See OWNER-ACTIONS.md. -->
  <script defer src="/_vercel/insights/script.js"></script>
  <link rel="preconnect" href="https://monorail-edge.shopifysvc.com">
  <script defer src="/assets/shopify-analytics.js"></script>
  <!-- Ad pixels. Both files are inert until assets/ads-config.js is
       explicitly enabled AND verified AND consented to, so shipping
       them loads no third-party script and sends nothing. The config
       is loaded first because ads.js reads it synchronously; no
       preconnect to the ad networks, because nothing should be
       warming a connection to a pixel that is switched off. -->
  <script defer src="/assets/ads-config.js"></script>
  <script defer src="/assets/ads.js"></script>
  <!-- DROP ACCESS. Config first, because drop-access.js reads it
       synchronously; both deferred so neither blocks first paint, and
       both no-op entirely when ASIOR_DROP.ENABLED is false. The
       automatic trigger is a separate switch (AUTO) and ships off --
       see the long note at the top of drop-config.js about the two
       Klaviyo popups that are already live on every page. -->
  <script defer src="/assets/drop-config.js"></script>
  <script defer src="/assets/drop-access.js"></script>
  <!-- THE ENTRY GATE. A wall, unlike the overlay above it. Read the
       header of assets/drop-gate.js before touching any of this.

       The bootstrap below is INLINE and SYNCHRONOUS on purpose: a
       deferred script cannot hide the page until after the storefront
       has already painted, and a wall that appears a beat after the
       clothes is not a wall. It adds a class that hides <body> via
       the .asior-gate-pending rule in site.css.

       The watchdog is the reason that is safe. If drop-gate.js fails
       to load, throws, or is slow, nothing else would ever remove
       that class and every visitor would sit looking at a blank page
       -- the whole site, down, from one bad deploy. So the same
       inline script that hides the page schedules its own
       unconditional reveal. A broken gate shows the shop. It never
       shows nothing.

       It reads ASIOR_DROP.GATE.ON from the deferred config, which has
       not run yet, so it cannot: it checks the inlined copy of that
       one boolean below instead. The build writes both from the same
       source, and check-slop fails if they disagree. -->
  <script>(function(){var ON=/*GATE_ON*/true/*END_GATE_ON*/;if(!ON)return;try{
    var d=document.documentElement;
    if(localStorage.getItem('asior_gate_opened_at'))return;
    d.classList.add('asior-gate-pending');
    /* The gate's assets are fetched HERE, not from static <link>s in
       this head, because only this line knows whether the gate is
       about to appear. Three faces and a poster is 102KB, and a
       visitor who is already through the gate never sees any of it --
       preloading them on every page spent that on every page view of
       every admitted customer, for a screen they will not be shown.
       Injected only on the paint where the gate actually renders.

       crossorigin is required on a font preload even same-origin:
       font fetches are always CORS-mode, and a preload without it is
       made in the wrong mode, ignored, and quietly fetched twice. */
    ['/fonts/anton-latin.woff2','/fonts/inter-tight-var-latin.woff2',
     '/fonts/courier-prime-400-latin.woff2'].forEach(function(h){
      var l=document.createElement('link');
      l.rel='preload';l.as='font';l.type='font/woff2';l.href=h;l.crossOrigin='anonymous';
      d.firstChild.appendChild(l);
    });
    var p=document.createElement('link');
    p.rel='preload';p.as='image';p.href='/video/gate-poster.jpg';p.fetchPriority='high';
    d.firstChild.appendChild(p);
    setTimeout(function(){d.classList.remove('asior-gate-pending');},4000);
  }catch(e){try{document.documentElement.classList.remove('asior-gate-pending');}catch(x){}}})();</script>
  <script defer src="/assets/drop-gate.js"></script>
  <!-- HEAD:END -->
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" class="links">

         reader and a crawler separately. Same pattern as index.html. -->

    <!-- Rendered from assets/links-config.js. Server-rendered markup is

        <li class="links-row"><a href="https://www.instagram.com/asior_clothing/"><span class="links-text"><span class="links-label">Instagram</span></span></a></li>
        <li class="links-row"><a href="https://www.tiktok.com/@asiorclothing.com"><span class="links-text"><span class="links-label">TikTok</span></span></a></li>

<script src="assets/links-config.js"></script>
<script src="assets/site.js"></script>
<script src="assets/launch-config.js"></script>
<script src="assets/promo-config.js"></script>
<script>
(function () {
  var cfg = window.ASIOR_LINKS || {};
  var list = document.getElementById('linksList');
  if (!list || !Array.isArray(cfg.LINKS)) return;

  /* What the visitor arrived with wins.

     If someone opens /links from a creator's post that already carries
     utm_content, that is the attribution worth keeping — stamping
     source=linkinbio over it would quietly reassign every sale from
     that post to ourselves. So the incoming params are read first and
     the defaults only fill what is missing. */
  function outboundHref(href) {
    try {
      var incoming = new URLSearchParams(location.search);
      var url = new URL(href, location.origin);
      var merged = {};
      Object.keys(cfg.DEFAULT_UTM || {}).forEach(function (k) { merged[k] = cfg.DEFAULT_UTM[k]; });
      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term',
       'ttclid', 'fbclid', 'gclid'].forEach(function (k) {
        var v = incoming.get(k);
        if (v) merged[k] = v;
      });
      Object.keys(merged).forEach(function (k) {
        // Never overwrite a param the destination already specifies.
        if (!url.searchParams.has(k)) url.searchParams.set(k, merged[k]);
      });
      return url.pathname + url.search + url.hash;
    } catch (err) {
      return href;   // a malformed URL is still a link that should work
    }
  }

  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  list.innerHTML = cfg.LINKS.map(function (l) {
    if (!l || !l.href || !l.label) return '';
    /* Only this site's own URLs get the UTMs. Appending our parameters
       to instagram.com would hand a third party a tracking string that
       says nothing to them and follows the visitor off-site. */
    var href = l.external ? l.href : outboundHref(l.href);
    var rel = l.external ? ' target="_blank" rel="noopener"' : '';
    var arrow = l.external ? '&#8599;' : '&#8594;';
    return '<li class="links-row"><a href="' + esc(href) + '"' + rel + '>'
      + '<span class="links-text"><span class="links-label">' + esc(l.label) + '</span>'
      + (l.note ? '<span class="links-note">' + esc(l.note) + '</span>' : '')
      + '</span><span class="links-arrow" aria-hidden="true">' + arrow + '</span></a></li>';
  }).join('');
})();
</script>
</body>
