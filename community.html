<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lookbook | Asior</title>

<meta name="theme-color" content="#0b0a08">
<link rel="canonical" href="https://asiorclothing.com/community.html">

<!-- Open Graph. Social crawlers never run JavaScript, so these have to be
     real tags in the served HTML or a shared link renders as a bare URL. -->
<meta property="og:site_name" content="Asior">
<meta property="og:type" content="website">
<meta property="og:title" content="Lookbook | Asior">
<meta property="og:description" content="The Fall collection worn and styled. Every look links to the pieces in it.">
<meta property="og:url" content="https://asiorclothing.com/community.html">
<meta property="og:image" content="https://asiorclothing.com/assets/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Asior — limited drops, made in small batches">
<meta name="twitter:card" content="summary_large_image">

<!-- Fonts via <link>, not @import inside a style block: an @import means the
     browser has to download and parse the CSS before it even discovers
     the font request. Weight 200 was requested site-wide and used
     nowhere, so it is not requested here. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="preload" href="assets/site.js" as="script">
<style>
  .lookbook {
    padding: 0 40px 9vh;
    max-width: 1180px;
    margin: 0 auto;
  }

  .look-intro {
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    margin: -14px 0 26px;
    max-width: 48ch;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .look {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 2px;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out);
  }

  .look.in { opacity: 1; transform: translateY(0); }

  .look img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transition: transform 0.8s var(--ease-img), filter 0.6s ease;
  }

  @media (hover: hover) and (pointer: fine) {
    .look:hover img {
      transform: scale(1.035);
      filter: brightness(1.03);
    }
  }

  /* ---------- testimonials ---------- */
  .testimonials {
    padding: 5vh 40px 14vh;
    max-width: 1180px;
    margin: 0 auto;
  }

  .quotes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 48px;
  }

  .quote {
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
  }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    /* The phone nav is a full-screen panel now, defined once in
       assets/site.css. The horizontally scrolling link strip this
       page used to redeclare for itself is gone -- it was also
       overriding the shared rule, which is why the panel opened at
       the width of the old strip. */
    .lookbook { padding: 0 20px 6vh; }
    .gallery { grid-template-columns: 1fr; gap: 14px; }
    .testimonials { padding: 3vh 20px 10vh; }
    .quotes { grid-template-columns: 1fr; gap: 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .look {
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>

<!-- HEAD:START -->
  <link rel="preconnect" href="https://static.klaviyo.com" crossorigin>
  <script async src="https://static.klaviyo.com/onsite/js/QV7rBB/klaviyo.js?company_id=QV7rBB"></script>
  <link rel="preconnect" href="https://monorail-edge.shopifysvc.com">
  <script defer src="/assets/shopify-analytics.js"></script>
  <!-- HEAD:END -->
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- HEADER:START -->
  <div class="teaser-bar" role="region" aria-label="Collection note"><a href="shop.html">Fall Collection &mdash; limited runs, restocked rarely</a></div>
  <header>
    <a class="mark" href="shop.html">Asior</a>
    <!-- Phone-only duplicate. The cart lives inside <nav> for the
         desktop row, and <nav> becomes the hidden full-screen panel on
         a phone -- which would leave the top bar with no cart at all.
         renderCartCount() writes to every .cart-count and
         wireCartLinks() binds every a.cart-link, so the copy needs no
         special handling. -->
    <a href="cart.html" class="cart-link cart-link--bar">Cart <span class="cart-count">(0)</span></a>
    <button type="button" class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav">Menu</button>
    <nav id="siteNav">
      <button type="button" class="nav-close" id="navClose" aria-label="Close menu">Close</button>
      <a href="shop.html">Shop</a>
      <a href="community.html">Community</a>
      <a href="contact.html">Contact</a>
      <a href="manufacturing.html">Manufacturing</a>
      <a href="cart.html" class="cart-link">Cart <span class="cart-count">(0)</span></a>
    </nav>
  </header>

  <div class="page-top-space"></div>
  <!-- HEADER:END -->

  <main id="main">

  <!-- Renamed from "Community" to what it actually is.

       The page was a six-image gallery under a Community heading, with
       no way for anybody to participate -- no submissions, no customer
       stories, no event. A title is not a community programme, and
       calling a lookbook one is the kind of small overclaim that makes
       a visitor discount everything else on the page.

       The URL stays /community.html so no existing link, share or
       index entry breaks. The slot for real customer looks is below,
       commented out until there is permissioned content to put in it. -->
  <section class="lookbook" id="look">
    <h1 class="rail-label">Lookbook</h1>
    <p class="look-intro">The Fall collection, worn. Shot on the people who actually wear it.</p>
    <div class="gallery">
      <div class="look"><picture><source type="image/webp" srcset="images/look-01.webp"><img src="images/look-01.jpg" alt="Asior look 01" width="800" height="1200" fetchpriority="high" decoding="async"></picture></div>
      <div class="look"><picture><source type="image/webp" srcset="images/look-02.webp"><img src="images/look-02.jpg" alt="Asior look 02" width="800" height="1200" loading="lazy" decoding="async"></picture></div>
      <div class="look"><picture><source type="image/webp" srcset="images/look-03.webp"><img src="images/look-03.jpg" alt="Asior look 03" width="800" height="1200" loading="lazy" decoding="async"></picture></div>
      <div class="look"><picture><source type="image/webp" srcset="images/look-04.webp"><img src="images/look-04.jpg" alt="Asior look 04" width="800" height="1200" loading="lazy" decoding="async"></picture></div>
      <div class="look"><picture><source type="image/webp" srcset="images/look-05.webp"><img src="images/look-05.jpg" alt="Asior look 05" width="800" height="1200" loading="lazy" decoding="async"></picture></div>
      <div class="look"><picture><source type="image/webp" srcset="images/look-06.webp"><img src="images/look-06.jpg" alt="Asior look 06" width="800" height="1200" loading="lazy" decoding="async"></picture></div>
    </div>
  </section>

  <!-- ===== Customer looks =====================================
       The extensible slot the lookbook is meant to grow into. It stays
       commented out rather than rendering an empty "be the first"
       state, because an empty community section advertises that there
       is no community.

       To turn it on: populate window.ASIOR_CUSTOMER_LOOKS in
       assets/product-details.js with { image, handle, size, name,
       permission } entries -- every one of which needs the wearer's
       recorded permission, a real product handle so the look links to
       the piece, and the size worn so it doubles as fit evidence.
       Then uncomment this section.

       <section class="customer-looks">
         <h2 class="rail-label">Worn by</h2>
         <div class="gallery" id="customerLooks"></div>
       </section>
       ========================================================= -->

  <!-- Testimonials removed. The two quotes that were here were not
     attributed to a named, permissioned person, and nobody has
     confirmed they came from real customers. Brief v6 section 6 says
     to delete them if that confirmation doesn't arrive, and the
     acceptance checklist requires that no review, rating or
     testimonial text renders anywhere on the site. Unverifiable social
     proof is the one thing on a storefront that is worse than none.
     Restore only with real names and permission on record. -->

  </main>

  <!-- FOOTER:START -->

    <div class="fmark">Asior</div>
    <div class="fmeta"><a href="mailto:hello@asiorclothing.com">hello@asiorclothing.com</a></div>
    <div class="social">
      <a href="https://www.instagram.com/asior_clothing/" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1"/></svg>
      </a>
      <a href="https://www.tiktok.com/@asiorclothing" aria-label="TikTok" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3h-3v12.1a2.7 2.7 0 1 1-2-2.6v-3.1a5.8 5.8 0 1 0 5 5.7V9.4a7.5 7.5 0 0 0 4 1.2V7.5c-2.1-.2-3.7-1.8-4-4.5z"/></svg>
      </a>
    </div>
    <div class="policy-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
      <a href="account.html">Account</a>
    </div>
  </footer>
  <!-- FOOTER:END -->

<script src="assets/site.js"></script>
<script src="assets/launch-config.js"></script>
<script src="assets/promo-config.js"></script>
<script>
  // Sitewide banner (the old email-signup teaser bar, replaced — see
  // scripts/build.js's comment on HEADER_FULL). This page doesn't
  // otherwise need launch-config.js, so it is
  // loaded here rather than assumed already present.

  const looks = document.querySelectorAll('.look');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add("in"), i * 60);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });
  looks.forEach(l => observer.observe(l));
</script>

</body>
</html>
