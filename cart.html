<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart | Asior</title>
<meta name="description" content="Your Asior cart.">
<meta name="theme-color" content="#0b0a08">
<link rel="canonical" href="https://asiorclothing.com/cart.html">
<!-- No search value, and the cart renders a different page per session. -->
<meta name="robots" content="noindex, follow">

<!-- Open Graph. Social crawlers never run JavaScript, so these have to be
     real tags in the served HTML or a shared link renders as a bare URL. -->
<meta property="og:site_name" content="Asior">
<meta property="og:type" content="website">
<meta property="og:title" content="Cart | Asior">
<meta property="og:description" content="Your Asior cart.">
<meta property="og:url" content="https://asiorclothing.com/cart.html">
<meta property="og:image" content="https://asiorclothing.com/assets/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Asior — limited drops, made in small batches">
<meta name="twitter:card" content="summary_large_image">

<!-- Fonts via <link>, not @import inside a style block: an @import means the
     browser has to download and parse the CSS before it even discovers
     the font request. Weight 200 was requested site-wide and used
     nowhere, so it is not requested here. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="preload" href="assets/site.js" as="script">
<!-- Still needed for DROP_CLOSE_TIME (assets/drop-countdown.js) —
     nothing to do with the Early Access gate, which is retired; see
     shop.html's equivalent comment for why. -->
<script src="assets/launch-config.js"></script>
<script src="assets/promo-config.js"></script>
<style>
  @media (hover: hover) and (pointer: fine) {
    header nav a:hover::after { width: 100%; }
  }

  @keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- cart ---------- */
  .cart-wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 40px 14vh;
    animation: pageFadeIn 700ms var(--ease-out);
  }

  .cart-empty {
    padding: 6vh 0;
    color: var(--muted);
    font-size: 13px;
  }

  .cart-empty a { text-decoration: underline; color: var(--ink); }

  /* Same fix as shop.html/product.html: don't show nothing while the
     live cart fetch is in flight. A visitor with items already in
     their cart is close to checkout -- a page that looks broken here
     is a lost sale one step from the finish line. */
  .cart-loading {
    padding: 6vh 0;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .cart-loading.hide { display: none; }

  .cart-item {
    display: grid;
    grid-template-columns: 76px 1fr auto auto;
    align-items: center;
    gap: 18px;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }

  .cart-item .thumb {
    width: 76px;
    height: 96px;
    border-radius: 2px;
    overflow: hidden;
  }

  .cart-item .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .cart-item .thumb .ph {
    width: 100%;
    height: 100%;
    background: linear-gradient(155deg, #1c1a16 0%, #100f0d 100%);
  }

  .cart-item .name {
    font-size: 13px;
    letter-spacing: 0.03em;
  }

  .cart-item .price {
    font-family: var(--font-mono);
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
  }

  .cart-item .qty {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .cart-item .remove {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 200ms var(--ease-out), transform 140ms var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .cart-item .remove:hover { color: var(--ink); }
  }

  .cart-item .remove:active { transform: scale(0.94); }

  .cart-summary {
    margin-top: 30px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
  }

  .cart-summary .amount { font-family: var(--font-mono); font-size: 16px; }

  /* Discount code. Deliberately quiet and below the subtotal: a loud
     "HAVE A PROMO CODE?" box next to the total invites everyone to
     leave and hunt for one. The people who have a code came from an
     email or a text and are looking for this field; nobody else needs
     it pulled to their attention. */
  .cart-discount { margin-top: 14px; }

  .cart-discount-form { display: flex; gap: 8px; }

  .cart-discount-form input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .cart-discount-form input::placeholder { letter-spacing: 0.03em; text-transform: none; color: var(--muted); }
  .cart-discount-form input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

  .cart-discount-form button {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 16px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .cart-discount-form button[disabled] { opacity: 0.5; cursor: default; }

  @media (hover: hover) and (pointer: fine) {
    .cart-discount-form button:not([disabled]):hover { border-color: var(--ink); }
  }

  /* Empty by default so an untouched cart shows no status row at all. */
  .cart-discount-msg:empty { display: none; }

  .cart-discount-msg {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--muted);
  }

  .cart-discount-msg.is-error { color: var(--ink); }

  .cart-discount-applied {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-top: 14px;
    font-size: 12px;
    letter-spacing: 0.03em;
  }

  .cart-discount-applied .clear {
    border: 0;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0;
  }

  @media (hover: hover) and (pointer: fine) {
    .cart-discount-applied .clear:hover { color: var(--ink); }
  }

  /* Only ever rendered when a code came back applicable — i.e. when the
     shopper really is paying the lower number. Never a compare-at
     price we invented. */
  .cart-summary .was {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    text-decoration: line-through;
    margin-right: 8px;
  }

  /* Sign-up value prop. Sits with the countdown, states the real close
     instant and the real welcome discount (5%, the Shopify SIGNUP
     pool) — no other number. */
  .cart-signup-prop {
    margin-top: 12px;
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.03em;
    color: var(--muted);
    text-align: center;
  }

  .cart-signup-prop a { color: var(--ink); }

  .cart-trust {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--muted);
    text-align: center;
  }

  .cart-klaviyo {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    text-align: center;
  }

  .cart-klaviyo-label {
    font-family: var(--font-mono);
    margin-bottom: 16px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .cart-signup-form {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 18px;
    flex-wrap: wrap;
  }

  .cart-signup-form input {
    background: none;
    border: none;
    border-bottom: 1px solid var(--field-line);
    padding: 8px 2px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 300;
    color: var(--ink);
    min-width: 150px;
    transition: border-color 0.3s ease;
  }

  .cart-signup-form input::placeholder { color: var(--muted); }
  .cart-signup-form input:focus { border-color: var(--ink); }

  .cart-signup-form button {
    position: relative;
    background: none;
    border: none;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    padding-bottom: 6px;
    transition: transform 160ms var(--ease-out);
  }

  .cart-signup-form button::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--ink);
    transition: width 300ms var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .cart-signup-form button:hover::after { width: 100%; }
  }

  .cart-signup-form button:not([disabled]):active { transform: scale(0.96); }
  .cart-signup-form button[disabled] { opacity: 0.5; cursor: not-allowed; }

  .cart-signup-confirm {
    display: none;
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .cart-signup-confirm.show { display: block; }

  /* Filled, not outlined — same reasoning as product.html's .pd-add:
     checkout is the dominant action on this page and shouldn't share
     visual weight with the signup form underneath it. */
  .checkout-btn {
    margin-top: 24px;
    width: 100%;
    background: var(--ink);
    color: var(--bg);
    border: 0;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 16px;
    cursor: pointer;
    transition: opacity 200ms var(--ease-out), transform 160ms var(--ease-out);
  }

  @media (hover: hover) and (pointer: fine) {
    .checkout-btn:hover { opacity: 0.85; }
  }

  .checkout-btn:active { transform: scale(0.985); }

  @media (max-width: 640px) {
    header { padding: 20px; font-size: 10px; letter-spacing: 0.1em; }
    header .mark { font-size: 12px; }
    header nav { gap: 16px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; min-width: 0; max-width: calc(100vw - 130px); }
    header nav::-webkit-scrollbar { display: none; }
    .cart-wrap { padding: 0 20px 10vh; }
    .cart-item { grid-template-columns: 60px 1fr auto; }
    .cart-item .qty { grid-column: 2 / 3; }
  }

  @media (prefers-reduced-motion: reduce) {
    .signup, .cart-wrap {
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>

<script src="assets/site.js"></script>
<script src="assets/drop-countdown.js"></script>
<script>
  // Storefront + Klaviyo plumbing lives in assets/site.js. The SMS
  // consent copy shown next to the phone field is what makes the
  // marketing subscription this triggers legitimate — see site.js.
  const A = window.Asior;
  const klaviyoSubscribe = A.klaviyoSubscribe;

  // Sitewide banner (the old email-signup teaser bar, replaced — see
  // scripts/build.js's comment on HEADER_FULL). cart.html is the
  // closest thing to a "checkout" page in this codebase — the real
  // checkout is Shopify-hosted, off-repo, and out of reach here.
  if (A.renderDropCountdown) {
    A.renderDropCountdown({
      el: document.getElementById('teaserBar'),
      prefix: 'fall drop closes — ',
      // Verified shipping offer rides along in the same bar; null when
      // nothing is confirmed, in which case nothing is appended.
      suffix: window.Asior.freeShippingBadge && window.Asior.freeShippingBadge(),
      closedText: 'fall drop closed',
    });
  }

  /* Discount code entry.

     Applies exactly what the shopper typed, then re-renders from a
     fresh read of the cart so the number on screen is Shopify's, not
     one we computed optimistically. An inapplicable code says so and
     changes no price. Nothing here ever applies a code on its own. */
  function bindDiscountForm(cartId) {
    const form = document.getElementById('cartDiscountForm');
    const clear = document.getElementById('cartDiscountClear');
    if (clear) {
      clear.addEventListener('click', async () => {
        clear.disabled = true;
        try {
          await A.applyDiscountCodes(cartId, []);
          await renderLive();
        } catch (err) {
          console.error('Could not remove discount code:', err);
          clear.disabled = false;
          setDiscountMsg("Couldn't remove that code right now. Try again.", true);
        }
      });
    }
    if (!form) return;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('cartDiscountInput');
      const btn = document.getElementById('cartDiscountBtn');
      const code = (input.value || '').trim();
      if (!code) { setDiscountMsg('Enter a code first.', true); input.focus(); return; }

      btn.disabled = true;
      const label = btn.textContent;
      btn.textContent = 'Applying…';
      setDiscountMsg('');
      try {
        const codes = await A.applyDiscountCodes(cartId, [code]);
        const hit = codes.find(c => c.code.toLowerCase() === code.toLowerCase());
        // Shopify's verdict, not ours. Re-render either way: on a hit
        // so the struck-through subtotal comes from the refetched cart,
        // on a miss so the field shows the rejected code back.
        await renderLive();
        if (!hit || !hit.applicable) {
          setDiscountMsg("That code isn't valid for the items in your cart.", true);
        }
      } catch (err) {
        console.error('Could not apply discount code:', err);
        btn.disabled = false;
        btn.textContent = label;
        setDiscountMsg("Couldn't check that code right now. Try again.", true);
      }
    });
  }

  function setDiscountMsg(text, isError) {
    const el = document.getElementById('cartDiscountMsg');
    if (!el) return;
    el.textContent = text || '';
    el.classList.toggle('is-error', !!isError && !!text);
  }

  function bindCartSignupForm() {
    const form = document.getElementById('cartSignupForm');
    if (!form) return;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('cartSignupBtn');
      const confirmEl = document.getElementById('cartSignupConfirm');
      const email = document.getElementById('cartSignupEmail').value;
      const phone = document.getElementById('cartSignupPhone').value;

      btn.disabled = true;
      try {
        await klaviyoSubscribe(email, phone);
        // Same event name and attribution shape as the gate's signup
        // (index.html), so this surface isn't a blind spot next to it —
        // a cart signup was previously untracked entirely.
        A.klaviyoTrack('Early Access Signup',
          Object.assign({ source: 'website', signup_location: 'cart', campaign: 'fall_2026', interest: 'fall_collection' },
            A.getUTMParams()),
          { email: email });
        form.style.display = 'none';
        confirmEl.textContent = "You're in. Check your inbox for your code.";
        confirmEl.classList.add('show');
      } catch (err) {
        confirmEl.textContent = 'Something went wrong, try again in a moment.';
        confirmEl.classList.add('show');
        btn.disabled = false;
      }
    });
  }

  const shopifyFetch = A.shopifyFetch;

  async function getShopifyCart() {
    const id = localStorage.getItem('shopify_cart_id');
    if (!id) return null;
    const data = await shopifyFetch(`
      query($id: ID!) {
        cart(id: $id) {
          id
          checkoutUrl
          cost { subtotalAmount { amount currencyCode } }
          discountCodes { code applicable }
          discountAllocations { discountedAmount { amount currencyCode } }
          lines(first: 50) {
            edges {
              node {
                id
                quantity
                merchandise {
                  ... on ProductVariant {
                    title
                    price { amount currencyCode }
                    image { url }
                    product { title }
                  }
                }
              }
            }
          }
        }
      }
    `, { id });
    return data.cart;
  }

  async function removeShopifyLine(lineId) {
    const cartId = localStorage.getItem('shopify_cart_id');
    await shopifyFetch(`
      mutation($cartId: ID!, $lineIds: [ID!]!) {
        cartLinesRemove(cartId: $cartId, lineIds: $lineIds) { cart { id } }
      }
    `, { cartId, lineIds: [lineId] });
  }

  /* Money in, money out — no rounding invention. Shopify hands back
     decimal strings; this only formats what it was given. */
  function money(amount, currency) {
    var n = Number(amount);
    if (!isFinite(n)) return '';
    var sign = currency === 'USD' || !currency ? '$' : '';
    return sign + n.toFixed(2);
  }

  /* Sign-up value prop. The close instant comes from dropCloseLabel(),
     which reads the same DROP_CLOSE_TIME as every countdown on the
     site, so the date here can never drift from the clock above it.
     5% is the real welcome code (Shopify SIGNUP pool) — no other
     number goes in this sentence. If the date can't be formatted the
     sentence drops it rather than printing a blank. */
  function signupPropHTML(href) {
    var when = window.Asior.dropCloseLabel && window.Asior.dropCloseLabel();
    var closes = when ? 'Fall drop closes ' + A.escapeHtml(when) + '. ' : '';
    return closes + '<a href="' + href + '">Sign up and get 5% off your first order.</a>';
  }

  async function renderLive() {
    const root = document.getElementById('cartRoot');
    const cart = await getShopifyCart();
    document.getElementById('cartLoading').classList.add('hide');

    if (!cart || cart.lines.edges.length === 0) {
      root.innerHTML = `<div class="cart-empty">Your cart is empty. <a href="shop.html">Shop all</a></div>`;
      return;
    }

    const rows = cart.lines.edges.map(({ node }) => {
      const v = node.merchandise;
      const media = v.image ? `<img src="${v.image.url}" alt="${v.product.title}" width="${v.image.width || 300}" height="${v.image.height || 400}" loading="lazy" decoding="async">` : `<div class="ph"></div>`;
      return `
        <div class="cart-item">
          <div class="thumb">${media}</div>
          <div>
            <div class="name">${v.product.title}</div>
            <div class="price">$${v.price.amount}</div>
          </div>
          <div class="qty">Qty ${node.quantity}</div>
          <button class="remove" data-line="${node.id}">Remove</button>
        </div>`;
    }).join('');

    // What Shopify says about any code on this cart. `applicable` is
    // its call, not ours — an inapplicable code discounts nothing and
    // must leave the price untouched.
    const codes = cart.discountCodes || [];
    const applied = codes.filter(c => c.applicable);
    const rejected = codes.filter(c => !c.applicable);
    const off = A.cartDiscountTotal(cart);
    const gross = parseFloat(cart.cost.subtotalAmount.amount);
    const currency = cart.cost.subtotalAmount.currencyCode;

    // Strike the original through ONLY when a code really applied and
    // real money came off. Anything else shows one plain price.
    const showsDiscount = applied.length > 0 && off > 0;
    const summary = showsDiscount
      ? `<span>Subtotal</span>
         <span class="amount">
           <span class="was">${money(gross, currency)}</span>${money(gross - off, currency)}
         </span>`
      : `<span>Subtotal</span>
         <span class="amount">${money(gross, currency)}</span>`;

    const appliedRow = showsDiscount ? `
      <div class="cart-discount-applied">
        <span>${A.escapeHtml(applied[0].code)} applied, −${money(off, currency)}</span>
        <button type="button" class="clear" id="cartDiscountClear">Remove</button>
      </div>` : '';

    const initialMsg = rejected.length && !showsDiscount
      ? `That code isn't valid for the items in your cart.` : '';

    root.innerHTML = `
      ${rows}
      <div class="cart-summary">${summary}</div>
      ${appliedRow}
      <div class="cart-discount">
        <form class="cart-discount-form" id="cartDiscountForm">
          <label class="sr-only" for="cartDiscountInput">Discount code</label>
          <input type="text" id="cartDiscountInput" name="code" placeholder="Discount code"
                 autocomplete="off" autocapitalize="characters" spellcheck="false"
                 value="${rejected.length ? A.escapeHtml(rejected[0].code) : ''}">
          <button type="submit" id="cartDiscountBtn">Apply</button>
        </form>
        <p class="cart-discount-msg${initialMsg ? ' is-error' : ''}" id="cartDiscountMsg"
           role="status" aria-live="polite">${initialMsg}</p>
      </div>
      <button class="checkout-btn" id="checkoutBtn">Checkout</button>
      <div class="cart-trust">
        <span>${A.escapeHtml(A.shippingLine())}</span>
        <span>No account needed, check out as a guest.</span>
      </div>
      <p class="cart-signup-prop">${signupPropHTML('#cartSignup')}</p>
      <div class="cart-klaviyo" id="cartSignup">
        <div class="cart-klaviyo-label">Get 5% Off Your First Order</div>
        <form class="cart-signup-form" id="cartSignupForm">
          <label class="sr-only" for="cartSignupEmail">Email address</label>
          <input type="email" id="cartSignupEmail" name="email" placeholder="Email"
                 autocomplete="email" spellcheck="false" required>
          <label class="sr-only" for="cartSignupPhone">Phone number (optional)</label>
          <input type="tel" id="cartSignupPhone" name="phone" placeholder="Phone (optional)"
                 autocomplete="tel" inputmode="tel">
          <button type="submit" id="cartSignupBtn">Sign Up</button>
        </form>
        <p class="consent">
          Email only? Leave the phone field blank. By giving your number you agree to
          receive recurring automated marketing texts from Asior at that number.
          Consent is not a condition of any purchase. Message frequency varies and
          message &amp; data rates may apply. Reply STOP to cancel, HELP for help. See our
          <a href="privacy-policy.html">Privacy Policy</a> and
          <a href="terms-of-service.html">Terms of Service</a>.
        </p>
        <div class="cart-signup-confirm" id="cartSignupConfirm" role="status" aria-live="polite">You're in. Check your inbox for your code.</div>
      </div>
    `;

    document.querySelectorAll('.remove').forEach(btn => {
      btn.addEventListener('click', async () => {
        await removeShopifyLine(btn.getAttribute('data-line'));
        renderLive();
      });
    });

    document.getElementById('checkoutBtn').addEventListener('click', () => {
      location.href = cart.checkoutUrl;
    });
    bindDiscountForm(cart.id);
    bindCartSignupForm();
  }

  renderLive().catch((err) => {
    // Fail open, honestly: if the live Shopify fetch itself fails
    // (network, API hiccup), say so instead of leaving a blank cart.
    console.error('Cart failed to load:', err);
    document.getElementById('cartLoading').classList.add('hide');
    document.getElementById('cartRoot').innerHTML = `
      <div class="cart-empty">Couldn't load your cart right now. Try refreshing, or email <a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a> with what you wanted and we'll sort it out.</div>
    `;
  });
</script>

</body>
</html>
