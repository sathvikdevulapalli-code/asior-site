<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asior — The Jaguar Drop, Coming Soon</title>
<meta name="description" content="The Asior Jaguar drop lands soon. Sign up for early access — limited run, made in small batches, gone once it sells out.">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="https://asiorclothing.com/">

<!-- Open Graph. Social crawlers never run JavaScript, so these have to be
     real tags in the served HTML or a shared link renders as a bare URL. -->
<meta property="og:site_name" content="Asior">
<meta property="og:type" content="website">
<meta property="og:title" content="Asior — The Jaguar Drop, Coming Soon">
<meta property="og:description" content="The Asior Jaguar drop lands soon. Sign up for early access — limited run, made in small batches, gone once it sells out.">
<meta property="og:url" content="https://asiorclothing.com/">
<meta property="og:image" content="https://asiorclothing.com/assets/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Asior — the Jaguar drop, coming soon">
<meta name="twitter:card" content="summary_large_image">

<!-- One webfont, one weight. Unbounded / Inter / IBM Plex Mono are not
     requested on this page at all — the drop theme uses Archivo Narrow for
     display and plain system Helvetica for body copy, which costs nothing
     to download. Fonts via <link>, not @import: an @import would make the
     browser parse the CSS before it even discovers the font request. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="preload" href="assets/site.js" as="script">
<style>
  /* ===================================================================
     Drop landing page — deliberately locked.

     While the drop is closed this page IS the site. No nav, no header,
     no teaser bar, no links into the store: the only thing a visitor
     can do here is join the early-access list. The store pages still
     exist on disk and still respond at their own URLs, but nothing on
     this page routes to them.

     The palette and type scale are overridden here rather than in
     assets/site.css so the unlinked store pages keep the look they
     were built for. If the store ever reopens on this theme, these
     tokens are what moves up into site.css.
     =================================================================== */

  :root {
    /* True black, not the warm near-black the rest of the site uses:
       the drop is black-on-black, and #0b0a08 reads brown next to the
       greyscale jaguar print. */
    --bg: #000000;
    --ink: #f2f2f0;
    --muted: #8f8f8a;   /* 6.0:1 on black */
    --line: #1e1e1c;
    --field-line: #6f6f6a;  /* 4.1:1 — these ARE 1.4.11 components */

    /* Display face, every heading / button / label, always uppercase.
       Body copy — anything you read as a sentence — stays Helvetica. */
    --font-display: 'Archivo Narrow', 'Arial Narrow', Helvetica, Arial, sans-serif;
    --font-body: Helvetica, Arial, sans-serif;
    --font-mono: var(--font-display);
  }

  /* No motion anywhere on this page. assets/site.css ships transitions
     on the footer links and shared fields, so this kills them at the
     root rather than leaving half the page animated and half not.
     Everything that changes here changes instantly, in direct response
     to a press or a scroll. */
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }

  html { scroll-behavior: auto; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Jaguar print, at the very bottom of the page's tonal range: the
     motif is meant to be felt as a grain in the black, not seen as a
     pattern. Small tile and 0.022 opacity — if you can name the animal
     without looking for it, it's turned up too far. */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url('images/swatch.jpg');
    background-size: 150px;
    background-repeat: repeat;
    filter: grayscale(1);
    opacity: 0.022;
    pointer-events: none;
    z-index: 0;
  }

  main, footer { position: relative; z-index: 1; }

  main {
    flex: 1;
    padding: clamp(56px, 9vh, 100px) 0 clamp(44px, 7vh, 76px);
  }

  /* Everything except the photo strip, which runs full-bleed. */
  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 0 24px;
    text-align: center;
  }

  /* ---------- wordmark ----------
     Archivo Narrow 700, which is Peace and War's heading face, at close
     to the size they actually set it: their whole page tops out at 24px
     type. A billboard wordmark is the opposite of that page, so this is
     a mark rather than a hero. */
  .wordmark {
    font-family: var(--font-display);
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(2rem, 6vw, 3.25rem);
    line-height: 1;
    letter-spacing: 0.06em;
    color: var(--ink);
  }

  .status {
    margin-top: 18px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- early access ----------
     No section heading and no explanatory line above the form. "Dropping
     soon" and the button's own label already say what this is for, and
     anything more is writing for its own sake on a page with one job. */
  .signup { margin-top: clamp(30px, 5vh, 46px); }

  .drop h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .form {
    max-width: 340px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Boxed rather than the underline fields used elsewhere on the site:
     centred on a black page an underline reads as a stray rule, and the
     box is the direct translation of the solid-bordered field on the
     reference layout. */
  .form input {
    width: 100%;
    background: transparent;
    border: 1px solid var(--field-line);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    text-align: center;
    padding: 13px 14px;
  }

  .form input::placeholder { color: var(--muted); }
  .form input:hover { border-color: var(--muted); }
  .form input:focus { outline: none; border-color: var(--ink); }
  .form input:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  .form button {
    width: 100%;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #000;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
  }

  .form button[disabled] { opacity: 0.45; cursor: not-allowed; }

  /* Kept in the DOM at all times so the live region is there to announce
     into; :empty is what hides it, not a class toggle. */
  .confirm {
    margin-top: 18px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .confirm:empty { display: none; margin-top: 0; }

  /* ---------- the drop ---------- */
  .showcase {
    margin-top: clamp(44px, 7vh, 76px);
    padding-left: 25px;
    overflow: hidden;
  }

  .strip {
    display: flex;
    gap: 10px;
    overflow-x: scroll;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .strip::-webkit-scrollbar { display: none; }
  .strip:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  .shot {
    flex: 0 0 auto;
    scroll-snap-align: start;
    width: 280px;
    aspect-ratio: 2 / 3;
    overflow: hidden;
    background: #0d0d0c;
  }

  .shot img { width: 100%; height: 100%; object-fit: cover; }

  /* Scroll position, not a progress animation — the thumb only ever
     moves because a finger or a wheel moved it. */
  .track {
    position: relative;
    width: 70%;
    height: 4px;
    margin: 25px auto 0;
    border-radius: 2px;
    background: #2a2a28;
  }

  .thumb {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    border-radius: 2px;
    background: var(--ink);
  }

  .drop { margin-top: clamp(36px, 6vh, 60px); }

  .drop p {
    max-width: 44ch;
    margin: 12px auto 0;
    font-size: 14px;
    line-height: 1.5rem;
    color: var(--muted);
  }

  /* ---------- footer ----------
     Only what has to be here: how to reach Asior, where the brand posts,
     and the two policies. No route back into the store. */
  footer { padding: 40px 24px 44px; }

  footer .fmark {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  @media (max-width: 749px) {
    .drop h2 { font-size: 20px; }
    .showcase { padding-left: 15px; }
    .shot { width: 180px; }
    .track { margin-top: 19px; height: 3px; }
  }
</style>
</head>
<body>

  <main id="main">

    <div class="wrap">
      <h1 class="wordmark">Asior</h1>
      <!-- Swap this line for the real date once it's locked, e.g.
           "Dropping 04.11.26". Until then it stays vague on purpose —
           an announced date that slips costs more than it earns. -->
      <p class="status">Dropping soon</p>

      <!-- id kept as "signup": every other page on the site still links
           to index.html#signup. -->
      <section class="signup" id="signup">
        <!-- Real signup: calls Klaviyo's public Client API directly (no
             widget), same real list the Email &amp; SMS popup form feeds.

             EMAIL ONLY, on purpose. The phone field is gone, and the seven
             lines of TCPA consent copy that legally had to sit under it went
             with it — that block was most of the writing on the page. Putting
             SMS capture back means putting that copy back: 47 CFR 64.1200(f)
             requires prior express WRITTEN consent, visible at the point of
             collection, and Klaviyo subscribes a number to a MARKETING list
             the moment it is submitted. There is no compliant version of this
             form that takes a phone number quietly. -->
        <form class="form" id="signupForm">
          <label class="sr-only" for="signupEmail">Email address</label>
          <input type="email" id="signupEmail" name="email" placeholder="Email"
                 autocomplete="email" spellcheck="false" required>
          <button type="submit" id="signupBtn">Get Early Access</button>
        </form>

        <div class="confirm" id="signupConfirm" role="status" aria-live="polite"></div>
      </section>
    </div>

    <!-- The drop itself. Photographs only: nothing here is a link, because
         there is nowhere to go yet. tabindex makes the strip scrollable
         from the keyboard, which an overflow container isn't by default in
         every browser. -->
    <section class="showcase">
      <div class="strip" id="strip" tabindex="0" role="region" aria-label="The Jaguar drop">
        <div class="shot"><img src="images/look-01.jpg" alt="Black Asior tee with jaguar-print patches, worn with black shorts" width="800" height="1200" loading="lazy" decoding="async"></div>
        <div class="shot"><img src="images/look-02.jpg" alt="Black Asior polo with jaguar-print collar and cuff trim" width="800" height="1200" loading="lazy" decoding="async"></div>
        <div class="shot"><img src="images/look-04.jpg" alt="Two looks in all black — jaguar-print tees with black shorts" width="800" height="1200" loading="lazy" decoding="async"></div>
        <div class="shot"><img src="images/look-05.jpg" alt="Back of a black Asior tee with the script logo in white" width="800" height="1200" loading="lazy" decoding="async"></div>
        <div class="shot"><img src="images/look-06.jpg" alt="Asior sweat shorts with a jaguar-print side stripe" width="674" height="1200" loading="lazy" decoding="async"></div>
        <div class="shot"><img src="images/look-03.jpg" alt="Two looks — black Asior tees with Asior sweat shorts" width="800" height="1200" loading="lazy" decoding="async"></div>
      </div>
      <div class="track" id="stripTrack" aria-hidden="true"><div class="thumb" id="stripThumb"></div></div>
    </section>

    <div class="wrap">
      <section class="drop">
        <h2>The Jaguar Drop</h2>
        <p>Once it sells out, it's gone.</p>
      </section>
    </div>

  </main>

  <footer>
    <div class="fmark">Asior</div>
    <div class="fmeta"><a href="mailto:asiorclothing@gmail.com">asiorclothing@gmail.com</a></div>
    <div class="social">
      <a href="https://www.instagram.com/asior_clothing/" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1"/></svg>
      </a>
      <a href="https://www.tiktok.com/@asiorclothing" aria-label="TikTok" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3h-3v12.1a2.7 2.7 0 1 1-2-2.6v-3.1a5.8 5.8 0 1 0 5 5.7V9.4a7.5 7.5 0 0 0 4 1.2V7.5c-2.1-.2-3.7-1.8-4-4.5z"/></svg>
      </a>
    </div>
    <div class="policy-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
    </div>
  </footer>

<script src="assets/site.js"></script>
<script>
  const A = window.Asior;

  // Which drop these signups belong to. It rides along on the Klaviyo
  // event as a property, so a flow can target "signed up for THIS drop"
  // instead of blasting the whole list. Change it when the next one is
  // teased.
  const DROP_NAME = 'Jaguar';

  const signupForm = document.getElementById('signupForm');
  const signupBtn = document.getElementById('signupBtn');
  const signupConfirm = document.getElementById('signupConfirm');

  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    signupBtn.disabled = true;
    const email = document.getElementById('signupEmail').value;

    try {
      // Second argument is the phone number; this page never collects one.
      await A.klaviyoSubscribe(email);
      // Fire and forget — klaviyoTrack swallows its own failures, and a
      // missing analytics event must never look like a failed signup.
      A.klaviyoTrack('Early Access Signup', { drop: DROP_NAME }, { email: email });
      signupForm.style.display = 'none';
      signupConfirm.textContent = "You're on the list. Watch your inbox.";
    } catch (err) {
      signupConfirm.textContent = 'Something went wrong — try again in a moment.';
      signupBtn.disabled = false;
    }
  });

  // Where you are in the photo strip. The track is hidden outright when
  // every shot already fits, rather than showing a full-width thumb that
  // looks broken.
  const strip = document.getElementById('strip');
  const stripTrack = document.getElementById('stripTrack');
  const stripThumb = document.getElementById('stripThumb');

  function syncStrip() {
    const overflowing = strip.scrollWidth > strip.clientWidth + 1;
    stripTrack.hidden = !overflowing;
    if (!overflowing) return;
    stripThumb.style.width = (strip.clientWidth / strip.scrollWidth * 100) + '%';
    stripThumb.style.left = (strip.scrollLeft / strip.scrollWidth * 100) + '%';
  }

  strip.addEventListener('scroll', syncStrip, { passive: true });
  window.addEventListener('resize', syncStrip);
  syncStrip();
</script>

</body>
</html>
